schema_version: bitter.frontier_wire.v0
wire_id: "2026-08-10"
date: 2026-08-10
lede: >
  Claude Code made its auto-mode classifier the default for Pro, Max and Team
  plans. Cloudflare spent a launch week proposing how websites should talk back
  to agents, and OpenAI published what happened when its models went to
  third-party cyber evaluators, five days after Anthropic did the same.
items:
  - title: "Auto mode is now the default in Claude Code for Pro, Max, and Team plans"
    url: https://simonwillison.net/2026/Aug/8/auto-mode/
    source: Simon Willison
    date: 2026-08-08
    tier: checked
    receipt: https://code.claude.com/docs/en/permission-modes
    take: >
      The switch is confirmed in Anthropic's permission-modes documentation, and
      the case for it is measured: in a published study, testers caught a clearly
      dangerous command about one time in seven and got worse the longer they
      worked, while the classifier caught it about nine times in ten and stayed
      flat. What to carry away is that a boundary you state in conversation is
      not stored as a rule. The documentation recommends a deny rule if you
      want a hard guarantee.

  - title: "The Agent Access Model"
    url: https://blog.cloudflare.com/the-agent-access-model/
    source: Cloudflare
    date: 2026-08-05
    tier: relayed
    take: >
      Cloudflare's proposal for how a site decides what an agent may do,
      published the same week it shipped an agent-first browser, a programmable
      wallet and a way to give any website an MCP interface. It is a position
      paper from one vendor, not a standard. It is also the most complete public
      attempt so far at a question the harness makers have left alone: what the
      other end of the connection should do.

  - title: "Give any website a WebMCP interface"
    url: https://blog.cloudflare.com/webmcp/
    source: Cloudflare
    date: 2026-08-06
    tier: relayed
    take: >
      The implementation behind the access-model paper. If it lands, an agent
      stops scraping a page and starts calling an interface the site declares.
      On this beat the security model tends to arrive after the adoption, so
      ask what a site's declared interface lets an agent do before you point one
      at it.

  - title: "Third-party cyber evaluations involving OpenAI models"
    url: https://openai.com/index/third-party-cyber-evaluations-involving-openai-models
    source: OpenAI
    date: 2026-08-04
    tier: relayed
    take: >
      OpenAI's account of its models in third-party cyber evaluations, five days
      after Anthropic's disclosure on the 08-03 wire that a model reached real
      systems from an evaluation environment. Two labs now describe a capable
      model meeting a harness built to be permissive on purpose. If you run
      evaluations, the environment is a production system and needs the egress
      controls of one.

  - title: "Zawinski's Law of MultiAgents"
    url: https://www.latent.space/p/ainews-zawinskis-law-of-multiagents
    source: Latent Space
    date: 2026-08-08
    tier: relayed
    take: >
      Every agent product expands until it can orchestrate other agents. It is a
      joke, and meta-harnesses that wrap other coding agents keep appearing to
      support it. If it keeps holding, the question stops being which harness
      you run and becomes which one is running the others, and whose permission
      rules win.
