schema_version: bitter.frontier_wire.v0
wire_id: "2026-08-20"
date: 2026-08-20
lede: >
  Three days, one migration told twice: OpenAI says Asana cleared five years of
  test-framework work in two weeks with Codex, and Pragmatic Engineer asks what
  agents actually changed about migrations. Around it, a sandbox measured rather than
  launched and an argument for keeping a privileged core.
items:
  - title: "The Pulse: We need to talk about migrations with AI"
    url: https://newsletter.pragmaticengineer.com/p/the-pulse-we-need-to-talk-about-migrations
    source: Gergely Orosz
    date: 2026-08-20
    tier: relayed
    take: >
      Orosz on why some migrations sat untouched for years: the serial step was
      human attention, and agents changed that bottleneck without changing
      whether the result is right. Asana's test-framework move, told by OpenAI
      below, is one of his cases. Read his framing before the vendor's number.

  - title: "The /wayfinder Skill: Navigating the Fog of War of Planning"
    url: https://www.latent.space/p/wayfinder-skill
    source: Latent Space
    date: 2026-08-20
    tier: relayed
    take: >
      Matt Pocock on a skill for the moment the next step is unclear. It sits on
      top of Claude Code rather than inside it, which is where much of the new
      planning help is being built. A skill is an instruction the model may
      follow, not a control the harness enforces.

  - title: "Asana cleared 5 years of engineering work in 2 weeks with Codex"
    url: https://openai.com/index/asana
    source: OpenAI
    date: 2026-08-18
    tier: relayed
    take: >
      The vendor's telling. "Five years in two weeks" is OpenAI's framing, and
      we have not seen how the five years were counted. The migration may
      well have happened; the compression ratio is a claim without a method. Do
      not quote it as a benchmark.

  - title: "smolmachines / smolvm as a sandbox for untrusted Python and JavaScript"
    url: https://simonwillison.net/2026/Aug/19/smolmachines-untrusted-sandbox/
    source: Simon Willison
    date: 2026-08-19
    tier: relayed
    take: >
      Willison puts a fast sandbox through its paces for running
      untrusted Python and JavaScript. It is a practitioner's measurement, not a
      launch post, which makes it a useful reference if you are choosing where
      agent-written code runs. The results are his, on his workloads.

  - title: "Quoting Jeremy Morrell"
    url: https://simonwillison.net/2026/Aug/19/jeremy-morrell/
    source: Simon Willison
    date: 2026-08-19
    tier: relayed
    take: >
      Extensible software with a solid core and a sandboxed extension layer,
      cheaper to author because of LLMs. It is the opposite
      design from DeepSeek Harness, which put its approval gate in a plugin.
      If you are choosing between the two shapes, the question is which code
      you are willing to let an extension replace.

  - title: "Recovering Encrypted LLM Reasoning Traces"
    url: https://embracethered.com/blog/posts/2026/recovering-encrypted-llm-thoughts/
    source: Johann Rehberger
    date: 2026-08-17
    tier: relayed
    take: >
      Rehberger reproduces a paper on recovering encrypted reasoning traces from
      proprietary APIs. If it holds, a trace a vendor encrypts is not a trace
      you can assume stays private. The reproduction is his; we have not run it.
