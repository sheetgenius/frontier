schema_version: bitter.frontier_wire.v0
wire_id: "2026-08-17"
date: 2026-08-17
lede: >
  DeepSeek shipped a model on Wednesday and open-sourced a harness for it on
  Thursday. Flue, a meta-harness on the watchlist, grew React-style hooks, and
  the most useful piece of the week asked whether test-first development inside
  the agent loop does anything at all.
items:
  - title: "TDD inside the agent loop - theater or actual value?"
    url: https://martinfowler.com/articles/exploring-gen-ai/tdd-in-the-agent-loop.html
    source: Martin Fowler
    date: 2026-08-11
    tier: relayed
    take: >
      Writing a failing test first was a discipline for a human who could not
      hold the whole change in their head. An agent has different limits, and
      the piece asks honestly whether the ritual transfers. If your agent
      instructions require TDD, this is the argument to read before you keep
      paying for it.

  - title: "React for Agents: Astro Creator Brings Hooks to his Meta-Harness, Flue"
    url: https://www.latent.space/p/flue-2
    source: Latent Space
    date: 2026-08-15
    tier: relayed
    take: >
      The clearest public account yet of where Flue is going: a hooks model for
      agent behaviour, from the creator of Astro. It is an interview, so the
      design is his description, not a shipped behavior. Before building on it,
      check whether the runtime enforces what a hook declares.

  - title: "DeepSeek V4 Pro 0813 (on OpenRouter)"
    url: https://simonwillison.net/2026/Aug/12/deepseek-v4-pro-0813/
    source: Simon Willison
    date: 2026-08-12
    tier: relayed
    take: >
      The model appeared on 12 August and the harness built around it was
      open-sourced on 13 August. When a lab ships the model and the thing that
      drives it a day apart, choosing the model starts to mean choosing its
      defaults for what the agent may do on your machine. Read the harness's
      permission settings along with the benchmark.

  - title: "How Cloudflare detects MCP traffic and helps secure it"
    url: https://blog.cloudflare.com/mcp-security-updates/
    source: Cloudflare
    date: 2026-08-14
    tier: relayed
    take: >
      Cloudflare says it can now fingerprint MCP traffic in transit. That is a
      sign the protocol has become infrastructure, and an uncomfortable one for
      anyone who assumed agent traffic looked like ordinary API calls. If your
      agents' calls cross a corporate network, assume they can be identified.

  - title: "Putting frontier cyber models in more trusted hands"
    url: https://openai.com/index/putting-frontier-cyber-models-in-more-trusted-hands
    source: OpenAI
    date: 2026-08-10
    tier: relayed
    take: >
      OpenAI on who gets its most capable cyber models, six days after its account
      of third-party evaluations on the 08-10 wire. Gating a capability by who
      is asking is a different control from gating it by what is asked, and
      the two fail differently. Access tiers are becoming a governance surface,
      and few teams audit them the way they audit permissions.

  - title: "How I use AI in 2026 (Coding, Writing, Learning, Assistant-ing)"
    url: https://blog.sshh.io/p/how-i-use-ai-in-2026-coding-writing
    source: Shrivu Shankar
    date: 2026-08-17
    tier: relayed
    take: >
      Shankar writes down the workflow he actually uses rather than a
      prediction. Accounts like this are the nearest thing to a control group
      for vendor productivity claims. It is one person's setup, so take the
      method, not the conclusions.
