schema_version: bitter.frontier_wire.v0
wire_id: "2026-07-22"
date: 2026-07-22
lede: >
  A prompt injection that exfiltrates through the terminal rather than the
  agent, a report that Grok's CLI uploaded local files, an Antigravity post that
  announced a fix on top of a headless mode that enforced nothing, and two
  writers arguing independently that reading old code just got cheap.
items:
  - title: "From Indirect Prompt Injection to DNS Exfiltration in macOS Terminal"
    url: https://embracethered.com/blog/posts/2026/macos-terminal-dillma-dns-exfil-ansi-escape-code-fix/
    source: Johann Rehberger
    date: 2026-07-16
    tier: relayed
    take: >
      Rehberger's write-up describes an attack that never asks the agent to run
      anything: ANSI escape sequences in model output make macOS Terminal do a
      DNS lookup, and the data leaves with it. If your threat model stops at the
      agent's tool calls, the terminal that renders its output is outside the
      model. The mechanism is his demonstration; we have not reproduced it.

  - title: "The Pulse: Grok's CLI caught uploading all your local files to the cloud"
    url: https://newsletter.pragmaticengineer.com/p/the-pulse-groks-cli-caught-uploading
    source: Pragmatic Engineer
    date: 2026-07-16
    tier: relayed
    take: >
      Pragmatic Engineer reports that Grok's CLI sent local files to the cloud
      wholesale. If that holds, it is the largest version yet of a coding CLI
      reaching past the directory it was given. It is their reporting, not a
      finding of ours; a vendor statement or a reproduction would settle it.

  - title: "Antigravity CLI 1.1.3 is out"
    url: https://x.com/shengzheyao/status/2077576699571741008
    source: "@shengzheyao"
    date: 2026-07-16
    tier: checked
    receipt: https://github.com/google-antigravity/antigravity-cli/blob/1.1.4/CHANGELOG.md
    take: >
      The post says headless mode "no longer hangs or silently auto-approves
      tools that need permission." Two days later the 1.1.4 changelog recorded
      that headless runs had only then begun honouring settings.json at all: not
      permissions, not file access, not sandbox mode. The announced fix sat on a
      mode that enforced nothing, and 1.1.4 got no post.

  - title: "The Archaeologist's Copilot"
    url: https://martinfowler.com/articles/archaeologist-copilot.html
    source: martinfowler.com
    date: 2026-07-16
    tier: relayed
    take: >
      Agents as a tool for understanding inherited code rather than producing
      new code. For anyone sitting on a system nobody still employed can explain,
      that is the cheaper first job to hand an agent. Willison makes the
      matching case four days later, below.

  - title: "Reverse-engineering is cheap now"
    url: https://simonwillison.net/2026/Jul/20/cheap-reverse-engineering/
    source: Simon Willison
    date: 2026-07-20
    tier: relayed
    take: >
      Willison argues that reading what somebody else built is now the cheap
      part, and he backs it with worked examples of his own rather than a
      benchmark. Hold vendor claims about what agents can do this month up
      against it. The examples are his, chosen by him.

  - title: "Claude Code uses Bun written in Rust now"
    url: https://simonwillison.net/2026/Jul/19/claude-code-in-bun-in-rust/
    source: Simon Willison
    date: 2026-07-19
    tier: relayed
    take: >
      Willison reports that Claude Code now runs on a Rust rewrite of Bun. A
      runtime swap under the CLI you run every day is the kind of change
      operators tend to meet as a startup regression before they meet it in a
      release note. If a launch misbehaves this month, check the runtime first.

  - title: "A Fireside Chat with Cat and Thariq from the Claude Code team"
    url: https://simonwillison.net/2026/Jul/21/cat-and-thariq/
    source: Simon Willison
    date: 2026-07-21
    tier: relayed
    take: >
      An annotated transcript, a better format than a clip. Its biggest claim,
      that Claude Code's system prompt shrank by roughly 80 percent for newer
      models, is the vendor's own account, and the changelog through v2.1.216
      records no such reduction. The direction is plausible; the magnitude is
      theirs.

  - title: "Pushing software engineering limits with napkin math"
    url: https://newsletter.pragmaticengineer.com/p/pushing-software-engineering-limits
    source: Pragmatic Engineer
    date: 2026-07-21
    tier: relayed
    take: >
      Estimation as the skill that survives. When an agent writes the code and
      you review it, the first question is whether the numbers in front of you
      are the right order of magnitude. That makes napkin math a review skill,
      not an interview exercise.

  - title: "Everyone Should Know SIMD"
    url: https://mitchellh.com/writing/everyone-should-know-simd
    source: Mitchell Hashimoto
    date: 2026-07-22
    tier: relayed
    take: >
      Hashimoto makes the case for understanding the machine at the level of
      vector instructions. Read it as the counterweight to delegating all the
      typing: knowing where the cycles go is what lets you tell whether the
      agent's fast code is actually fast.

  - title: "Claude Code 2.1.216: sandbox.filesystem.disabled"
    url: https://x.com/ClaudeCodeLog/status/2079333123645485200
    source: "@ClaudeCodeLog"
    date: 2026-07-20
    tier: checked
    receipt: https://code.claude.com/docs/en/changelog
    take: >
      Forty CLI changes, and the one to read is a new setting that turns off
      filesystem isolation while keeping network egress control. That is a
      legitimate configuration for some workloads and a foot-gun for others.
      Know which one you run before you set it.
