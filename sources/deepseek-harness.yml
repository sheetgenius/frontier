related_surfaces:
  standing_status: watched
  notes: >
    Harness is built on Cordis, a third-party composability framework, so the
    plugin boundary this harness sells is defined in someone else's repo. A
    change to Cordis can change what a dsh plugin may do without any commit
    landing in deepseek-harness. Attribute accordingly: a finding about the
    plugin contract must say which repo the behaviour comes from.
  repositories:
    - id: deepseek-harness
      url: https://github.com/deepseek-ai/deepseek-harness
      role: primary
    - id: cordis
      url: https://github.com/cordiverse/cordis
      role: upstream_framework
