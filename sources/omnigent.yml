operator_questions:
  - When an Omnigent policy and the underlying harness's own permission system disagree, which one refuses, and is that documented or only observed?
  - Are spend caps enforced before a call is made, or reconciled after it? A cap that reconciles is a report, not a control.
  - When a wrapped harness changes a permission surface, how long does the adapter lag, and what does an operator's policy mean during the gap?
  - The v0.7.0 router picks both harness and model. Can the governance layer an action lands under change without the operator choosing it?
  - Server-side transcription is a data path off the operator's machine. What is sent, what is retained, and is it opt-in?
  - Is the governance work in the tag an operator installs, or on main?
  - "Pre-1.0 and shipping weekly: what is the upgrade contract, and what breaks between minors?"
default_actionability:
  release: test
  docs_change: observe
  security_change: test
  breaking_change: adapt
  ecosystem_package: observe
  governance_change: test
discovery:
  last_verified: 2026-08-02
  verified_by: manual_web
  confidence: medium
  open_questions:
    - Which policy decisions are enforced in Omnigent's process versus delegated to the wrapped harness?
    - Does the adapter surface a harness's own refusal to the operator, or swallow it?
    - What is the canonical ship signal - the GitHub release, the tag, or a package publish?
    - Which of the governance features in the landing copy are on by default?
notes: >
  Added 2026-08-02 as the first meta-harness on the watchlist. Everything else
  here IS a harness; Omnigent orchestrates them, describing itself as "an
  open-source AI agent framework and meta-harness: orchestrate Claude Code,
  Codex, Cursor, Pi, and custom agents" and shipping policies, spend caps and
  access controls on top of harnesses that already have their own.

  That stacking is why it is worth tracking. This publication's standing
  argument is that a control existing only as an intention is not a control, and
  a meta-harness is the hardest test of it: two governance layers now have a
  claim on the same action, and an operator has to know which one refuses. That
  question has no public answer yet, which makes it the most interesting open
  item on the list.

  Release cadence at intake was roughly weekly, v0.2.0 through v0.7.0 between
  2026-06-19 and 2026-07-27, pre-1.0, so the tag-to-tag diff carries more than
  the release note. Two items in v0.7.0 deserve a second look: optional
  server-side transcription is a new data path off the operator's machine, and a
  router that selects the harness means the governance layer an action lands
  under can change without the operator choosing it.

  Handling: this is Tier 2 and weekly - do not promote on release velocity
  alone. A finding observed through Omnigent is a finding about the pair, not
  about the wrapped harness, and must say so. Adapter lag is a legitimate
  finding but is not a defect in the harness underneath. Closest comparison is
  Paperclip, and the contrast is the useful part: Paperclip manages an org of
  agents it owns, Omnigent orchestrates agents it does not.
