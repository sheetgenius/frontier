related_surfaces:
  standing_status: watched
  notes: >
    Omnigent drives harnesses this publication already tracks separately.
    Behaviour observed through it is a fact about the pair, never about either
    component alone, and a finding must say which.
  repositories:
    - id: omnigent
      url: https://github.com/omnigent-ai/omnigent
