operator_questions:
  - "The approval policy's remember flag allow-lists a tool by name and cascades to every pending call of that tool. In the coding example, does OpenCode's 'always' map to it, so that one 'always' on bash approves every later command with any arguments?"
  - "Layer zero of the policy is dangerously_skip_all_approvals, and a caller can override the agent's default policy per session through AgentConfig.approval_policy, with the caller winning. Who can start a session, and can a session starter hand themselves a policy the agent author never chose?"
  - "Relaxing a live policy re-evaluates calls already parked at the gate and releases the ones the new policy allows. Does the operator who relaxes it see what is about to run, or does the release happen against calls queued before the change?"
  - "The README says an agent resumes mid-turn with no double-run tool calls. Temporal retries activities by policy. What does an activity-backed tool have to be for that to hold, and does anything in the harness enforce it?"
  - "Every turn, tool call and reply token is recorded in workflow history and is replayable. Against Temporal Cloud, that history, and any payload offloaded to S3, leaves the operator's machine. What is in it, what is retained, and who can read it?"
  - "The coding example puts reasoning on a remote worker and side effects on the laptop through a shim that speaks OpenCode's internal protocol, which the README says shifts between releases. When it shifts, does the approval prompt fail closed, or does the shim's mapping degrade silently?"
  - "Tags 0.1.0 and 0.2.0 exist with no PyPI publish; 0.3.0 and 0.4.0 have one. Every GitHub release is flagged prerelease. Which channel is canonical for a shipped version, and does 'pin to a release' mean the tag or the wheel?"
  - "The README on main documents a message-dispatch model with per-handler mid-turn modes that the README at the 0.4.0 tag does not mention. Which of the dispatch semantics are in the wheel an operator installs today?"
  - "The agent_interface query returns every handler by design, and the docs say a parent's SubagentToolPolicy is what actually narrows reach. What does dangerously_allow_all expose that the model_callable hints would have kept back, and is that visible to the operator of the parent?"
  - "The repo lives in an org whose description says its repos have no guarantee of support or maintenance, while the README and pyproject name Temporal Technologies as the author. Which statement governs when something breaks?"
default_actionability:
  release: observe
  docs_change: observe
  security_change: test
  breaking_change: adapt
  ecosystem_package: observe
  approval_policy_change: test
  protocol_change: observe
discovery:
  last_verified: 2026-09-22
  verified_by: manual_web
  confidence: medium
  open_questions:
    - Which surface is canonical for a shipped version, the GitHub release, the tag, or the PyPI wheel, given that the two earliest tags never reached PyPI?
    - Does self-hosted Temporal versus Temporal Cloud change what the workflow history retains and who can read it?
    - Will the OpenCode shim track OpenCode releases, or is it a demonstration that will drift?
    - The README says sdk-python has fully supported non-harness integrations for Gemini and the OpenAI Agents SDK. What is the intended relationship between those and this harness?
    - Is there a path from temporal-community to a supported temporalio repository, and what would change for an operator when it moves?
notes: >
  Added 2026-09-22. temporal-community/temporal-agent-harness, MIT, Python
  3.11+, repo created 2026-06-18, 58 stars and 17 forks at intake. Its own
  description: "Temporal-native Durable Multi Agent Harness." The README calls
  it "an early, fast-moving project from Temporal Technologies" and warns that
  APIs will change; the PyPI classifier says Pre-Alpha.

  It earns a slot because it is the first entry on this list built by a
  workflow-engine vendor rather than a model lab or an agent author, and the
  thing it makes durable is the human decision. A gated tool call is a workflow
  wait that survives a worker crash and can sit for days, and the policy that
  decides which calls reach a human is a serializable object a caller can
  override per session, a runtime call can relax, and a remember click can
  widen by tool name. That is this publication's approval question with the
  approval turned into infrastructure, and the mechanisms are readable in the
  repo rather than inferred.

  It is a coding agent in exactly one place, the callback-tools example, and
  that example is the reason to read the rest. Reasoning runs on a remote
  worker with no access to the disk; a shim on the laptop executes bash, read,
  write, edit, grep and glob after an OpenCode permission prompt. Read, grep,
  glob and the todo tools are declared inherently safe and auto-approve under
  the default policy. The shim speaks OpenCode's internal protocol, which the
  README itself says is not a standard and shifts between releases.

  Channel at intake: four GitHub releases in twelve days, 0.1.0 on 2026-09-04
  through 0.4.0 on 2026-09-15, every one flagged prerelease. PyPI carries only
  0.3.0 and 0.4.0. Main was three commits ahead of 0.4.0 on 2026-09-22 and one
  of them rewrote message dispatch; the README on main documents that model,
  the README at the tag does not. Name the tag or the wheel, and say which
  README you read.

  Handling: Tier 2 and weekly. Do not promote on release velocity. Attribute
  durability claims to the harness, the Temporal SDK, or the Temporal service,
  never to the trio at once. A sandbox finding names pydantic-monty. An
  OpenCode-side behaviour observed through the shim is a fact about the shim
  unless shown otherwise. The org that hosts the repo disclaims support for
  everything in it while the README claims Temporal Technologies as author;
  report both statements and let the reader hold them.
