schema_version: bitter.frontier_source_contract.v0
id: temporal-agent-harness
label: Temporal Agent Harness
owner: temporal-community
homepage: https://github.com/temporal-community/temporal-agent-harness
docs: https://github.com/temporal-community/temporal-agent-harness/tree/main/docs/internal
primary_surfaces:
  - id: repo
    kind: github_repo
    url: https://github.com/temporal-community/temporal-agent-harness
    priority: 1
    watch:
      - releases
      - tags
      - commits
      - pull_requests
      - breaking_changes
      - security
      - codeowners
      - main_ahead_of_tag
  - id: releases
    kind: github_releases
    url: https://github.com/temporal-community/temporal-agent-harness/releases
    priority: 1
    watch:
      - new_features
      - breaking_changes
      - prerelease_flag
      - tag_without_pypi_publish
      - deprecations
    notes: >
      This is the only changelog. There is no CHANGELOG file in the tree and
      the PyPI metadata points its Changelog link here.
  - id: pypi
    kind: package_registry
    url: https://pypi.org/project/temporal-agent-harness/
    priority: 1
    watch:
      - package_version
      - version_lag_behind_tags
      - extras
      - python_requires
      - temporalio_floor
      - development_status_classifier
  - id: publish-workflow
    kind: ci_workflow
    url: https://github.com/temporal-community/temporal-agent-harness/blob/main/.github/workflows/publish.yml
    priority: 2
    watch:
      - trusted_publisher
      - tag_version_check
      - required_reviewers
      - test_gate
    notes: >
      Publishes to PyPI on a GitHub release via OIDC trusted publishing. Runs
      the test suite and refuses a tag whose pyproject version disagrees. The
      pypi environment has no required reviewer as of intake; the file itself
      says that is where a human gate would go.
  - id: docs-internal
    kind: official_docs
    url: https://github.com/temporal-community/temporal-agent-harness/tree/main/docs/internal
    priority: 1
    watch:
      - tool_approvals
      - agents_as_subagents
      - event_stream
      - core_concepts
      - what_the_harness_adds
      - development
  - id: docs-design
    kind: official_docs
    url: https://github.com/temporal-community/temporal-agent-harness/tree/main/docs/design
    priority: 2
    watch:
      - codeact_as_toolset
      - observable_agent_state
      - unified_message_dispatch
      - per_message_events
  - id: coding-example
    kind: official_docs
    url: https://github.com/temporal-community/temporal-agent-harness/tree/main/examples/callback_tools/coding_agent
    priority: 1
    watch:
      - opencode_shim
      - callback_tools
      - approval_mapping
      - local_tool_execution
      - inherently_safe_declarations
      - subagent_wiring
    notes: >
      The one place this harness is a coding agent. A remote workflow reasons,
      a shim on the laptop runs bash, read, write, edit, grep and glob after an
      OpenCode permission prompt, and the shim speaks OpenCode's internal
      protocol, which the README says shifts between releases.
  - id: advisories
    kind: security_advisories
    url: https://github.com/temporal-community/temporal-agent-harness/security/advisories
    priority: 1
    watch:
      - published_advisories
      - severity
      - affected_ranges
related_surfaces:
  standing_status: watched
  notes: >
    The harness sits on the Temporal Python SDK and inherits its execution
    semantics. A durability claim in the README is a claim about the pair, and a
    finding must say whether the behaviour comes from the harness, from the SDK,
    or from the Temporal service the operator runs it against. The OpenAI Agents
    integration is vendored from sdk-python main, so a defect there may already
    be fixed upstream and not here, or the reverse. Code Mode runs inside
    pydantic-monty, a third-party sandbox, and a sandbox finding must name it.
    OpenCode is not on this watchlist; it appears here only as the front end
    the coding example attaches to.
  repositories:
    - id: temporal-agent-harness
      url: https://github.com/temporal-community/temporal-agent-harness
      role: primary
    - id: sdk-python
      url: https://github.com/temporalio/sdk-python
      role: upstream_sdk_and_vendored_source
    - id: pydantic-monty
      url: https://pypi.org/project/pydantic-monty/
      role: code_mode_sandbox
    - id: temporal-community
      url: https://github.com/temporal-community
      role: hosting_org_disclaims_support
