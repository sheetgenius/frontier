# The writing lane's source roster: the people and publications whose posts and
# essays are worth reading every cycle. This is the who's-who as infrastructure
# -- person entries here should eventually mirror /people/ entries, and vice
# versa.
#
# Every `feed` URL in this file was probed and returned a real RSS/Atom
# document before being added. A feed that starts failing is a finding, not a
# nuisance: note it, do not silently drop the source.
#
# kinds: person | vendor | publication | research
# Discovery-only, like the X lane: nothing from a feed is quoted without
# fetching the underlying piece.
schema_version: bitter.frontier_writing_roster.v0
sources:
  - id: simonw
    name: Simon Willison
    kind: person
    x_handle: simonw
    feed: https://simonwillison.net/atom/everything/
    why: "The working model for this beat: daily, specific, checks his own claims, quotes exactly."

