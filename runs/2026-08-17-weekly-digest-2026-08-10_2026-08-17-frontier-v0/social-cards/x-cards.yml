      person.

  - id: verysmallwoods-back-to-the-code
    title: "A plugin author's read"
    kind: voice
    date: 2026-08-17
    date_precision: day
    captured_on: 2026-09-23
    source_ids: [deepseek-harness]
    authors: ["verysmallwoods"]
    display_name: "VerySmallWoods"
    source_urls:
      - https://x.com/verysmallwoods/status/2089144422172680591
    verbatim: |
      做了一些 DeepSeek Harness 插件，也读了一些目前开源社区的优秀项目，渐渐感觉到 DSH / Cordis 的有趣之处。

      OpenClaw, Hermes, Codex, CC 时代以来，大家似乎已经习惯于自然语言编程，用 Skills 来丰富功能。

      DSH 似乎又把开发者拉回了那个熟悉的代码战场，其实这是一个很有趣的故事。

      或许 DeepSeek 开辟的这片 plugin 西部荒野，会拯救一大批软件工程师。

      梁圣！
    inline: "DSH 似乎又把开发者拉回了那个熟悉的代码战场"
    summary: >
      A Chinese-language post from someone who has written DeepSeek Harness plugins. Our
      rendering: since OpenClaw, Hermes, Codex and Claude Code, people have got used to
      programming in natural language and extending with Skills; DSH seems to pull developers
      back onto the familiar battlefield of code, and its plugin frontier may rescue a lot of
      software engineers.
    verdict: >
      A voice post from a builder about their own experience writing plugins; we assert only
      that they said it. It is here as the possibility half of the plugin argument: the same
      unsandboxed code surface this issue treats as a risk is, to the people writing for it, a
      return to work they know how to do.

  - id: can-slop-and-fundamentals
    title: "Where the maintainer says slop comes from"
    kind: voice
    date: 2026-08-17
    date_precision: day
    captured_on: 2026-09-23
    source_ids: [omp]
    authors: ["_can1357"]
    display_name: "Can Bölük"
    source_urls:
      - https://x.com/_can1357/status/2089358095457661426
    verbatim: |
      xhi/max only, unsupervised they do fine with most fixes tbh, occasionally I correct but after their initial solution, and I also try to update the system prompt it runs with to avoid similar cases later on.

      Tbh I've found that slop mostly happens because you have bad fundamentals, i.e. an issue comes along and you need a whole refactor because it was not a scenario you thought of when actually architecting the thing and requires a lot of thinking which the agent decided to hack in instead.
    inline: "slop mostly happens because you have bad fundamentals, i.e. an issue comes along and you need a whole refactor because it was not a scenario you thought of when actually architecting the thing and requires a lot of thinking which the agent decided to hack in instead."
    summary: >
      OMP's maintainer, in a reply, saying he runs agents unsupervised at xhi or max effort on
      most fixes, corrects them occasionally, and updates the system prompt afterwards, and that
      slop mostly comes from architecture that never contemplated the case.
    verdict: >
      A voice post about his own practice and his diagnosis of agent slop; we assert only that
      he said it. It is here beside OMP's brokered-write hook because it is the maintainer's own
      account of design: the failure lives in the case nobody planned for, which is exactly what
      an extension point planned in advance is not.

