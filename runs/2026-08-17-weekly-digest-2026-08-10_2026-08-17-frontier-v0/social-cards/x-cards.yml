note: >
  Field discipline. `summary` and `verdict` are OUR words about a post. Only
  `verbatim` holds the poster's own text, and only `verbatim` may be rendered
  as a quotation. Every `verbatim` here was re-fetched by URL in a capture pass
  that was given no expected text to anchor on, and the discovery gist was
  deliberately withheld from that pass so it could not be matched toward.
  Fifteen posts went in and fifteen came back; none was reconstructed.

  Typographic punctuation inside `verbatim` is preserved exactly as published,
  including a missing space after a full stop in one post and a trailing space in
  another. The ASCII house style governs our prose, never someone else's words.

  `inline` fragments are cut out of `verbatim` by anchors with
  ops/social/slice-quote.mjs and never retyped. `verdict` is written for the
  specific post and says whether it is a claim we adjudicated or a voice we only
  report was raised.
