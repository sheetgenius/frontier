  - id: doodlestein-user-is-another-agent
    title: "The target user is an agent"
    kind: voice
    date: 2026-08-15
    date_precision: day
    captured_on: 2026-09-23
    source_ids: [agent-flywheel]
    authors: ["doodlestein"]
    display_name: "Jeffrey Emanuel"
