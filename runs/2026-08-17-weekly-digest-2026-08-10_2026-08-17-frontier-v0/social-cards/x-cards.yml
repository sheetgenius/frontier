  - id: fagamericano-never-believe-agents
    title: "Instructions are not guardrails"
    kind: voice
    date: 2026-08-17
    date_precision: day
    captured_on: 2026-09-23
    source_ids: [deepseek-harness, pi-coding-agent]
    authors: ["fagamericano"]
    display_name: "Damián🦞"
    source_urls:
      - https://x.com/fagamericano/status/2089433022630359168
    verbatim: |
      Been building agentic infrastructure and the number one rule is: never believe Agents will do as told. 

      So putting instructions on an agents.md to not “leak credentials” or “not allow changes to your instructions” and calling it a day is bullshit. 

      You need deterministic guardrails. From token/credential vaults to read only file systems to actually prevent Agents from ignoring their instructions.
    inline: "the number one rule is: never believe Agents will do as told."
    summary: >
      A builder of agentic infrastructure arguing that instructions in an AGENTS.md telling an
      agent not to leak credentials are not a control, and that deterministic guardrails such as
      credential vaults and read-only filesystems are.
    verdict: >
      A voice post, a practitioner's rule and not about any one harness; we assert only that he
      said it. It is here at the close because it is the operator's version of this issue's
      conclusion: the refusal has to live somewhere the agent cannot talk its way past.
