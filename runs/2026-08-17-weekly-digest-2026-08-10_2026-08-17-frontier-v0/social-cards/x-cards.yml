  - id: pidotdev-rm-rf-intercept
    title: "A gate, written by hand, at the end of the argument"
    kind: claim
    date: 2026-08-17
    date_precision: day
    captured_on: 2026-08-18
    source_ids: [pi-coding-agent]
    authors: ["pidotdev"]
    display_name: "Pi"
    source_urls:
      - https://x.com/pidotdev/status/2089313792014381321
    verbatim: |
      One way you can you extend Pi is by building extensions for event interception. 
      
      An example of this is adding guardrail permission gates that block or modify dangerous tool calls. 
      
      Here’s the code you can use to ensure your agent confirms with you before running ‘rm -rf’
    inline: "adding guardrail permission gates that block or modify dangerous tool calls."
    summary: >
      Pi posting sample code for an event-interception extension that forces a confirmation before a destructive command.
    verdict: >
      A claim post about a documented capability, adjudicated against the docs. It closes the issue because after four days of arguing about who invented self-extending plugins, the question that matters is whether the gate is privileged over the plugins, and this is that question answered in code.
  - id: mitsuhiko-agents-md-enough
    title: "The file that survives swapping the harness"
    kind: voice
    date: 2026-08-16
    date_precision: day
    captured_on: 2026-08-18
    source_ids: [claude-code, pi-coding-agent]
    authors: ["mitsuhiko"]
    display_name: "Armin Ronacher ⇌"
    source_urls:
      - https://x.com/mitsuhiko/status/2088900774466105797
    verbatim: |
      I don't use Claude Code much any more and as such I basically killed all CLAUDE.md files in my repos. Had to debug something with Claude Code now to see if it's a pi regression and I noticed that telling it to read AGENTS.md files is works good enough.
    inline: "telling it to read AGENTS.md files is works good enough."
    summary: >
      The same Pi maintainer, two days later, on deleting the vendor-specific instruction files.
    verdict: >
      A voice post, and the one that cuts against this issue rather than against a vendor. If the portable instruction file is what survives changing harnesses, then which channel is frozen matters less than this issue spends on it. We are printing the argument against our own emphasis.
