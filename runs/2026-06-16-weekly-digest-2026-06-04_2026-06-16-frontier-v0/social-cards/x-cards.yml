  - id: crepesupreme-depth-five
    title: "Four layers down"
    kind: community_discussion
    date: 2026-06-09
    date_precision: day
    captured_on: 2026-07-29
    source_ids: [claude-code]
    authors: ["crepesupreme"]
    display_name: Crepe Supreme
    source_note: 2
    handling_note: b
    source_urls:
      - https://x.com/crepesupreme/status/2064337704201093413
    verbatim: |
      Claude Code shipped nested subagent support, depth 5. An agent can now spawn an agent that spawns an agent, four layers down. Each invocation adds to the orchestration tab. Wrote on what recursive pipelines actually cost: https://crepesupreme.substack.com/p/the-arrows-arent-free
    inline: >-
      An agent can now spawn an agent that spawns an agent, four layers down
    summary: >
      A reader working out what depth five actually means.
    verdict: >
      A voice post doing arithmetic the announcement did not: each layer multiplies invocations and context. We did not verify his cost model; the structure he describes is what the release says it does.
    tags: [subagents, context, cost]

