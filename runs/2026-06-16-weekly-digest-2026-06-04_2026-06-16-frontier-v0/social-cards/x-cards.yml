cards:
  - id: bcherny-nested-subagents
    title: "Agents kicking off agents"
    kind: capability_announcement
    date: 2026-06-09
    date_precision: day
    captured_on: 2026-07-29
    source_ids: [claude-code]
    authors: ["bcherny"]
    display_name: Boris Cherny
    source_note: 1
    handling_note: a
    source_urls:
      - https://x.com/bcherny/status/2064327225504403752
    verbatim: |
      Just landed nested subagent support in Claude Code

      Starting to experiment more with agents kicking off agents as a way to better manage context. Capped at depth=5 to start, going out in today’s release.

      Lmk what you think!
    inline: >-
      Just landed nested subagent support in Claude Code
    summary: >
      Claude Code's creator announcing nested subagent support.
    verdict: >
      The vendor announcing its own feature, quoted as that. What matters is the date: the cap this issue told operators to rely on did not bind for foreground spawns until 2.1.181, which our next issue reported.
    tags: [subagents, depth-cap]

  - id: crepesupreme-depth-five
    title: "Four layers down"
    kind: community_discussion
    date: 2026-06-09
    date_precision: day
    captured_on: 2026-07-29
    source_ids: [claude-code]
    authors: ["crepesupreme"]
    display_name: Crepe Supreme
    source_note: 2
    handling_note: b
    source_urls:
      - https://x.com/crepesupreme/status/2064337704201093413
    verbatim: |
      Claude Code shipped nested subagent support, depth 5. An agent can now spawn an agent that spawns an agent, four layers down. Each invocation adds to the orchestration tab. Wrote on what recursive pipelines actually cost: https://crepesupreme.substack.com/p/the-arrows-arent-free
    inline: >-
      An agent can now spawn an agent that spawns an agent, four layers down
    summary: >
      A reader working out what depth five actually means.
    verdict: >
      A voice post doing arithmetic the announcement did not: each layer multiplies invocations and context. We did not verify his cost model; the structure he describes is what the release says it does.
    tags: [subagents, context, cost]

  - id: bcherny-fable-best-model
    title: "By a wide margin"
    kind: capability_announcement
    date: 2026-06-09
    date_precision: day
    captured_on: 2026-07-29
    source_ids: [claude-code]
    authors: ["bcherny"]
    display_name: Boris Cherny
    source_note: 3
    handling_note: c
    source_urls:
      - https://x.com/bcherny/status/2064402671898075579
    verbatim: |
      Fable 5 is now available in Claude Code and Cowork

      Fable is the best model I have used for coding, by a wide margin. It is a big step up, enabling less prompts and steers, more efficient token use, better code quality, better tool use, more intelligent self-verification, longer running sessions, and higher trust & autonomy. 

      Happy coding!
    inline: >-
      Fable is the best model I have used for coding, by a wide margin
    summary: >
      Fable 5 arriving in Claude Code, in its maker's words.
    verdict: >
      A vendor assessment of its own model with no benchmark attached, quoted as the claim it is. Its value is as the first entry in a sequence: what practitioners said unprompted over the following week is the interesting part.
    tags: [model-release, vendor-claim]

