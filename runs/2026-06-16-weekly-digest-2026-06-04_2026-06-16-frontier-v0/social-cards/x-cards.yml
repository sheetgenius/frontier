  - id: gthimmes-vendor-risk
    title: "What if they delete the product"
    kind: criticism
    date: 2026-06-08
    date_precision: day
    captured_on: 2026-07-29
    source_ids: [gemini-cli, antigravity]
    authors: ["gthimmes"]
    display_name: Glenn Thimmes
    source_note: 6
    handling_note: f
    source_urls:
      - https://x.com/gthimmes/status/2064056804552892619
    verbatim: |
      Vendor risk used to mean "what if they raise the price." In 2026 it means "what if they delete the product." Gemini CLI got about a month's notice before it stops serving requests. Build your stack like every tool in it has a sunset date, because at least one of them does.
    inline: >-
      Vendor risk used to mean "what if they raise the price." In 2026 it means "what if they delete the product.
    summary: >
      An operator reframing vendor risk after the Gemini CLI notice.
    verdict: >
      A voice post, and the best one-line statement of what the succession meant for anyone who had built on it. The notice period he references is checkable and correct.
    tags: [vendor-risk, succession]

  - id: fredkschott-flue-1-0
    title: "Zero LLM lock-in"
    kind: capability_announcement
    date: 2026-06-16
    date_precision: day
    captured_on: 2026-07-29
    source_ids: [flue]
    authors: ["FredKSchott"]
    display_name: fks
    source_note: 7
    handling_note: g
    source_urls:
      - https://x.com/FredKSchott/status/2066962296119959581
    verbatim: |
      Just Shipped: Flue 1.0 Beta

      Flue is the TypeScript framework for building the next generation of agents, designed around an open agent harness with zero LLM lock-in. It’s like Astro, for agents.

      Flue 1.0 has been redesigned around three core primitives:

      🔁 Workflows — structured automations designed for background work, where your code drives the agent from start to finish.

      🧭 Agents (New!) — autonomous, stateful loops where the model drives itself to complete a given task.

      📡 Channels (New!) — connect agents to Slack, GitHub, Linear, Discord, Teams, and more. Flue handles the boilerplate for you.

      Everything shares the same durable foundation, powered internally by Pi, Vite, and Durable Streams. Deploy anywhere, use any LLM, and recover running agents across restarts and downtime.

      We’ve talked to a lot of teams building agents, and keep hearing the same thing: getting to production is hard work. We built Flue to help change that.

      Flue 1.0 Beta is available today. Give it a try and let me know what you think!
    inline: >-
      designed around an open agent harness with zero LLM lock-in
    summary: >
      Flue 1.0 Beta, from its author.
    verdict: >
      A vendor announcing its own framework. Included because the design claim -- an open harness with no model lock-in -- is the counter-position to the week's other story, where the harness and the model shipped as one product.
    tags: [framework, lock-in]

