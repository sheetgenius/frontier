  - id: teknium-width-and-depth
    title: "The operator sets the shape"
    kind: claim
    date: 2026-06-16
    date_precision: day
    captured_on: 2026-09-23
    source_ids: [hermes-agent]
    authors: ["Teknium"]
    display_name: "Teknium 🪽"
    source_urls:
      - https://x.com/Teknium/status/2066872271877407212
    verbatim: |
      They can actually. You can configure width (how many subagents an agent can spawn) and depth (how many layers of subagents spawning subagents) you want :)

      It's configurable in the config.yaml or dashboard
    inline: "You can configure width (how many subagents an agent can spawn) and depth (how many layers of subagents spawning subagents)"
    summary: >
      Hermes Agent's lead, replying in a thread whose parent post we did not capture, saying
      Hermes lets the operator configure both width (how many subagents an agent can spawn) and
      depth (how many layers of spawning), in config.yaml or the dashboard.
    verdict: >
      A claim post by the project's lead, partly backed by this issue's receipts: commit
      c66ecf0bc adds a delegation.max_async_children setting, default 3, for background
      subagents, which is a width cap. We hold no receipt for a depth setting and report that
      half as his statement. It is here because it is the other answer to the depth question:
      Claude Code chose five, Hermes says the operator chooses.

  - id: wunderwuzzi-silent-downgrade
    title: "It said Fable"
    kind: voice
    date: 2026-06-10
    date_precision: day
    captured_on: 2026-09-23
    source_ids: [claude-code]
    authors: ["wunderwuzzi23"]
    display_name: "Johann Rehberger"
    source_urls:
      - https://x.com/wunderwuzzi23/status/2064612335629771149
    verbatim: |
      That's cool. Can you run /model? 

      I nearly missed the downgrade when using CLI until I turned it off via /config, so it does a hard stop.

      Claude still claimed it's using fable in my case, but it actually got downgraded to Opus
    inline: "Claude still claimed it's using fable in my case, but it actually got downgraded to Opus"
    summary: >
      A security researcher, the day after Fable 5 reached Claude Code, telling another user to
      run /model: his own session had been downgraded to Opus while Claude still said it was
      using Fable, and he nearly missed it until he turned the behavior off in /config so the
      session stops instead.
    verdict: >
      A voice post about the author's own session, unverified; we assert only that he reported
      it. The post does not name what triggered the switch. This issue's receipts show why a
      switch can happen at all: 2.1.166 added a fallbackModel chain of up to three models and
      applied --fallback-model to interactive sessions. The model's self-report is the part to
      distrust, which is his point.
