  - id: darshan-narrow-at-each-spawn
    title: "Narrower at every level"
    kind: voice
    date: 2026-06-10
    date_precision: day
    captured_on: 2026-09-23
    source_ids: [claude-code]
    authors: ["DarshanSays"]
    display_name: "Darshan Yadav"
    source_urls:
      - https://x.com/DarshanSays/status/2064616354481942780
    verbatim: |
      Depth-5 nested agents is powerful, but the authorization question matters: does each child agent inherit parent permissions, or does scope narrow as you go deeper? The second option is far safer. Privilege reduction at each spawn level should be the default, not an option. Excited to see where this goes.
    inline: "Privilege reduction at each spawn level should be the default, not an option."
    summary: >
      A builder responding to depth-five nested subagents by asking whether each child inherits
      its parent's permissions or gets a narrower scope, and arguing that privilege reduction at
      every spawn level should be the default.
    verdict: >
      A voice post and a design proposal, not a claim about the product. Measured against this
      issue's receipts, what Claude Code shipped is partway there: 2.1.178 has the classifier
      evaluate a spawn before launch, adds Tool(param:value) rules such as Agent(model:opus),
      and stops server-level MCP denials being ignored inside a subagent. Those carry the
      parent's limits down the tree. None of the receipts shows scope narrowing by default at
      each level, which is what he asks for.

  - id: edwin-nesting-launders-context
    title: "It launders it"
    kind: voice
    date: 2026-06-09
    date_precision: day
    captured_on: 2026-09-23
    source_ids: [claude-code]
    authors: ["EdwinRubioIam"]
    display_name: "Edwin Rubio"
    source_urls:
      - https://x.com/EdwinRubioIam/status/2064482874984697882
    verbatim: |
      Depth=5 is generous. The real ceiling isn't recursion, it's signal loss. Every agent spawning another is a game of telephone — by layer 3 the sub-agent is solving a problem the parent already forgot. Nesting doesn't manage context. It launders it.
    inline: "Nesting doesn't manage context. It launders it."
    summary: >
      A reply to the nested-subagent launch calling depth five generous and arguing the real
      limit is signal loss: each spawn is a game of telephone, and by the third layer a subagent
      is solving a problem its parent has forgotten.
    verdict: >
      A voice post and a counter-read of the launch's stated purpose, which was to manage
      context better. It is an argument, not a measurement; we ran no test of what survives
      three layers of delegation. It is here because it disputes the feature on its own terms
      rather than on safety.

  - id: dotta-low-trust-wont-pwn-org
    title: "The reviewer that cannot take the org"
    kind: claim
    date: 2026-06-09
    date_precision: day
    captured_on: 2026-09-23
    source_ids: [paperclip]
    authors: ["dotta"]
    display_name: "dotta 📎"
    source_urls:
      - https://x.com/dotta/status/2064465643575955474
    verbatim: |
      Low-trust agents means you can have an agent review untrusted inputs and if he’s prompt-injected it won’t pwn the rest of your Paperclip org 

      (requires sandboxed instances)
    inline: "you can have an agent review untrusted inputs and if he’s prompt-injected it won’t pwn the rest of your Paperclip org"
    summary: >
      Paperclip's maintainer describing low-trust agents: an agent can review untrusted input,
      and if it is prompt-injected it cannot compromise the rest of the Paperclip org, provided
      instances are sandboxed.
    verdict: >
      A claim post by the maintainer about his own feature. The mechanism is in this issue's
      receipts: PR #7530 in v2026.609.0 adds the deny-by-default low_trust_review preset,
      source-trust tagging, route-level containment and quarantine. That it holds against a real
      injection is his statement, not something we tested, and the post itself makes it
      conditional on sandboxed instances.

