  - id: mattpocock-say-workflow
    title: "Say the word, get a fleet"
    kind: claim
    date: 2026-05-31
    date_precision: day
    captured_on: 2026-09-23
    source_ids: [claude-code]
    authors: ["mattpocockuk"]
    display_name: "Matt Pocock"
    source_urls:
      - https://x.com/mattpocockuk/status/2061120343922614519
    verbatim: |
      So every time I say the word 'workflow' in Claude Code...

      (let's say, when I'm creating a new GitHub workflow)

      ...it tries to enter 'workflow' mode, spinning up dozens of subagents to complete my task.

      Stupid fucking thing
    inline: "it tries to enter 'workflow' mode, spinning up dozens of subagents to complete my task."
    summary: >
      A developer reporting that saying the word 'workflow' in Claude Code, even when he meant a
      GitHub workflow file, put it into dynamic-workflow mode and spun up dozens of subagents.
    verdict: >
      A claim post, and the mechanism checks out: the Claude Code 2.1.160 changelog, published
      to npm on 1 June, renames the dynamic-workflow trigger keyword from workflow to ultracode
      and says the word 'no longer triggers a run.' The number of subagents is his account of
      his own sessions.

