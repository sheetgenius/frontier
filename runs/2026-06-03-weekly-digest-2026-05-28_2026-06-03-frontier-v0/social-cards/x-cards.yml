  - id: openclaw-not-silently-rewriting
    title: "Not by silently rewriting future runs"
    kind: claim
    date: 2026-06-03
    date_precision: day
    captured_on: 2026-09-23
    source_ids: [openclaw]
    authors: ["openclaw"]
    display_name: "OpenClaw🦞"
    source_urls:
      - https://x.com/openclaw/status/2062291555734696268
    verbatim: |
      Agents should learn repeated work, but not by silently rewriting future runs.

      Skill Workshop turns reusable agent lessons into reviewable proposals you can tweak, apply, or reject before they become live skills. https://openclaw.ai/blog/openclaw-agent-skill-workshop
    inline: "Agents should learn repeated work, but not by silently rewriting future runs."
    summary: >
      OpenClaw introducing Skill Workshop: reusable agent lessons become proposals a person can
      tweak, apply or reject before they become live skills.
    verdict: >
      A claim post, and the release notes bear out the mechanism: 2026.6.1-beta.1 ships pending
      proposals with CLI and Gateway review actions. They also ship the skill_workshop tool that
      lets the agent file proposals, and neither the post nor the notes say whether the agent
      may approve its own.

