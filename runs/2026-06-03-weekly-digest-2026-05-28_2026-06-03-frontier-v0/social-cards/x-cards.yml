      issue that widened ordinary turns, and only the first is in the 2.1.160 notes.

  - id: dexhorthy-deterministic-over-soup
    title: "Deterministic workflows, small loops"
    kind: voice
    date: 2026-05-28
    date_precision: day
    captured_on: 2026-09-23
    source_ids: [claude-code]
    authors: ["dexhorthy"]
    display_name: "dex"
    source_urls:
      - https://x.com/dexhorthy/status/2060144982372340155
    verbatim: |
      someone hit me up about the new "claude dynamic workflows" feature, claiming "see, multi-agent works"

      But really, the launch of this feature proves the exact point that I made back in June of 2025, along with @walden_yan, @tobi, @karpathy, and many others:

      Deterministic workflows orchestrating small agent loops beats non-deterministic multi-agent or "agent soup" systems every dang time

      everything is context engineering
    inline: "Deterministic workflows orchestrating small agent loops beats non-deterministic multi-agent or \"agent soup\" systems every dang time"
    summary: >
      A builder rejecting the reading that dynamic workflows prove multi-agent systems work, and
      arguing the launch confirms the opposite: deterministic workflows driving small agent
      loops beat free-form multi-agent systems.
    verdict: >
      A voice post and a position he has argued since 2025, not a measurement. It is here
      because it reads the launch the way its design reads: the orchestrator is a script, and
      the agents it calls are small.

  - id: thariq-resume-durability
    title: "As durable as resume"
    kind: claim
    date: 2026-06-02
    date_precision: day
    captured_on: 2026-09-23
    source_ids: [claude-code]
    authors: ["trq212"]
    display_name: "Thariq"
    source_urls:
      - https://x.com/trq212/status/2061933039643685316
    verbatim: |
      yeah it's definitely not like we shipped temporal inside of your terminal, but we do things in the JS environment to make it more deterministic

      I would model it as roughly as durable as "/resume"ing every subagent
    inline: "I would model it as roughly as durable as \"/resume\"ing every subagent"
    summary: >
      A Claude Code team member saying dynamic workflows do not ship a durable-execution engine
      like Temporal in the terminal, that the JS environment is made more deterministic, and
      that operators should model durability as roughly resuming every subagent.
    verdict: >
      A claim post, reported as the builder's own description: this issue's receipts show the
      orchestrator is script-side but contain no durability guarantee to check it against. It is
      here because it is the vendor setting the expectation lower than the launch did, in terms
      an operator can plan around.

  - id: brenbuilds-lose-steering
    title: "You lose steering mid-run"
    kind: voice
    date: 2026-06-02
    date_precision: day
    captured_on: 2026-09-23
    source_ids: [claude-code]
    authors: ["BrenBuilds"]
    display_name: "Bren"
    source_urls:
      - https://x.com/BrenBuilds/status/2061891928996610085
    verbatim: |
      cursor 3.6 auto-review mode keeps going without approval interrupts

      kick it on a branch, let it run, read the diff when its done

      i use it for sweeping changes like renaming a core export across tests and source. one coherent pass instead of a dozen approval stops

      tradeoff: you get the whole flow, you lose steering mid-run. bigger diff to read if it wanders

      but with a tight scope it usually tracks straight
    inline: "you get the whole flow, you lose steering mid-run. bigger diff to read if it wanders"
    summary: >
      An operator using Cursor 3.6's auto-review mode for sweeping renames on a branch, reading
      the diff at the end, and naming the trade-off: no approval stops, no steering mid-run, a
      bigger diff if it wanders.
    verdict: >
      A voice post about the author's own practice with a tool this issue does not track;
      nothing in it is adjudicated. It is here because it states the cost of review-afterward
      plainly, from someone who pays it and still chooses it.

