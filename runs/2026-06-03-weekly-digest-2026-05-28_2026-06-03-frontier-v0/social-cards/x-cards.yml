  - id: claudedevs-opus-overspawn
    title: "Not every fleet was a workflow"
    kind: claim
    date: 2026-06-01
    date_precision: day
    captured_on: 2026-09-23
    source_ids: [claude-code]
    authors: ["ClaudeDevs"]
    display_name: "ClaudeDevs"
    source_urls:
      - https://x.com/ClaudeDevs/status/2061501790131265803
    verbatim: |
      The issue affected how Opus 4.8 requests were handled, causing the model to trigger more parallel tool calls than intended. It was unrelated to dynamic workflows.
    inline: "The issue affected how Opus 4.8 requests were handled, causing the model to trigger more parallel tool calls than intended. It was unrelated to dynamic workflows."
    summary: >
      Anthropic's developer account saying an issue in how Opus 4.8 requests were handled made
      the model trigger more parallel tool calls than intended, and that it was unrelated to
