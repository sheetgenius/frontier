  - id: claudecodelog-webfetch-override
    title: "Deny rules now override preapproved hosts"
    kind: capability_announcement
    date: 2026-06-03
    date_precision: day
    captured_on: 2026-07-29
    source_ids: [claude-code]
    authors: ["ClaudeCodeLog"]
    display_name: Claude Code Changelog
    source_note: 2
    handling_note: b
    source_urls:
      - https://x.com/ClaudeCodeLog/status/2062288852740386830
    verbatim: |
      Claude Code 2.1.162 is now available.

      28 CLI changes

      Highlights:
      • Explicit WebFetch(domain:NAME) deny/ask/allow rules now override preapproved hosts, enforcing access control
      • Startup uses in-memory config if config dir is read-only, avoiding a blank-screen hang and surfacing errors
      • Edit tool now makes exact string replacements in files, preventing unintended partial or pattern edits

      Complete details in thread ↓
    inline: >-
      Explicit WebFetch(domain:NAME) deny/ask/allow rules now override preapproved hosts, enforcing access control
    summary: >
      Claude Code 2.1.162 making explicit WebFetch rules win over preapproved hosts.
    verdict: >
      A relay of the vendor changelog; the release is the receipt. The shape is the one this issue is about: a rule an operator wrote was previously losing to a default they never set.
    tags: [permissions, webfetch, precedence]

  - id: pawelhuryn-workflow-cost
    title: "8 agents in 24.5s. 253k tokens"
    kind: workflow_practice
    date: 2026-05-28
    date_precision: day
    captured_on: 2026-07-29
    source_ids: [claude-code]
    authors: ["PawelHuryn"]
    display_name: Paweł Huryn
    source_note: 3
    handling_note: c
    source_urls:
      - https://x.com/PawelHuryn/status/2060063258527088984
    verbatim: |
      Tested Claude Code's new dynamic workflows. 8 agents in 24.5s. 253k tokens.

      The launch post frames it as a large fleet of coordinated subagents. That part isn't new. The SDK has had parallel calls for years.

      The new part is where the orchestrator runs. It's JavaScript, not a Claude turn. The routing logic is code, so it doesn't spend model tokens.

      Each subagent keeps its own context, tools, and intermediate calls. The parent thread gets the return value. Not 8 transcripts. Not 50k tokens of grep noise. One object.

      A 20-agent audit can spend 600k tokens across isolated agents and return a 2k-token synthesis. Before this, "comprehensive review" meant filling the context you still needed for the fix.

      Scripts persist at .claude/workflows/<name>.js. Invoke by name with args. They're cron-schedulable and compose one level deep. It's like a function library.

      I've been treating subagents as context isolation, not delegation. Dynamic workflows move that from one agent to a fleet.

      Not fan-out. The mess stays out of the parent thread.
    inline: >-
      8 agents in 24.5s. 253k tokens
    summary: >
      A practitioner measuring the new dynamic-workflows feature on launch day.
    verdict: >
      His measurement from a single run he describes, not ours. Quoted because somebody put a token number on a fleet feature within hours of the announcement, which is more than the announcement did.
    tags: [workflows, cost, measurement]

