  - id: can-omp2-pi-not-the-limiting-factor
    title: "Pi is not the limiting factor"
    kind: voice
    date: 2026-08-17
    date_precision: day
    captured_on: 2026-08-23
    source_ids: [omp, pi-coding-agent]
    authors: ["_can1357"]
    display_name: "Can Bölük"
    source_urls:
      - https://x.com/_can1357/status/2089358681171182043
    verbatim: |
      like compare omp source vs. omp2 branch, both are completely agent written, omp2 is significantly cleaner because Pi is not the limiting factor and this is a DSL https://t.co/Bp29v7EdCJ instead of a TS data type filled during the runtime because I knew it was necessary beforehand
    inline: "omp2 is significantly cleaner because Pi is not the limiting factor"
    summary: >
      The maintainer's own reason for the rewrite, three days later: the fork's design was constrained by the upstream.
    verdict: >
      Voice with a checkable half. 'Completely agent written' is his description; we do not verify it. The linked DSL path exists under crates/catalog on the branch. The claim that Pi limited the design is the argument the Pi maintainers later dispute.

