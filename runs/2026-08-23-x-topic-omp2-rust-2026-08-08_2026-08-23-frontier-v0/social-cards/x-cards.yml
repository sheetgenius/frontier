  - id: olek-pi-completely-deprecated
    title: "Pi is being completely deprecated"
    kind: claim
    date: 2026-08-21
    date_precision: day
    captured_on: 2026-08-23
    source_ids: [omp, pi-coding-agent]
    authors: ["oleksoleksoleks"]
    display_name: "Olek"
    source_urls:
      - https://x.com/oleksoleksoleks/status/2090933443483881566
    verbatim: |
      Pi's being completely deprecated. The Bun runtime is being ripped out in lieu of CPython
    inline: "Pi's being completely deprecated. The Bun runtime is being ripped out in lieu of CPython"
    summary: >
      The public origin of the story, from an OMP team member, 21 August.
    verdict: >
      Claim about OMP's plan. Checked against the branch: the TypeScript tree is absent at the omp2 tip and crates/py is an embedded CPython runtime. 'Deprecated' describes the fork's own Pi layer; it says nothing about earendil-works/pi, which is unchanged.

  - id: olek-pi-had-a-lot-of-problems
    title: "Pi had a lot of problems"
    kind: claim
    date: 2026-08-21
    date_precision: day
    captured_on: 2026-08-23
    source_ids: [pi-coding-agent, omp]
    authors: ["oleksoleksoleks"]
    display_name: "Olek"
    source_urls:
      - https://x.com/oleksoleksoleks/status/2090923286892892518
    verbatim: |
      Pi had a lot of problems -- namely the reliance on Bun + the way it did plugins, the poor sandboxing/trust model, and how it wasn't designed for remote workspaces in mind
    inline: "Pi had a lot of problems -- namely the reliance on Bun + the way it did plugins, the poor sandboxing/trust model, and how it wasn't designed for remote workspaces in mind"
    summary: >
      The three reasons given for leaving Pi, as stated by an OMP team member.
    verdict: >
      Claim about upstream Pi, adjudicated: Pi's npm channel declares engines.node >=22.19.0 and uses Bun only in an optional compiled-binary build; the Bun dependency is OMP's (packageManager bun@1.4.0). The trust-model and remote-workspace claims are design opinions, disputed by the Pi authors below, and not settled by any receipt we hold.

  - id: olek-two-weeks-not-backwards-compatible
    title: "Two weeks in, not backwards compatible"
    kind: claim
    date: 2026-08-21
    date_precision: day
    captured_on: 2026-08-23
    source_ids: [omp]
    authors: ["oleksoleksoleks"]
    display_name: "Olek"
    source_urls:
      - https://x.com/oleksoleksoleks/status/2090947411581796564
    verbatim: |
      It was started 2 weeks ago; and right now the goal is to get Pi and Bun out as quickly as possible -- because all of the core work has been paused, and we're racking up PRs/fixes that need to be pushed

      It won't be backwards compatible on the plugins/extensions side -- everything will need to be ported because TS/Bun is being replaced with CPython

      User-facing behavior should be as close to 1-to-1 as possible. There are 15k text lines of omp features to port, but we'll be dogfooding

      WASM should be able to be added on as a future backend without issue -- and you're free to push a PR once Omp2 is out
    inline: "It was started 2 weeks ago; and right now the goal is to get Pi and Bun out as quickly as possible -- because all of the core work has been paused, and we're racking up PRs/fixes that need to be pushed"
    summary: >
      The most specific statement of the plan: timing, why now, plugin compatibility, and the port that remains.
    verdict: >
      Claim, partly checked. First omp2 commit is 2026-08-08, thirteen days before this post; the branch has one author. 'Core work paused' and '15k text lines to port' are not checkable from outside; treat them as the team's own description.

  - id: olek-python-for-plugins-rust-core
    title: "Python for plugins, Rust for the core"
    kind: claim
    date: 2026-08-22
    date_precision: day
    captured_on: 2026-08-23
    source_ids: [omp]
    authors: ["oleksoleksoleks"]
    display_name: "Olek"
    source_urls:
      - https://x.com/oleksoleksoleks/status/2090964492439929058
    verbatim: |
      The Python runtime is for the plugin system -- the core omp will be Rust. The speed + memory footprint improvements should be self-explanatory
    inline: "The Python runtime is for the plugin system -- the core omp will be Rust"
    summary: >
      The architecture split, answered to a skeptic.
    verdict: >
      Claim, confirmed in shape by the tree: a Rust workspace with an embedded CPython crate for extensions. The speed and memory gains are asserted, not measured; nothing has shipped to measure.

  - id: graykevinb-is-this-mainline-omp
    title: "Is this mainline omp?"
    kind: voice
    date: 2026-08-21
    date_precision: day
    captured_on: 2026-08-23
    source_ids: [omp]
    authors: ["graykevinb"]
    display_name: "Kevin Gray"
    source_urls:
      - https://x.com/graykevinb/status/2090911436507693097
    verbatim: |
      sounds cool. Omp is great its just the startup time and ram use is brutal.

      Is this mainline omp? Cuz most of it was already omp
    inline: "Is this mainline omp? Cuz most of it was already omp"
    summary: >
