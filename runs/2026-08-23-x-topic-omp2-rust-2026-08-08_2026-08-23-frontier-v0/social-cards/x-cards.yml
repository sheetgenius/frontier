  - id: mario-pi-has-no-dependency-on-bun
    title: "Pi has no dependency on Bun"
    kind: claim
    date: 2026-08-22
    date_precision: day
    captured_on: 2026-08-23
    source_ids: [pi-coding-agent, omp]
    authors: ["badlogicgames"]
    display_name: "Mario Zechner"
    source_urls:
      - https://x.com/badlogicgames/status/2091099037629866446
    verbatim: |
      can we not do the "bash the others" shit? pi has no dependency on Bun what so ever. the sandboxing/trust model is what you make it, as explained everywhere in the docs, and "remote workspace" is pretty simple to do if you need it. @_can1357 let's not, okay?
    inline: "pi has no dependency on Bun what so ever"
