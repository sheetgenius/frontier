  - id: armin-not-going-to-port-pi-to-rust
    title: "We are not going to port Pi to Rust"
    kind: claim
    date: 2026-08-22
    date_precision: day
    captured_on: 2026-08-23
    source_ids: [pi-coding-agent]
    authors: ["mitsuhiko"]
    display_name: "Armin Ronacher ⇌"
    source_urls:
      - https://x.com/mitsuhiko/status/2091185628922757259
    verbatim: |
      I don't think we're going to port Pi to Rust, because we need a runtime language for the extensibility but I think once the new harness is here we might be a bit more adventurous with the UI layer at least.
    inline: "I don't think we're going to port Pi to Rust, because we need a runtime language for the extensibility"
    summary: >
      The Pi maintainer closing the other reading of the story.
    verdict: >
      Claim about Pi's plan, consistent with the tree: zero Rust files on Pi main or dev at 2026-08-23. It is a statement of intent, not a guarantee.

  - id: armin-pi-was-never-small
    title: "Pi was never small by code"
    kind: voice
    date: 2026-08-22
    date_precision: day
    captured_on: 2026-08-23
    source_ids: [pi-coding-agent]
    authors: ["mitsuhiko"]
    display_name: "Armin Ronacher ⇌"
    source_urls:
      - https://x.com/mitsuhiko/status/2091210687091491308
    verbatim: |
      Pi was never small by code. Pi is small in that it's lightweight in context usage and out of the box workflow invasiveness. We will not change that. We're going to make a longer post into the why for the new harness.
    inline: "Pi was never small by code. Pi is small in that it's lightweight in context usage and out of the box workflow invasiveness"
    summary: >
      What 'small' means to the Pi maintainers, and the promise attached to the new harness.
    verdict: >
      Voice. We report the definition and the promise. The new harness is on Pi's dev branch and not in a tag; see the Pi profile.

