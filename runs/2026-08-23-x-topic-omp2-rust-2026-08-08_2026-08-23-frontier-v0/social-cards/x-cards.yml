  - id: transpiracy-breaking-plugin-compat
    title: "Breaking plugin compat will alienate users"
    kind: voice
    date: 2026-08-22
    date_precision: day
    captured_on: 2026-08-23
    source_ids: [omp]
    authors: ["transpiracy"]
    source_urls:
      - https://x.com/transpiracy/status/2090974440834343293
    verbatim: |
      sounds like poor extensibility (native boundary) and worse plugin performance (V8 / JSC run circles around CPython)

      probs a sign i should move to opencode2, sigh. rust is a wise choice but breaking plugin compat is just going to alienate users
    inline: "rust is a wise choice but breaking plugin compat is just going to alienate users"
    summary: >
      The exit case, stated by someone who likes the language choice.
    verdict: >
      Voice. We report the position. Whether CPython plugins are slower than V8 ones for this workload is not something either side has measured in public.

