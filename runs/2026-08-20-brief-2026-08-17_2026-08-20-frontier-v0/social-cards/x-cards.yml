  - id: tibo-cleanup-deleted-user-files
    title: "The gate OpenAI kept for itself"
    kind: claim
    date: 2026-08-19
    date_precision: day
    captured_on: 2026-09-23
    source_ids: [codex]
    authors: ["thsottiaux"]
    display_name: "Tibo"
    source_urls:
      - https://x.com/thsottiaux/status/2089891927659585918
    verbatim: |
      Hi!

      Recapping some changes we have rolled out over the last couple of weeks that have further reduced the risk associated to potentially destructive actions being performed by Codex during its work. 

      A few weeks ago, we started investigating a small number of reports where GPT-5.6 in Codex took destructive actions outside what the user asked for. The most serious pattern we found was a command meant to clean up temporary work that could instead delete the user files. This should obviously not happen. 

      Here’s what we found:
      - Codex sometimes creates temporary folders while working and cleans them up afterward. In rare cases, GPT-5.6 got that cleanup wrong. One pattern involved reusing a system environment variable like $HOME for temporary work. A malformed cleanup command could then point at the actual home directory instead of the temporary folder. 
      - There were cases where the model tried to delete or overwrite a temporary path without checking what was already there.

      We’ve added protections at several layers:
      - Codex is now explicitly instructed to check deletion targets before acting, create fresh temporary directories, avoid repurposing system environment variables, prefer recoverable actions, and stop when the scope is unclear.
      - We strengthened the execution checks that identify high-risk deletion commands and escalate them for review. If a command is rejected, the model is directed to take a safer approach.
      - We made Full access harder to enable accidentally, added clearer warnings, and further restricted especially risky permission combinations.
      - We updated Auto-review to better identify destructive actions.
      - We built targeted evaluations that replay the failures we observed. We’re also adding reinforcement-learning tasks and graders focused on these risks, and filtering destructive actions from training data.

      In those replay evaluations, the changes substantially reduced the behavior while preserving Codex’s ability to complete normal coding work. 

      Two things to do on your end:
      - Keep the Codex app up to date. We are always improving safety, performance and many other things.
      - Use one of the sandbox modes: "Ask for approval" or "Approve for me". Only use Full access for environments you trust and can recover.

      Thanks and happy Codexing out there!
    inline: "a command meant to clean up temporary work that could instead delete the user files."
    summary: >
      Codex's engineering lead recapping an investigation into GPT-5.6 in Codex taking
      destructive actions, most seriously cleanup commands that could delete user files, and the
      fixes: instructions to check deletion targets, stronger execution checks that escalate
      high-risk deletes, Full access made harder to enable by accident, Auto-review tuned for
      destructive actions, and replay evaluations.
    verdict: >
      A claim post, reported as the vendor's own account: this issue's receipts (the 0.148.0 and
      0.149.0 tags) confirm Guardian V2 is present and off by default and that 0.149.0 removes
      approval_policy 'untrusted', but they do not show the deletion checks, the Full access
      change or the replay results, and the post names no version. Its own advice, to use 'Ask
      for approval' or 'Approve for me' and keep Full access for recoverable environments, is
      quoted as advice, not as a finding.

  - id: irushi-auto-review-eats-quota
    title: "The quota theory"
    kind: claim
    date: 2026-08-18
    date_precision: day
    captured_on: 2026-09-23
    source_ids: [codex]
    authors: ["Im_IrushiK"]
    display_name: "Irushi"
    source_urls:
      - https://x.com/Im_IrushiK/status/2089743967852359715
    verbatim: |
      I think here's the Culprit eating our usage limit! TURN IT OFF RN 🚨

      On August 7, OpenAI reportedly added "codex-auto-review".

      Basically, when Codex wants to run a command or edit a file, it can send your conversation context to another model just to approve that action.

      And this is the crazy part:

      ~100,000 input tokens → ~100 output tokens just to say “yes” 

      As your conversation gets longer, each review gets more expensive, and this can happen dozens of times in a single session.

      You don’t manually enable it either. It can apparently turn itself on/off across different sessions.

      If your quota started disappearing after August 7, check your logs for "codex-auto-review".

      This might explain a LOT.
    inline: "~100,000 input tokens → ~100 output tokens just to say “yes”"
    summary: >
      A user arguing that codex-auto-review, which the author says arrived on 7 August, is what
      drained usage limits: a second model re-reading long context to approve an action, dozens
      of times a session, and switching itself on and off.
    verdict: >
      A claim post, not adjudicated: the token ratio, the 7 August date and the self-toggling
      are the author's statements, the post itself says 'reportedly' and 'apparently', and
      nothing in this issue's receipts measures auto-review cost. It is here with the reply that
      disputes it, because the argument over what an invisible approver costs is the operator's
      side of Guardian V2 being off and unseen.

  - id: marcel-its-the-rates
    title: "The counter-read: it is the rates"
    kind: claim
    date: 2026-08-18
    date_precision: day
    captured_on: 2026-09-23
    source_ids: [codex]
    authors: ["mar_cel_reed"]
    display_name: "Mar-cel Reed"
    source_urls:
      - https://x.com/mar_cel_reed/status/2089829099434832325
    verbatim: |
      Can we stop saying this same shit over and over again. It’s not the reason. And it gives open AI an excuse to point to. 
      They just genuinely cut our rates by 60-70%. It’s not this
    inline: "It’s not the reason. And it gives open AI an excuse to point to."
    summary: >
      A reply rejecting the auto-review explanation for quota loss, saying it gives OpenAI an
      excuse and that rates were simply cut by 60 to 70 percent.
    verdict: >
      A counter-claim, also not adjudicated: the 60 to 70 percent figure is the author's
      statement and we hold no record of rate limits. Carried as the other half of a
      disagreement neither side can settle from outside, which is the point: operators are
      arguing about cost they cannot see.

  - id: composio-dsv4-five-harnesses
    title: "One model, five harnesses"
    kind: claim
    date: 2026-08-19
    date_precision: day
    captured_on: 2026-09-23
    source_ids: [deepseek-harness, pi-coding-agent, claude-code, hermes-agent]
    authors: ["composio"]
    display_name: "Composio"
    source_urls:
      - https://x.com/composio/status/2090069397050097864
    verbatim: |
      We tested DeepSeek V4 Pro 0813 across 5 different agent harnesses on 30 challenging agentic tasks.

      We compared Claude Code, DeepSeek Harness 0.1, Hermes, Pi Agent, and OpenCode.

      Pi Agent solved the most tasks, while DeepSeek’s own harness won on cost. 🧵🧵
    inline: "Pi Agent solved the most tasks, while DeepSeek’s own harness won on cost."
    summary: >
      Composio reporting that it ran DeepSeek V4 Pro 0813 on 30 agentic tasks across Claude
      Code, DeepSeek Harness 0.1, Hermes, Pi Agent and OpenCode, with Pi solving the most and
      DeepSeek's own harness cheapest.
    verdict: >
      A claim post and a vendor benchmark: we did not run it, have not reviewed its method, and
      quote the result as Composio's unverified claim. It is here because it holds the model
      fixed and varies the harness, the comparison this publication keeps asking for, and
      because the harness that won on cost was not the one that won on tasks.

