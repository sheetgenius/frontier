      sandboxes are meant to, in the same window as a vendor's account of cleanup commands
      deleting user files.

  - id: asura-whose-everyday-line
    title: "Whose everyday is it"
    kind: voice
    date: 2026-08-20
    date_precision: day
    captured_on: 2026-09-23
    source_ids: [claude-code]
    authors: ["asura25ai"]
    display_name: "アスラ|Asura-AI"
    source_urls:
      - https://x.com/asura25ai/status/2090575269589287290
    verbatim: |
      Claude Codeに【auto mode】
      日常は通す、危ないのだけ人に返す、がデフォルトになった

      対してこっちは、日常の線がまだ自分でも分かってない
      非エンジニアだと特にそう
      誰の日常なんだろう、ってなる

      secretary → REQUIRES_APPROVAL → human
      証拠はこれだけ
    inline: "日常の線がまだ自分でも分かってない"
    summary: >
      A Japanese-language post on Claude Code's auto mode. Our rendering: auto mode made letting
      everyday work through, and returning only the dangerous cases to a person, the default; on
      my side I still do not know where that everyday line is, especially as a non-engineer, and
      you end up asking whose everyday it is.
    verdict: >
      A voice post about the author's own setup, not a claim about the classifier; we assert
      only that it was said. It is here because it asks, from outside engineering, the question
      this issue asks of embedders: the line between routine and dangerous has to be drawn by
      someone, and the default does not say who.
