  - id: 49agents-container-took-the-hit
    title: "The container took the hit"
    kind: voice
    date: 2026-08-20
    date_precision: day
    captured_on: 2026-09-23
    source_ids: [claude-code]
    authors: ["49agents"]
    display_name: "Building qorqut"
    source_urls:
      - https://x.com/49agents/status/2090576040515027124
    verbatim: |
      docker sandbox per agent is cheap insurance. claude code once tried to run a destructive command on the wrong directory, container took the hit. no sandbox means every long task is a bet on the agent being careful. are you running them direct on the host?
    inline: "claude code once tried to run a destructive command on the wrong directory, container took the hit."
    summary: >
      A builder arguing that a Docker sandbox per agent is cheap insurance, because Claude Code
      once ran a destructive command against the wrong directory and the container absorbed it.
