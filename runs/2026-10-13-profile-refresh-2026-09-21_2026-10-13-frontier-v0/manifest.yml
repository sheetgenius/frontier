harness_shape: >
  One coordinator with editorial authority. Research: 22 read-only researchers,
  one per watched source, each followed by an adversarial verifier. Write-ups:
  one author per source applies the verifier's corrections, generates findings
  with findings-spec/fromharvest.mjs, and writes a first profile draft. Synthesis:
  six independent lenses (consistency, three-question lens, thread check, reader
  utility, posture and fairness, comparison map) merged into SYNTHESIS.md and one
  directive file per profile. Drafting, per profile and serial: final draft,
  structural edit, fact-check against harvest and crosscheck, language pass,
  then a three-judge panel (cold read, receipts, house bar) with up to two fix
  rounds; a mechanical gate after every writing stage; a whole-set review last.
  Research ran on Claude until the coordinator hit its usage limit; everything
  after the first three crosschecks ran on Codex CLI at the operator's direction.
  The weekly issue was then built from the same run: signals written from the
  findings and adversarially verified; Lane C banter plus nine source sweeps,
  a social pick, a URL-only capture pass that never saw the expected text, and
  cards sliced programmatically from that capture; two competing drafts merged
  by a chief editor; structure, fact and language passes; three judge rounds
  (cold read, receipts, house bar) with fix passes; a receipts recheck; and a
  readability pass judged by a cold reader who saw the quote text.
