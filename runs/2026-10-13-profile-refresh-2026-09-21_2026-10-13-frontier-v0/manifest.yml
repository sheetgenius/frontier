  - q: "Whether Guardian V2 is enabled by default in a later Codex stable."
    answer: >
      At the pinned stable rust-v0.162.1 and preview rust-v0.163.0-alpha.10,
      Guardian V2 is false by default. The older Guardian reviewer is a
      different, default-on feature. This check does not establish every
      intermediate stable or a later main default. Receipts:
      https://github.com/openai/codex/blob/rust-v0.162.1/codex-rs/features/src/lib.rs#L1763-L1814
      and https://github.com/openai/codex/blob/rust-v0.163.0-alpha.10/codex-rs/features/src/lib.rs .
  - q: "Whether OpenClaw's approved-exec fix (ab5611f0) becomes an ancestor of any tag."
    answer: >
      Yes, and this window closes the remaining extended-stable watch: v2026.8.35 inherits ab5611f0,
      as does stable v2026.10.3; July v2026.7.35 did not gain it. The new generic hook-argument
      binding repair is separate and only in 2026.10.5 betas. Receipts:
      https://github.com/openclaw/openclaw/compare/ab5611f0...v2026.8.35 and
      https://github.com/openclaw/openclaw/releases/tag/v2026.8.35 .
  - q: "Whether DeepSeek Harness reaches a non-prerelease tag with the approval path still composable, and whether anything authenticates the Web UI."
    answer: >
      No non-prerelease GitHub release exists through the cutoff; the ordinary
      release remains 0.2.0-rc.2. Web login verifies signed cookies using a
      persistent credential-provider secret. That establishes authentication,
      not isolation from agent commands running as the same OS user. The stronger
      claim that those commands can retrieve the signing material was not confirmed
      from this receipt alone and is removed. Receipts:
      https://github.com/deepseek-ai/deepseek-harness/releases/tag/dsh-v0.2.0-rc.2
      and
      https://github.com/deepseek-ai/deepseek-harness/blob/639ed015397290b3745d163aafe02ffee4aa3f84/packages/client/connection/src/browser-auth.ts#L125-L202 .
  - q: "Whether Paperclip's review-policy lock and CWE-78 guidance reach a stable."
    answer: >
      Stable v2026.824.0 lists serialized review-policy verdicts, prevention of
      policy downgrades and safer npx-form CLI guidance. GitHub records publication
      at 2026-08-25T04:23:27Z, before this window. This is a historical delivery
      check, not an October event or a complete upgrade recommendation. Receipt:
      https://github.com/paperclipai/paperclip/releases/tag/v2026.824.0 .
  - q: "Whether Paperclip's ACPX thought-text fix (c2cfd55e) reaches any tag."
    answer: >
      Stable v2026.831.0 contains c2cfd55e; v2026.824.0 and v2026.824.1 do not.
      That is a completed historical delivery check, not new October work. The
      comparison does not by itself prove that no other earlier tag contains it.
      Receipt:
      https://github.com/paperclipai/paperclip/compare/c2cfd55e...v2026.831.0 .
  - q: "Whether Gemini's preview-only retry/TTL, OAuth redirect, git-env and enableAgents fixes reach stable."
    answer: >
      Nothing reopens the prior closure: all four earlier preview-only repairs reached stable
      v0.57.0. This window adds a distinct build-file gate in 0.61.0, with final headless
      ASK-to-DENY conversion only in 0.63.0; current stable is 0.64.0. Receipts:
      https://github.com/google-gemini/gemini-cli/releases/tag/v0.57.0 and
      https://github.com/google-gemini/gemini-cli/commit/2fe7c2d3f065dc40ad573d50b2091116f8a4aa18 .
  - q: "Whether eve 0.39.3 actually queues on Slack and custom channels, and whether the self-mod subagent stays behind eve dev."
    answer: >
      The specific 0.39.3 behavior and the earlier claim that queue policy first
      bound in 0.63.0 were not reconfirmed. At 0.79.0 the queue path exists, but a
      held approval can still consume requester text queued before the prompt.
      Local self-modification is mounted by default in eve dev from 0.65.0;
      deployment uses a separate, explicitly mounted remote extension. Stable at
      cutoff, 0.79.0, includes the 0.78.0 requester-credential repair but lacks
      the pre-prompt queued-text repair. Receipts:
      https://github.com/vercel/eve/blob/eve%400.79.0/packages/eve/src/execution/session/input-queue.ts#L229-L244
      and https://github.com/vercel/eve/blob/eve%400.79.0/docs/guides/self-modification.md .
