    title: "Choose releases or main"
    kind: "claim"
    date: "2026-10-13"
    date_precision: "day"
    captured_on: "2026-10-14"
    source_ids: ["hermes-agent"]
    authors: ["tonbistudio"]
    display_name: "tonbi"
    source_urls: ["https://x.com/tonbistudio/status/2110155915513221301","https://github.com/NousResearch/hermes-agent/releases/tag/v0.21.7","https://github.com/NousResearch/hermes-agent/blob/v0.21.7/website/docs/getting-started/updating.md#L33-L51"]
    verbatim: "Hermes Agent now has two ways to update:\n\n1. Stable: The default, your Hermes will only update to stable releases\n\n2. Main: The previous approach, your Hermes will update to the very latest commit\n\nI made a short video showing the difference, and how to switch between the modes!"
    inline: "Stable: The default, your Hermes will only update to stable releases"
