  - id: "andrew-barba-eve-loop-control"
    title: "Replace the default loop's tools"
    kind: "claim"
    date: "2026-09-29"
    date_precision: "day"
    captured_on: "2026-10-14"
    source_ids: ["eve"]
    authors: ["andrew_barba"]
    display_name: "Andrew Barba"
    source_urls: ["https://x.com/andrew_barba/status/2104944521834357086","https://github.com/vercel/eve/blob/eve%400.66.0/docs/concepts/built-in-tools.md#L14-L22","https://github.com/vercel/eve/blob/eve%400.66.0/packages/eve/src/compiler/default-tool-policy.ts#L71-L92"]
    verbatim: "eve is one of the few frameworks that gives you full control over building the exact agent loop that you want.\n\ndefaultTools: false\n\ngo build the exact loop for your use case. all of our default tools are build on public eve api. we give you full access to the background task model, dynamic workflows, parking, HITL. I'm not sure of any other framework that gives you the low level tools that eve gives you."
    inline: "eve is one of the few frameworks that gives you full control over building the exact agent loop that you want."
    summary: "Andrew Barba points builders to Eve's defaultTools setting and public agent primitives."
    verdict: "Claim, confirmed in part by Eve 0.66.0: defaultTools: false removes optional framework tools and preserves authored replacements. The same code retains required connection discovery, so the flag is not a promise to remove every framework tool. We did not establish that every listed primitive is freely replaceable or that competing frameworks lack comparable control."

  - id: "kushbhuwalka-retired-plumbing"
    title: "Stop owning the Slack plumbing"
