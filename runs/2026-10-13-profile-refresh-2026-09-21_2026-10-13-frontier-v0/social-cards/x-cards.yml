    source_ids: ["claude-code"]
    authors: ["ClaudeDevs"]
    display_name: "ClaudeDevs"
    source_urls: ["https://x.com/ClaudeDevs/status/2105721440490361312","https://github.com/anthropics/claude-code/releases/tag/v2.1.287","https://github.com/anthropics/claude-code/blob/2301018b1f61/mods/types/claude-code.d.ts#L2734-L2994"]
