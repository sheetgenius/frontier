    source_urls: ["https://x.com/akashc777/status/2106567332223205658"]
    verbatim: "The useful part is the feedback loop, not the one-click fix. Keep the failing input, offending commit, and post-fix regression test attached to the agent task, or you will automate guesswork."
    inline: "Keep the failing input, offending commit, and post-fix regression test attached to the agent task, or you will automate guesswork."
    summary: "Akash Hadagali asks for the failing case, offending commit and regression test to travel with an agent repair."
