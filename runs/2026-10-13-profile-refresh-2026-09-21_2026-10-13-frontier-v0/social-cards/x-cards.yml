  - id: "gneubig-automated-triage-and-review"
    title: "The receiving side gets automated too"
    kind: "claim"
    date: "2026-10-02"
    date_precision: "day"
    captured_on: "2026-10-14"
    source_ids: ["openhands"]
    authors: ["gneubig"]
    display_name: "Graham Neubig"
    source_urls: ["https://x.com/gneubig/status/2105833104648667520","https://github.com/OpenHands/OpenHands/releases/tag/v1.22.0","https://github.com/OpenHands/OpenHands/releases/tag/v1.24.0"]
    verbatim: "This is so true!\n\nAt OpenHands we have have reached the \"bonus stage\" from the original post.\n\nOur process has been rebuilt around the assumption that if an issue is opened on the repo, we are guaranteed get a vibe-coded PR opened, so our defense is: (1) make sure that all the issues are maximally clear through automated issue triage, and (2) automate code review so that we only accept high-quality contributions.\n\nAll of these are powered by OpenHands automations:\nhttps://t.co/NW7D3ULZDt"
    inline: "make sure that all the issues are maximally clear through automated issue triage, and (2) automate code review so that we only accept high-quality contributions."
    summary: "Graham Neubig describes automated issue triage and review as OpenHands' response to generated pull requests."
    verdict: "Claim about the team's practice. OpenHands v1.22.0 confirms the automation service and Git Sync path; v1.24.0 delivers read-only access to automation conversations. Those releases establish supporting machinery, not the stated guarantee that each issue gets a PR or that automated review admits only high-quality changes. We did not audit the team's runs, acceptance rate or human review effort."

  - id: "iamandresvilla-sandbox-is-not-offline"
    title: "Aislamiento con salida a internet"
    kind: "claim"
    date: "2026-10-10"
    date_precision: "day"
    captured_on: "2026-10-14"
    source_ids: ["github-copilot-cli"]
    authors: ["iamandresvilla"]
    display_name: "Andres Villa | AI"
    source_urls: ["https://x.com/iamandresvilla/status/2108910010851856461","https://github.com/github/docs/blob/602021b0ba16/content/copilot/how-tos/cloud-and-local-sandboxes/using-local-sandboxing.md#L25-L71","https://github.com/github/docs/blob/602021b0ba16/content/copilot/how-tos/cloud-and-local-sandboxes/configuring-local-sandbox-settings.md#L243-L291"]
    verbatim: "2/3 En Copilot CLI:\n\n/sandbox enable \u2192 activa el aislamiento.\n/sandbox status \u2192 comprueba si se aplica en esa sesi\u00f3n.\n\nOjo: el acceso saliente a internet est\u00e1 permitido por defecto. Activarlo no equivale a desconectar al agente."
    inline: "Ojo: el acceso saliente a internet est\u00e1 permitido por defecto. Activarlo no equivale a desconectar al agente."
    summary: "A Spanish-language reminder that enabling Copilot CLI's sandbox does not disconnect its network. This summary is our paraphrase."
    verdict: "Claim, in Spanish; the English summary is our paraphrase. GitHub's pinned CLI docs confirm /sandbox enable, per-session status and outbound internet enabled by default. Local-network access and destination rules are separate settings, with OS-specific enforcement. We checked the documented contract, not live Windows, macOS or Linux isolation; enabling the sandbox alone does not establish an offline run."

  - id: "kylian-cros-outside-recovery-owner"
    title: "Who restarts the agent?"
    kind: "voice"
    date: "2026-10-12"
    date_precision: "day"
    captured_on: "2026-10-14"
    source_ids: ["openclaw"]
    authors: ["kylianCros"]
    display_name: "Kylian"
    source_urls: ["https://x.com/kylianCros/status/2109566198291771531"]
    verbatim: "works until the bug takes down the agent itself. \n\nwe host openclaw agents and what breaks is rarely the model, its the box: ram blows up mid build, disk fills, logins expire. \n\nif nothing outside brings it back, theres no one left to read the error"
    inline: "if nothing outside brings it back, theres no one left to read the error"
    summary: "A host of OpenClaw agents says memory, disk and expired logins can stop the agent that would diagnose them."
    verdict: "Voice, an attributed hosting experience that cuts against a self-maintaining agent closing its own loop. We did not inspect that fleet or verify which failures dominate it. The retained question is concrete even without that frequency claim: name the outside process or person that can recover the box when the agent itself is down."

