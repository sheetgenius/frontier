  - id: "lydiahallie-hooks-allow-is-approval"
    title: "Allow is already an answer"
    kind: "claim"
    date: "2026-10-12"
    date_precision: "day"
    captured_on: "2026-10-14"
    source_ids: ["claude-code"]
    authors: ["lydiahallie"]
    display_name: "Lydia Hallie \u2728"
    source_urls: ["https://x.com/lydiahallie/status/2109716193468874978","https://web.archive.org/web/20261014213355/https://code.claude.com/docs/en/hooks","https://github.com/anthropics/claude-code/blob/2301018b1f61/CHANGELOG.md"]
    verbatim: "Sorted this out over DMs but replying here as well in case anyone else hits this! Root cause was PreToolUse hooks returning \"allow\" by default, which tells Claude that the command is already approved, so it skips the step where the auto mode classifier would normally run. Easy to miss, we're looking at changing this on our end too. \n\nIn the meantime; if you have any deny hooks, make sure they print nothing instead of \"allow\" when there's nothing to block! That way the command still goes through the classifier. If you want Claude to always ask before deleting files (even in auto mode) add \"Bash(rm *)\" under permissions.ask"
    inline: "Root cause was PreToolUse hooks returning \"allow\" by default, which tells Claude that the command is already approved, so it skips the step where the auto mode classifier would normally run."
    summary: "Lydia Hallie attributes a privately diagnosed auto-mode surprise to a hook that returned allow."
    verdict: "Claim about a private diagnosis. The October 14 archived hook reference confirms that allow skips permission prompting, while ask forces a prompt even in auto mode; the pinned 2.1.296 changelog records separate hook repairs. We did not inspect the DM session or prove that silent output reaches the classifier on every path. The diagnosis and proposed future change remain Hallie's account."

  - id: "thsottiaux-free-auto-review"
    title: "A reviewer for permission requests"
    kind: "claim"
    date: "2026-10-06"
    date_precision: "day"
    captured_on: "2026-10-14"
    source_ids: ["codex"]
    authors: ["thsottiaux"]
    display_name: "Tibo"
    source_urls: ["https://x.com/thsottiaux/status/2107368734981517634","https://github.com/openai/codex/blob/rust-v0.162.1/codex-rs/ext/guardian-reviewer/src/routing.rs#L54-L102"]
    verbatim: "Day 2.1/\n\nWe have made Auto-review free for all users signed in through a ChatGPT account. You can enable it in settings > permissions > auto-review. Auto-review improves upon the default sandbox setting that requires you to approve everything, which is prone to decision fatigue unless you spend a lot of time configuring specific rules.\n\nIt allows you to run long tasks while having a second agent review all actions taken by the primary agent. Its only goal is to prevent high-risk actions from being taken and to protect against unwanted actions that are not aligned with the original user intent. This  Auto-review feature is now free and does not draw usage from your plan."
    inline: "Auto-review improves upon the default sandbox setting that requires you to approve everything, which is prone to decision fatigue unless you spend a lot of time configuring specific rules."
    summary: "Tibo announces free Auto-review for ChatGPT sign-ins as an answer to approval fatigue."
    verdict: "Claim, partly corroborated. Codex 0.162.1 routes eligible permission requests to AutoReview, but its Full Access path approves without that model review. That does not support review of every action or a safety guarantee. The free-for-ChatGPT and no-plan-usage statements remain the vendor's billing claims; we did not verify account eligibility or bills."

  - id: "lucas-builds-review-slot-machine"
    title: "Review without an end"
    kind: "voice"
    date: "2026-10-11"
    date_precision: "day"
    captured_on: "2026-10-14"
    source_ids: ["claude-code"]
    authors: ["lucas_builds"]
    display_name: "Lucas"
    source_urls: ["https://x.com/lucas_builds/status/2109252687477031014"]
    verbatim: "Asking Claude to review your code is a slot machine.\n\nEvery review finds brand new bugs. Review again: more. Review a tenth time: it still finds something.\n\nIt never runs out of bugs to find... so how do you decide your code is actually done?"
    inline: "It never runs out of bugs to find... so how do you decide your code is actually done?"
    summary: "Lucas describes repeated review producing more alleged bugs without a completion rule."
    verdict: "Voice, frustration with repeated Claude review. We have no repository, review transcripts or confirmed bug set for those ten passes, so this is not evidence of a defect rate. It poses the completion question that John Rood's reply answers."

  - id: "john-rood-review-stop-rule"
    title: "Give review a stop rule"
    kind: "voice"
    date: "2026-10-11"
    date_precision: "day"
    captured_on: "2026-10-14"
    source_ids: ["claude-code"]
    authors: ["johnroodepic"]
    display_name: "John Rood"
    source_urls: ["https://x.com/johnroodepic/status/2109369506107937114"]
    verbatim: "The loop never closes because \"find bugs\" has no stop rule, so every fix earns another pass. Done has to come from something binary, a failing test or an unmet spec, not from a reviewer running out of ideas."
    inline: "Done has to come from something binary, a failing test or an unmet spec, not from a reviewer running out of ideas."
    summary: "John Rood proposes tests or a specification as the stopping condition for review."
    verdict: "Voice, a proposed acceptance rule for Lucas's endless-review problem. A failing test or unmet requirement gives this team something concrete to resolve; no reviewed task here demonstrates that the rule catches every consequential bug. It is advice about declaring done, not a claim that automated review can replace judgment."

  - id: "hackerlogs-codex-runtime-inventory"
    title: "The installed version is not the whole inventory"
    kind: "claim"
    date: "2026-10-12"
    date_precision: "day"
    captured_on: "2026-10-14"
    source_ids: ["codex"]
    authors: ["hackerlogs"]
    display_name: "hackerlogs"
    source_urls: ["https://x.com/hackerlogs/status/2109761263240696115","https://github.com/openai/codex/releases/tag/rust-v0.157.0","https://github.com/openai/codex/blob/rust-v0.162.1/codex-rs/app-server-daemon/README.md#L22-L74"]
    verbatim: "Codex CLI leaves a self-updating background daemon running after you close the terminal. It is on by default.\n\nWhat is on the record (openai/codex issue #48195, open since Sep 25, on the HN front page today):\n\nSince 0.157.0, opening an interactive codex session starts \"codex app-server --managed-daemon\". It runs with no TTY and gets reparented to PID 1, so it survives every window you close until you stop it or reboot.\n\nIt copies the whole platform package, about 374 MB including bundled bwrap, zsh and rg, into ~/.codex/packages/app-server-daemon/ and runs from that copy. The backend version is now decoupled from whatever npm or brew installed.\n\nA detached updater (pid-update-loop) checks for releases 5 minutes after start, then hourly, downloads them and restarts the backend, which can kill active turns.\n\nIt also pins the environment of whichever session started it. The reporter's per-invocation HTTPS_PROXY stuck to the daemon's outbound traffic for every later session.\n\nAnd \"codex app-server daemon stop\" leaves the updater alive. The 0.162 release notes (Oct 8) still tune daemon auto-start rather than drop it.\n\nIf you run Codex from @OpenAIDevs on a work laptop or CI image, you now have a coding agent that executes commands on your machine and ships its own long-lived, self-replacing binary outside your package manager. Your inventory says one version; the process answering turns may be another.\n\nTonight:\n1. Run \"codex features disable daemon_auto_start\" (or set daemon_auto_start = false in config.toml) on every dev box and CI image\n2. Stop it fully: \"codex app-server daemon stop\", then pkill -f 'app-server daemon pid-update-loop', then delete ~/.codex/packages/app-server-daemon\n3. Add a fleet or EDR check for codex processes parented to PID 1 and binaries running from ~/.codex/packages\n\nClosing the window should end the agent.\n\nhttps://t.co/lzOCb1sJQP"
    inline: "Your inventory says one version; the process answering turns may be another."
    summary: "A daemon recap asks operators to inventory the running Codex backend as well as the CLI package."
    verdict: "Claim, corroborated at narrower scope. Release 0.157.0 enables automatic daemon startup; the 0.162.1 README confirms retained startup environment and independent updates for eligible managed daemons. We did not reproduce the reporter's proxy incident, package size or updater-survives-stop claim, and do not endorse the blanket CI cleanup recipe. Inventory both versions before deciding which runtime to keep."

