  - id: "japanaibuilders-resume-side-effects"
    title: "A resumed send is still a send"
    kind: "voice"
    date: "2026-10-05"
    date_precision: "day"
    captured_on: "2026-10-14"
    source_ids: ["pi-coding-agent"]
    authors: ["japanaibuilders"]
    display_name: "Shiro - Japan AI Builders"
    source_urls: ["https://x.com/japanaibuilders/status/2107256352984940775"]
    verbatim: "Checkpointing is the part we'd test hardest: a resumed run that replays a send is worse than a crash. Our browser job was audited five times by a second model before it ran unattended. When Pi resumes, does it replay side-effecting steps?"
    inline: "Checkpointing is the part we'd test hardest: a resumed run that replays a send is worse than a crash."
    summary: "Shiro asks whether resuming a run can repeat an external send."
    verdict: "Voice, a recovery acceptance question, not a report that Pi duplicates sends. Neither the five model audits nor an execution trace is supplied. Keeping a durable log and proving that a resumed browser job cannot repeat a side effect are different tests; this post asks for the latter without establishing its result."

