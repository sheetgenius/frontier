  - id: 2026-10-13-openclaw-approval-binds-final-hook-arguments-in-beta
    status: accepted
    section: control-plane
    source: openclaw
    channel: preview-or-beta
    title: "OpenClaw's beta binds approval to a hook's final arguments"
    finding_ids:
      - 2026-10-13-openclaw-hooks-can-rewrite-approved-arguments-on-stable-binding-is-fixed-only-in-beta
    summary: >
      Stable 2026.10.3 and extended-stable 2026.8.35 accept trusted inline
      approval before ordinary before_tool_call hooks can replace the arguments.
      The repair first appears in 2026.10.5-beta.2 and remains in beta.3, published
      2026-10-13. It isolates the approved snapshot and blocks replacement unless
      the hook requests approval for its final parameters. This is separate from
      the August exec-byte repair now inherited by extended-stable.
    why_action_bearing:
      - >
        Operators on either stable line: inventory before_tool_call hooks and
        remove or pin plugins you do not control. An approval for the original
        arguments does not cover a later replacement. Spend review on the hook's
        actual transformation rather than trusting the displayed approval.
      - >
        Plugin authors can try beta.3 and return requireApproval with final
        parameters. Test that an unapproved rewrite is blocked and an approved
        replacement executes exactly those parameters; plugins relying on silent
        replacement must change.
      - >
        A stable containing 34d07e7b0dc1b5f0ed54de67a9647d9e6b8c23de or a verified
        equivalent backport, plus the replacement-argument test, would settle
        adoption. Neither a future version number nor an issue closure proves
        inclusion; no exploit was executed here.
    accessibility_consequence:
      what_got_easier: "Beta plugin authors can request consent for the transformed action they actually intend to run."
      who_can_use_now: "Beta.3 testers; the repair is absent from both inspected stable lines."
      authority_visibility: "Approval binds to final parameters instead of the pre-hook display."
    security_consequence:
      threat_blocked_or_opened: "Stable permits an ordinary hook to change an already approved tool effect."
      attacker_model: "An admitted transforming hook, including a plugin the operator does not control."
      enforcement: "Beta isolates the approval snapshot and requires renewed approval for replacements."
      cost_to_operator: "Audit stable hooks and update transforming plugins before adopting the repair."
      residual: "Beta-only source repair; stable delivery and deployed behavior remain unverified."
    receipts:
      - url: https://github.com/openclaw/openclaw/commit/34d07e7b0dc1b5f0ed54de67a9647d9e6b8c23de
        precision: commit_diff_reviewed
