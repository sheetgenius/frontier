  - id: 2026-10-13-omnigent-bubblewrap-helper-escape-fixed
    status: accepted
    section: runtime
    source: omnigent
    channel: tagged-release
    title: "Omnigent 0.18.0 closes a host escape through bubblewrap helper files"
    finding_ids:
      - 2026-10-13-omnigent-linux-bubblewrap-helpers-could-escape-through-host-temporary-files-before-v0-18
    summary: >
      GHSA-v3vj-mch3-x6c2, published 2026-10-13, affects Omnigent before 0.18.0
      on named Linux bubblewrap helper paths. Code already executing inside an
      affected sandbox could use host temporary files to compromise the launcher
      and execute as Omnigent's host OS account, exposing that account's data
      and processes. Administrator privileges are not required. Stable 0.18.0
      removes the broad grants and rejects launcher-directory exposure.
    why_action_bearing:
      - >
        Linux execution-host owners: install stable 0.18.0 on affected hosts and
        restart helpers, not only the central server. The 2026-10-13 nightly
        predates the patch. Until patched, use the advisory's disposable VM or
        container without sensitive host credentials or mounts.
      - >
        Inventory ACP, Goose, Kimi, Pi and Qwen helper processes and their running
        package versions. Check that launcher-directory write grants are rejected
        after restart; a patched server does not replace running host helpers.
      - >
        A fixed host package, restarted process identity and a test rejecting
        launcher-directory write exposure would establish deployed remediation.
        The advisory and source do not measure exploitation or qualify every
        sandbox backend. The patch requires host maintenance now instead of
        relying on model approval to contain already executing code.
    accessibility_consequence:
      what_got_easier: "The affected helper paths can retain Linux sandbox use with narrower host-file grants."
      who_can_use_now: "Omnigent execution hosts on stable 0.18.0 after helper restart."
      authority_visibility: "Check the execution host and process, not just the service's displayed version."
    security_consequence:
      threat_blocked_or_opened: "Fixes sandbox-to-host code execution as the OS account running Omnigent."
      attacker_model: "Code already running in an affected Linux bubblewrap sandbox, without administrator privilege."
      enforcement: "Remove broad temporary writes, reject launcher-directory grants and restrict launcher file permissions."
      cost_to_operator: "Upgrade distributed hosts and restart affected helpers; use external isolation until then."
      residual: "No local exploitation or remediation probe; other sandbox paths require their own evidence."
    receipts:
      - url: https://github.com/omnigent-ai/omnigent/security/advisories/GHSA-v3vj-mch3-x6c2
        precision: canonical_advisory
      - url: https://github.com/omnigent-ai/omnigent/commit/d2e077a1e3d502748ec0d792dfdede7319ccb968
        precision: commit_diff_reviewed
      - url: https://github.com/omnigent-ai/omnigent/releases/tag/v0.18.0
        precision: github_release

  - id: 2026-10-13-hermes-agent-unattended-gateway-policy-now-applies
    status: accepted
    section: control-plane
    source: hermes-agent
    channel: tagged-release
    title: "Hermes 0.21.7 routes unattended Gateway commands through configured policy"
    finding_ids:
      - 2026-10-13-hermes-agent-unattended-deny-did-not-apply-inside-a-running-gateway-until-v0-21-7-webhook-turns-reached
    summary: >
      v0.21.7 (2026-10-12) repairs the running Gateway's webhook,
      msgraph_webhook and no-notifier API paths. Previously its process-wide ask
      flag could bypass approvals.unattended_mode and, in smart mode, send commands
      to the guardian; a model approval could execute them despite intended unattended
      denial. No-notifier API requests could also return unanswerable pending
      results. The repair consults the configured unattended branch before the
      guardian on these paths.
    why_action_bearing:
      - >
        Unattended Gateway owners: upgrade to v0.21.7 and inspect
        approvals.unattended_mode before launch, especially a saved approve value.
        Previously model-approved jobs can now be blocked. Add only intended
        command_allowlist patterns rather than broadly disabling approval.
      - >
        Review flagged commands executed by earlier webhook sessions. Test a
        harmless denied command on each used no-notifier path and record whether
        it executes; test notifier-backed requests separately. Earlier user denies
        and hard floors remain, and container/YOLO/allowlist branches differ.
      - >
        Those mode-specific results would settle the installed policy's effect.
        The stronger retained stop can create exceptions needing attention, while
        no-notifier requests no longer depend on a human reply they cannot accept.
    accessibility_consequence:
      what_got_easier: "Named unattended Gateway paths can make a deterministic configured decision without an unavailable responder."
      who_can_use_now: "Webhook and no-notifier API Gateway operators on stable v0.21.7."
      authority_visibility: "Inspect unattended_mode and the actual request/notifier branch."
    security_consequence:
      threat_blocked_or_opened: "Closes a routing path where model approval bypassed configured unattended denial."
      attacker_model: "Instructions in an admitted unattended request that induce a flagged command."
      enforcement: "The repaired presence logic reaches unattended policy after earlier guards."
      cost_to_operator: "Inspect saved approve settings, audit earlier work and handle newly blocked intended commands."
      residual: "This is not a universal gate across YOLO, isolated-container, prepared-batch and allowlist paths."
    receipts:
