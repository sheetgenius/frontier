  - id: 2026-10-13-claude-code-mods-can-answer-permission-checks
    status: accepted
    section: control-plane
    source: claude-code
    channel: tagged-release
    title: "Claude mods join the permission chain before the classifier"
    finding_ids:
      - 2026-10-13-claude-code-mods-ship-on-by-default-in-2-1-286-and-can-approve-tool-calls-deny-rules-hold-over-them
      - 2026-10-13-claude-code-unreleased-on-main-after-2-1-296-the-mods-guard-extends-to-ask-verdicts-and-pins-policy
    summary: >
      Mods are released and enabled by default in 2.1.287, which ignores the old
      environment off switch. At cutoff, stable is 2.1.287 and latest is 2.1.296.
      Admitted mod code can replace an ask or non-managed hook block and, in auto mode, skip the
      classifier. Deny precedence depends on the built-in guard loading under
      managed settings or Team/Enterprise sign-in, with
      allowModsToOverrideDenyRules left false; mods' own process and file
      calls remain outside tool rules. Ask and environment holds are main-only.
    why_action_bearing:
      - >
        Managed fleets: use latest 2.1.296 and set managed
        pluginConfigs["cc-plugin-sec-default@builtin"].options.allowManagedModsOnly
        to true. Stable lacks later guard repairs. Before adding disableSideloadFlags,
        check CI invocations: it also rejects --agents and --mcp-config.
      - >
        Unmanaged users: inspect claude plugin validate for tool.check, then
        review or remove untrusted mods, or use --safe-mode or
        --settings '{"disableAllHooks":true}';
        built-in mods remain. CLAUDE_CODE_ENABLE_FUNCTION_HOOKS=0 is ineffective
        from 2.1.287. Keep whole-process containment because mods are unsandboxed.
      - >
        Plugin admission now requires reviewing code that can answer permission
        questions. A released binary containing the main guard's ask and
        environment holds, plus mode-specific denial tests, would settle that
        narrower repair; it would not turn the guard into hostile-code isolation.
    accessibility_consequence:
      what_got_easier: "Plugins can implement review and permission behavior inside the running session."
      who_can_use_now: "Users on released 2.1.287+, including stable 2.1.287 and latest 2.1.296 at cutoff."
      authority_visibility: "Inspect who answers tool.check and whether the organization guard actually loads."
    security_consequence:
      threat_blocked_or_opened: "A mod can approve over earlier checks; unmanaged deny rules may not hold."
      attacker_model: "An admitted user/plugin mod running unsandboxed as the Claude Code user."
      enforcement: "Managed mod admission and guard routing; tool rules do not confine mod filesystem/process access."
      cost_to_operator: "Code admission replaces some per-call prompts and can break CI sideload arguments."
      residual: "Released guard is deny-only; ask/environment holds at bf2323b3 are not in a published binary."
    receipts:
