  - id: 2026-10-13-openhands-local-terminal-inherits-the-stack-key
    status: accepted
    section: runtime
    source: openhands
    channel: tagged-release
    title: "OpenHands' local terminal inherits a key that reaches excluded secrets"
    finding_ids:
      - 2026-10-13-openhands-profile-secret-scopes-do-not-bind-the-agent-s-own-terminal-the-stack-s-session-key-is-in
      - 2026-10-13-openhands-per-conversation-docker-containers-ship-through-oh-conversation-runtime-the-execution-only
    summary: >
      At Canvas 1.27.1 with SDK/agent-server 1.54.0, the default local runtime's
      terminal can inherit OPENHANDS_AUTOMATION_API_KEY, an alias of the stack
      session key. SDK sanitization misses the alias, and the authenticated
      raw-secret route lacks a conversation-profile check. Profile selection
      therefore does not establish a credential boundary on that path. This is
      a source-derived path across pinned releases, not a reproduced exploit.
    why_action_bearing:
      - >
        npm, desktop and Docker-image users running terminal-enabled local
        conversations: keep production/deploy secrets out of this shared store
        when agents read untrusted repositories. Inspect the terminal environment
        and whether its effective key can retrieve a saved-but-excluded test secret.
      - >
        Where secret selection must hold, trial OH_CONVERSATION_RUNTIME=docker
        with OH_CONVERSATION_IMAGE pinned to ghcr.io/openhands/agent-server:1.54.0-python
        and exclude the automation key from the profile. This construction does
        not copy the outer alias wholesale; withholding it removes this
        inherited-key route to automation creation.
      - >
        Require a released alias removal, sanitization repair or automation-only
        key and denied-secret tests on both runtimes before trusting the boundary.
        Container construction alone is insufficient. The review moves from the
        profile label to actual terminal credentials and protected-route behavior.
    accessibility_consequence:
      what_got_easier: "The automation alias gives local agent tools direct access to stack administration APIs."
      who_can_use_now: "Terminal-enabled default-local Canvas conversations on the inspected 1.27.1/1.54.0 stack."
      authority_visibility: "Inspect inherited credentials and routes, not only selected profile secrets."
    security_consequence:
      threat_blocked_or_opened: "A local conversation can use the inherited stack key to retrieve secrets its profile excludes."
      attacker_model: "An agent or injected repository instructions able to read its terminal environment and call the server."
      enforcement: "Server authentication accepts the alias; profile launch filtering does not constrain that raw-secret route."
      cost_to_operator: "Separate sensitive stores or qualify per-conversation containers; withholding the alias removes this route to automation creation."
      residual: "Live local/Docker secret-denial tests remain open; no universal container isolation is claimed."
