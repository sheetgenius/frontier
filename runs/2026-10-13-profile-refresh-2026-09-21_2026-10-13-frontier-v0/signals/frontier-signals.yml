  - id: 2026-10-13-pi-coding-agent-native-mcp-and-tool-scripting
    status: accepted
    section: runtime
    source: pi-coding-agent
    channel: tagged-release
    title: "Pi's CLI connects MCP servers and composes their tools in JavaScript"
    finding_ids:
      - 2026-10-13-pi-coding-agent-mcp-is-built-into-the-cli-from-0-99-0-project-servers-wait-for-trust-stdio-servers-inherit
      - 2026-10-13-pi-coding-agent-codemode-lets-the-model-script-tool-calls-the-tool-calls-stay-gated-its-model-calls-do-not
      - 2026-10-13-pi-coding-agent-tools-stopped-being-a-strict-allowlist-once-codemode-or-tool-search-is-in-the-list-1-0
    summary: >
      0.99.0 (2026-09-29) brings built-in MCP and codemode to the CLI; current
      stable is 1.2.0. Scripts compose registered tools without a private MCP
      bridge. Enabled MCP servers with default exposure can activate codemode;
      SDK sessions do not load these built-ins automatically. Nested tool calls
      traverse hooks, while script classifier and image-model operations use
      session credentials outside the individual tool-call hooks.
    why_action_bearing:
      - >
        CLI integrators: try a configured MCP server and one multi-tool script
        on 1.2.0 before maintaining an equivalent bridge. Compare accepted
        outcomes, setup and review time before removing it; no net time saving
        or current-version quality comparison was measured.
      - >
        Read global and trusted-project mcp.json before launch. Stdio servers
        inherit Pi's environment and run beside the harness, so contain the whole
        process or scrub its environment. --no-mcp disables built-in MCP;
        autoEnableCodemode: false only prevents its automatic codemode activation.
      - >
        Keep authorization in hooks and govern script model credentials. Tool
        declarations and codemode-only presentation do not prove a callable-set
        restriction. Denial tests covering root calls, nested calls and model
        spend would settle a particular deployment's boundary; watch for tagged
        repairs to issue 10426 before relying on only-mode enforcement.
    accessibility_consequence:
      what_got_easier: "CLI users can reach MCP services and script multi-tool work without an adapter extension."
      who_can_use_now: "Configured CLI sessions from 0.99.0; use current stable 1.2.0. SDK embedding remains opt-in."
      authority_visibility: "Inspect server configuration, nested hooks and model credentials separately."
    security_consequence:
      threat_blocked_or_opened: "Trusting project MCP configuration can start host processes with inherited provider credentials."
      attacker_model: "An admitted repository/server or injected content reaching available tools and script model operations."
      enforcement: "Project trust gates configuration; nested tools traverse hooks, but model operations require separate credential control."
      cost_to_operator: "Server admission and containment replace bridge maintenance; scripted work still needs outcome review."
      residual: "Source checks establish dispatch paths, not containment or productivity in an installed deployment."
    receipts:
