  - id: 2026-10-13-eve-approved-calls-keep-requester-credentials
    status: accepted
    section: control-plane
    source: eve
    channel: tagged-release
    title: "Eve approvals stop lending the approver's credentials to the requester"
    finding_ids:
      - 2026-10-13-eve-approved-calls-ran-with-the-approver-s-identity-and-credentials-until-0-78
    summary: >
      0.78.0 (2026-10-13) makes approval consent only: execution and its policy
      recheck use the requester's identity and connections. In confirmed affected
      versions 0.70.0 through 0.77.0, another person's approval could lend their
      tool access; through 0.71.2 the rest of the turn could borrow it too.
      Stable 0.79.0 at cutoff contains this repair, but its separate queued-reply
      consent defect remains open.
    why_action_bearing:
      - >
        Deployments admitting other approval responders or anonymous requesters
        with user-scoped connections: upgrade to 0.79.0; the credential repair
        first ships in 0.78.0. Inspect approval.settled
        events where responderPrincipalId differs from the requester, then audit
        effects under the approver's credentials, including later turn calls on
        0.70.0 through 0.71.2.
      - >
        Rework flows that intentionally borrowed an IT or release approver's
        access. They stop working under consent-only execution; the proposed
        explicit credential-delegation API was unmerged at the 2026-10-13 cutoff.
        The human keeps responsibility for consent while tool policy owns
        execution authority.
      - >
        A requester lacking access must still be denied after an authorized
        second person approves. Record that test with both identities and the
        dispatched credential owner; it would establish the deployed boundary.
        The pre-0.70.0 affected range is unverified, and this fix does not close
        the separately signaled queued-text path.
    accessibility_consequence:
      what_got_easier: "Teams can separate another person's consent from the requesting user's available access."
      who_can_use_now: "Multi-user Eve deployments on 0.78.0 or later; stable at cutoff is 0.79.0."
      authority_visibility: "Keep the approver in the consent record and the requester as execution principal."
    security_consequence:
      threat_blocked_or_opened: "Closes privilege escalation through another user's tool connections after approval."
      attacker_model: "A lower-access requester whose call an admitted, higher-access responder approves."
      enforcement: "Requester-owned dispatch plus policy rechecks before approved workflow and agent calls."
      cost_to_operator: "Audit mismatched principals and replace workflows that relied on borrowed access."
      residual: "Confirmed range starts at 0.70.0; queued-reply timing remains unfixed in 0.79.0."
    receipts:
      - url: https://github.com/vercel/eve/commit/9559de83b65e89c24172c2b9c1a80382033556aa
        precision: commit_diff_reviewed
      - url: https://github.com/vercel/eve/releases/tag/eve%400.78.0
        precision: github_release
      - url: https://github.com/vercel/eve/releases/tag/eve%400.71.3
        precision: github_release
      - url: https://api.github.com/repos/vercel/eve/pulls/4604
        precision: github_api
      - url: https://github.com/vercel/eve/blob/eve%400.79.0/docs/tools/human-in-the-loop.md#L257
        precision: tagged_commit_file

  - id: 2026-10-13-eve-queued-consent-needs-a-newer-prompt
    status: accepted
    section: control-plane
    source: eve
    channel: main-unreleased
    title: "A queued reply can approve a later Eve prompt; the repair was on main at cutoff"
    finding_ids:
      - 2026-10-13-eve-queued-approval-text-can-settle-a-prompt-that-did-not-exist-when-it-was-sent-the-fix-is
    summary: >
      Stable 0.79.0 can consume approval-shaped requester text sent with
      turnPolicy queue before its later prompt existed. Commit 0dea0ded, merged
      2026-10-13 at 22:38:36Z, records the hold's admission sequence and excludes
      earlier queued messages. It is present at cutoff main 80f15de2 and absent
      from 0.79.0. The regression test was read, not executed.
    why_action_bearing:
      - >
        Chat-approval owners: keep consequential effects off this affected
        typed-reply path until a containing release passes the exact sequence.
        A held turn and requester-owned credentials do not establish that the
        person saw the request they appeared to approve.
      - >
        Watch for a tag containing 0dea0ded869be7db30ae90ed8072d29e6e57df61.
        Queue approve before the prompt, verify no settlement or tool execution,
        then send a new answer after the prompt and verify the intended effect.
        Record delivery, hold and settlement order; main alone is not delivery.
      - >
        Retaining an application gate costs review attention now. Remove it only
        after the installed release passes the timing test; the patch does not
        establish closure of every default-steer timing case.
    accessibility_consequence:
      what_got_easier: "The main-only repair distinguishes stale queued text from an answer to the current request."
      who_can_use_now: "Cutoff-main testers; no released fix through stable 0.79.0."
      authority_visibility: "Consent must name a request that existed when the answer was admitted."
    security_consequence:
      threat_blocked_or_opened: "Stable can execute a later tool using earlier text as consent."
      attacker_model: "A workflow producing a later approval hold after an admitted requester has queued approval-shaped text."
      enforcement: "Main adds a queue-admission cutoff; the stable queue lacks it."
      cost_to_operator: "Retain a deliberate gate and run an ordered-message regression before adoption."
      residual: "No live reproduction here; other steer timing cases need their own tests."
    receipts:
      - url: https://github.com/vercel/eve/commit/0dea0ded869be7db30ae90ed8072d29e6e57df61
        precision: commit_diff_reviewed
      - url: https://api.github.com/repos/vercel/eve/pulls/4749
        precision: github_api
      - url: https://github.com/vercel/eve/blob/eve%400.79.0/packages/eve/src/execution/session/input-queue.ts#L229-L244
        precision: tagged_commit_file

  - id: 2026-10-13-omp-extensions-can-resolve-plan-review
    status: accepted
    section: control-plane
    source: omp
    channel: tagged-release
    title: "OMP extensions can revise a plan and answer its review"
    finding_ids:
      - 2026-10-13-omp-18-10-4-lets-extensions-revise-and-execute-the-plan-review-while-tool-approvals-require
      - 2026-10-13-omp-project-inputs-still-load-without-trust-approval-and-18-7-0-documented-that-design
    summary: >
      18.10.4, released 2026-10-13 at 19:38:04Z, lets an extension revise a plan,
      answer execute while the terminal picker remains live, reopen an idle
      dismissed review and choose an available execution tier. First answer wins;
      downstream tool policy still applies. This is the shipping TypeScript line,
      not the untagged Rust successor.
    why_action_bearing:
      - >
        Teams forwarding plan decisions between panes: try a reviewed extension
        using resolvePlanReview and openPlanReview on 18.10.4. Remote or
        policy-based review can now reach the actual decision instead of asking
        a person to copy the answer into the terminal.
      - >
        When plan choice must remain human, use --no-extensions or an exact
        trusted-extension allowlist. Project configuration and extensions still
        load without a trust prompt; Pi API-name compatibility does not import
        Pi's trust gate. Restricting extensions gives up this review automation.
      - >
        Exercise simultaneous terminal/extension answers, plan revisions and
        downstream denied tool calls before adoption. Those recorded results,
        alongside accepted work and review time, would settle usefulness and
        enforcement for the installed extension; the source API proves neither
        better judgment nor a reduction in total review.
    accessibility_consequence:
      what_got_easier: "A reviewed extension can connect remote review to the plan's execution decision."
      who_can_use_now: "OMP extension authors and interactive users on stable 18.10.4."
      authority_visibility: "Extension admission can delegate plan choice; tool authorization is a later decision."
    security_consequence:
      threat_blocked_or_opened: "An admitted extension can execute its revised plan before a terminal user answers."
      attacker_model: "Project-local or user-installed extension code that the operator admits."
      enforcement: "First-answer-wins review API, followed by separate tool policy; no project trust gate."
      cost_to_operator: "Review extension authority once and verify competing-answer behavior and outcomes."
      residual: "Source-derived workflow, without measured review savings or a shipped Rust migration."
    receipts:
