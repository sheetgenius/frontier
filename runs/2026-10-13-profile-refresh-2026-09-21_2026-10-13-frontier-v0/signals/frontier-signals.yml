  - id: 2026-10-13-temporal-agent-harness-code-mode-moves-into-workflow
    status: accepted
    section: runtime
    source: temporal-agent-harness
    channel: preview-or-beta
    title: "Temporal Code Mode waits without storing interpreter snapshots in workflow history"
    finding_ids:
      - 2026-10-13-temporal-agent-harness-0-6-0-moves-code-mode-into-the-workflow-old-code-mode-histories-need-a-tested-cutover
    summary: >
      Preview 0.6.0 (2026-10-03) moves Monty script stepping from batch activities
      into workflow workers. Scripts use workflow time and durable timers;
      suspended tool or human waits hold no interpreter subprocess. Host tools
      retain their dispatch semantics. The code-mode extra pins Monty 1.0.0,
      and no compatibility path for relevant 0.5.0 histories was established.
    why_action_bearing:
      - >
        Temporal teams building multi-step scripts: trial
        temporal-agent-harness[ui,code-mode]==0.6.0 on every serving workflow worker
        with pydantic-monty 1.0.0. This can replace batch-snapshot transport and
        custom wait bookkeeping; inspect the workflow host's execution authority.
      - >
        Keep old Code Mode histories on compatible workers until a versioned
        cutover passes representative 0.5.0-history replay on 0.6.0. Record worker
        and interpreter versions and outcomes. Replay risk is inferred, not a
        demonstrated universal failure; blind reset is not an established remedy.
      - >
        Authenticate and restrict origins on the approval service, whose 0.6.0
        server still binds all interfaces without login and includes wildcard
        CORS. Make external effects idempotent. Test replay, denied routes and
        resumed effects before replacing application recovery code; fewer waits
        in process do not establish exactly-once effects or net attention savings.
    accessibility_consequence:
      what_got_easier: "Scripted workflows can use durable timers and human/tool waits without storing interpreter snapshots in workflow history."
      who_can_use_now: "Temporal experimenters installing prerelease 0.6.0 with code-mode on workflow workers."
      authority_visibility: "Worker/interpreter versions and retained history now form one upgrade decision."
    security_consequence:
      threat_blocked_or_opened: "Model-written scripts now execute on workflow hosts; the packaged approval API still needs access control."
      attacker_model: "Admitted scripts and any caller or browser that can reach the unauthenticated service under local network policy."
      enforcement: "Interpreter limits and workflow replay; application authentication/origin checks remain required."
      cost_to_operator: "Own the replay cutover, compatible workers, credential custody and side-effect idempotency."
      residual: "No replay failure or cross-origin exploit reproduced; durable history is not exactly-once execution."
    receipts:
