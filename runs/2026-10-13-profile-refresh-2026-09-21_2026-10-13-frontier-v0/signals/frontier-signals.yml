  - id: 2026-10-13-github-copilot-cli-local-sandbox-and-credential-proxy
    status: accepted
    section: runtime
    source: github-copilot-cli
    channel: tagged-release
    title: "Copilot CLI makes local sandboxing available to every user"
    finding_ids:
      - 2026-10-13-github-copilot-cli-1-0-93-opens-local-sandboxing-to-every-user-it-stays-off-by-default-and-a-server-managed
      - 2026-10-13-github-copilot-cli-sandboxed-commands-now-get-placeholder-credentials-github-token-withheld-1-0-92-and-a-loca
      - 2026-10-13-github-copilot-cli-1-0-93-ignores-user-settings-left-in-copilot-config-json-breaking-plus-retired-models-and
      - 2026-10-13-github-copilot-cli-ga-docs-rewrite-the-sandbox-network-rules-local-network-off-macos-and-linux-egress-forced
    summary: >
      1.0.93 (2026-10-07) makes local command sandboxing generally available;
      it remains default-off. Earlier 1.0.92 withholds ambient GITHUB_TOKEN
      unless configured and adds masked Git authentication. The documented
      proxy can inject selected credentials at permitted destinations. Stable
      at cutoff is 1.0.97. User settings left in config.json are ignored from
      1.0.93, so upgrading alone does not enable an existing policy.
    why_action_bearing:
      - >
        Individual and managed CLI users: install 1.0.97, move user settings to
        settings.json and try /sandbox enable or copilot --sandbox -p for a
        controlled job. Inspect /sandbox status and /sandbox policy, then perform
        one authenticated Git operation and one denied destination test.
      - >
        Fleets requiring containment must set sandbox.enabled and
        sandbox.failIfUnavailable true and sandbox.allowBypass false, verifying supported
        hosts and managed delivery. Server-managed enabled alone can be declined
        on unsupported hosts; built-in file tools use best-effort software checks.
      - >
        Scope each masked secret's injectHosts and inspect credential files
        separately. Test localhost workloads on macOS; Windows host rules rely
        on programs honoring the proxy. Full bypass restores ordinary credentials.
        Recorded platform-specific denial and credential-use results would settle
        the deployed boundary. This replaces some repeated credential inspection
        with maintained host lists and deliberate exceptions, without measured savings.
    accessibility_consequence:
      what_got_easier: "All CLI users can try local containment and authenticated Git through credential brokerage."
      who_can_use_now: "Supported hosts on 1.0.93+ with explicit enablement; use stable 1.0.97."
      authority_visibility: "GA availability, effective settings and host support are separate checks."
    security_consequence:
      threat_blocked_or_opened: "Configured credential masking narrows ambient exposure; stale settings or unsupported hosts can leave commands uncontained."
      attacker_model: "Injected agent instructions reaching shell credentials or destinations; exfiltration resistance was not tested."
      enforcement: "OS command sandbox plus proxy on supported hosts; Windows egress is cooperative and file tools are best-effort."
      cost_to_operator: "Migrate settings, maintain injection hosts and qualify localhost/bypass behavior per OS."
      residual: "Masking excludes credential files, unmasked variables and remote MCP authentication; no runtime probe here."
    receipts:
      - url: https://github.com/github/copilot-cli/blob/v1.0.97/changelog.md
        precision: tagged_commit_file
      - url: https://github.com/github/docs/blob/602021b0ba16b4a90e9c0a962a67ca9744eac82e/content/copilot/concepts/security-governance-and-network-settings/about-cloud-and-local-sandboxes.md#L42-L118
        precision: commit_line_range
