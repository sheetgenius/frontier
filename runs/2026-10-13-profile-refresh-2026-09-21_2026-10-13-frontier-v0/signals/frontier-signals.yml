schema_version: bitter.frontier_signals.v0
run_id: 2026-10-13-profile-refresh-2026-09-21_2026-10-13-frontier-v0
window:
  start: 2026-09-21
  end: 2026-10-13
note: >
  A 23-day catch-up window, inclusive, UTC. All current, stable, latest and main
  labels describe the 2026-10-13T23:59:59Z cutoff, not the retrieval date.
  Pi's native tool composition, OMP's programmable plan review and OpenHands'
  testable automation drafts put more of
  the work around a coding task within an agent's reach. Temporal moves script
  continuation into workflow workers, while Copilot makes local sandboxing
  generally available. These gains can replace specific adapters and handoffs;
  no supplied measurement establishes fewer human hours across the workflow.
  Codex's independently moving server and the distinct Eve/OpenClaw consent
  repairs show where attention moves next: qualify the running service, admit
  the code that can decide, and bind consent to an exact action, requester and
  moment. Use native primitives where they cover the job, and spend retained
  review on authority, exceptions and completed outcomes.

signals:

  - id: 2026-10-13-codex-interactive-server-has-its-own-version
    status: accepted
    section: runtime
    source: codex
    channel: tagged-release
    title: "Interactive Codex shares a server that can move beyond its CLI pin"
    finding_ids:
      - 2026-10-13-codex-interactive-codex-now-attaches-to-a-shared-background-app-server-by-default-from-0-157
      - 2026-10-13-codex-the-auto-started-background-server-can-update-itself-past-a-pinned-npm-or-homebrew-cli
    summary: >
      From 0.157.0 (2026-09-25), eligible interactive launches use a shared
      background app server. At stable 0.162.1, a newly seeded eligible npm or
      Homebrew server package can follow latest independently of the CLI,
      retaining the environment from server startup. Explicit standalone-release
      pins behave differently; codex exec does not use this daemon path. The
      stable CLI uses a service whose lifecycle contract remains experimental.
    why_action_bearing:
      - >
        Interactive fleets and evaluation owners: run 0.162.1 and record both
        codex --version and codex app-server daemon version. Use --no-daemon for
        a fixed per-launch baseline, or set {"updater":{"autoUpdateEnabled":false}}
        in CODEX_HOME/app-server-daemon/settings.json and restart the daemon.
      - >
        Restart after changing inherited credentials or PATH. Restart keeps the
        selected server package; it does not undo an earlier update. Shared
        service operation replaces repeated startup with environment and update
        administration. Disabling updates returns patch scheduling to the owner.
      - >
        Keep the updater off where managed network policy must hold on 0.162.1.
        A stable containing d570b3632b100e36f931797cdbdb8906d0fcafa8, now preview-only,
        plus blocked-network and failed-config probes would settle enforcement;
        a recorded pinned-install update trace would settle actual update behavior.
    accessibility_consequence:
      what_got_easier: "Interactive terminals can reuse a persistent local agent service."
      who_can_use_now: "Eligible interactive CLI users from 0.157.0, including stable 0.162.1."
      authority_visibility: "Record the serving package and startup environment alongside the client pin."
    security_consequence:
      threat_blocked_or_opened: "An unchanged CLI can use newer service code and credentials retained from an earlier shell."
      attacker_model: "Untrusted tasks within an already admitted session; no remote updater compromise is established."
      enforcement: "Service/package selection and updater configuration; per-client environment isolation is absent."
      cost_to_operator: "Inventory two versions, restart after environment changes and schedule held updates."
      residual: "Source-derived behavior, without an observed auto-update or interruption measurement."
    receipts:
