  - id: claudedevs-study-numbers
    title: "The study, in the vendor's words"
    kind: claim
    date: 2026-08-07
    date_precision: day
    captured_on: 2026-09-23
    source_ids: [claude-code]
    authors: ["ClaudeDevs"]
    display_name: "ClaudeDevs"
    source_urls:
      - https://x.com/ClaudeDevs/status/2085794865330393117
    verbatim: |
      One reason we trust it more than manual approval: in a study with 1,053 paid testers, we swapped a permission prompt for a clearly dangerous command (text only, nothing actually ran). 

      Testers caught it 13.6% of the time, and closer to 5% after 50 prompts. Auto mode blocked the same commands 89% of the time, flat across session length.
    inline: "Testers caught it 13.6% of the time, and closer to 5% after 50 prompts. Auto mode blocked the same commands 89% of the time, flat across session length."
    summary: >
      Anthropic's developer account describing the study behind the auto-mode default: a planted
      dangerous command in a permission prompt, 1,053 paid testers, text only.
    verdict: >
      A claim post and a vendor metric: the figures match Anthropic's own auto-mode blog post,
      which describes the method, and nobody outside Anthropic has repeated the study. We carry
      the numbers as the vendor's measurement, in its own words, not as an established rate.

