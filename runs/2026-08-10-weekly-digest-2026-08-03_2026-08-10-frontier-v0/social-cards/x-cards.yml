      - https://x.com/lydiahallie/status/2085799128857272783
    verbatim: |
      👀 auto mode is safer than --dangerously-skip-permissions *and* manually approving everything
    inline: "auto mode is safer than --dangerously-skip-permissions *and* manually approving everything"
    summary: >
      A Claude Code maintainer arguing that auto mode is safer than both the bypass flag and approving by hand.
    verdict: >
      A claim post, and the one the window turns on. It is the parent of the thread the rest of this section quotes, and it is here at full strength rather than trimmed, because an issue that reports the receipts without the argument they answer is prosecuting rather than reporting. The comparison it makes is adjudicated against the changelog below, not against our opinion of it.
  - id: lydia-dsp-doesnt-check
    title: "What auto mode does that the bypass flag does not"
    kind: claim
    date: 2026-08-08
    date_precision: day
    captured_on: 2026-08-18
    source_ids: [claude-code]
    authors: ["lydiahallie"]
    display_name: "Lydia Hallie ✨"
    source_urls:
      - https://x.com/lydiahallie/status/2086117097923625332
    verbatim: |
      dsp just doesn't check at all. auto mode blocks destructive actions you didn't ask Claude to take (eg rm -rf can be fine but depends on your task) and screens tool results for prompt injection. but for most tasks you still won't see permission prompts, same as dsp!
    inline: "dsp just doesn't check at all."
    summary: >
      The same maintainer answering a user who asked how auto mode is safer than the bypass flag.
    verdict: >
      A claim post. The mechanism it describes -- blocking destructive work the operator did not ask for, screening tool results for injection -- is checkable and we checked it. The last clause is the one an operator should sit with: for most tasks you still will not see prompts.
  - id: elia-boundaries-not-stored
    title: "The layer you are being asked to trust"
    kind: voice
    date: 2026-08-08
    date_precision: day
    captured_on: 2026-08-18
    source_ids: [claude-code]
    authors: ["EliaAlberti"]
    display_name: "EliaAlberti"
    source_urls:
      - https://x.com/EliaAlberti/status/2086128186929066255
    verbatim: |
      what that leaves out though is that the boundaries you state in chat aren’t stored as rules. the classifier re-reads them from the transcript on every check, so if compaction drops the message where you said “don’t push”, the boundary goes with it. silently.
    inline: "the boundaries you state in chat aren’t stored as rules. the classifier re-reads them from the transcript on every check"
    summary: >
      An engineer replying in the same thread, on where a spoken boundary actually lives.
    verdict: >
      A voice post: we assert only that he made this argument. It is not the same defect as anything in the changelog, and we are not claiming he scooped it. He is describing a memory property of the classifier; the release notes describe a display property of the dialog. They rhyme, which is why the section carries both.
