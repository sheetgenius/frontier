  - id: claude-code-auto-mode-psa
    title: "A claim a changelog entry settles"
    kind: community_discussion
    date: 2026-07-20
    date_precision: day
    captured_on: 2026-07-27
    source_ids: [claude-code]
    authors: ["lkr"]
    source_note: 3
    handling_note: c
    source_urls:
      - https://code.claude.com/docs/en/changelog#2-1-211
    paraphrase: >
      A post recommending auto mode, describing it as roughly bypass permissions
      with less risk.
    summary: >
      A characterization of how automatic approval compares to the explicit
      bypass flag.
    verdict: >
      Backwards on the point that matters. Under the bypass flag a PreToolUse
      hook is not consulted and the operator knows it; under auto mode the hook
      was consulted and overruled, which v2.1.211 had just fixed. We hold the
      wording only as a harvested paraphrase, so the receipt below is the
      changelog rather than the post.
    tags: [auto-mode, hooks, misreading]

