run_id: 2026-07-27-weekly-digest-2026-07-02_2026-07-27-frontier-v0
note: >
  Field discipline. `paraphrase` and `summary` are OUR words about a post. Only a
  `verbatim` field holds the poster's own text, and only `verbatim` may ever be
  rendered as a quotation. `display_name` is used only when a real name has been
  verified; it is never derived from a handle.

  `verdict` is a sentence written for this specific post. It is deliberately not
  a value from a fixed list: a token like "refuted" could have been chosen before
  the reporting, which is exactly what makes a status line read like a database
  row rather than a judgment. If a verdict here could be reused verbatim on
  another post, it is not specific enough.

  `source_note` and `handling_note` place the reference at the foot of the piece.
  A numeral points at a receipt; a letter points at something we have to say.
cards:
  - id: antigravity-1-1-3-headless-announcement
    title: "The announcement that sat on top of no enforcement"
    kind: capability_announcement
    date: 2026-07-16
    date_precision: day
    captured_on: 2026-07-27
    source_ids: [antigravity]
    authors: ["shengzheyao"]
    display_name: Shengzhe
    source_note: 1
    handling_note: a
    source_urls:
      - https://x.com/shengzheyao/status/2077576699571741008
    verbatim: |
      Antigravity CLI 1.1.3 is out!

      1. No flickering mode got a real upgrade: drag to select and the text lands in your clipboard (ANSI stripped), and the virtual scrollbar stays out of the way
      2. Make it your default rendering mode, especially on large conversations. No more runaway CPU and render cost
      3. Headless (-p) no longer hangs or silently auto-approves tools that need permission. It soft-denies and tells you exactly which allow-rule to add.
      4. Faster startup: skills load async now, and skills/rules/agents/hooks discovery does far less redundant I/O
      5. New builtin /codesearch

      agy update to grab it or install it today: https://t.co/RVZY2YsSIN

      Thanks everyone for the reports and feedback!
    quoted: >-
      Headless (-p) no longer hangs or silently auto-approves tools that need
      permission. It soft-denies and tells you exactly which allow-rule to add.
    inline: >-
      no longer hangs or silently auto-approves tools that need permission
    paraphrase: >
      Antigravity CLI 1.1.3 changes headless mode so it no longer hangs or
      silently auto-approves permissioned tools, with soft-deny and exact
      allow-rule guidance.
    summary: >
      A maintainer announcing a narrow headless fix.
    verdict: >
      Two days later the vendor's own changelog recorded that headless runs had
      only then begun honoring settings.json at all, so this announcement sat on
      top of a mode that enforced nothing. Version 1.1.4 got no post.
    tags: [headless, permissions, announcement-asymmetry]

