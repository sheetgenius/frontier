  - id: delba-auto-mode-classifier
    title: "What auto mode actually is"
    kind: maintainer_intent
    date: 2026-06-11
    date_precision: day
    captured_on: 2026-07-28
    source_ids: [claude-code]
    authors: ["delba_oliveira"]
    source_note: 9
    handling_note: i
    source_urls:
      - https://x.com/delba_oliveira/status/2065106020347613598
    verbatim: |
      Claude Code: Auto mode

      Auto mode lets Claude safely complete long-running tasks without asking permission for every action. But how does it work?

      4 key terms:

      • Classifier: a separate model that approves or denies each action based on your intent and scope
      • Filtering: the classifier only sees your messages and Claude's tool calls, not Claude’s reasoning or tool outputs, so it isn't influenced when making decisions
      • Tier check: read-only and easily-undone actions (like edits inside your repo) skip the classifier; everything else goes through it
      • Probe: a server-side check that scans incoming content, like web pages, for prompt injection and flags it to Claude

      I'm working on a longer video that explains how auto mode works and how to configure it.

      What questions do you have about it?
    inline: >-
      a separate model that approves or denies each action based on your intent and scope
    summary: >
      A vendor explainer describing the classifier that decides in auto mode.
    verdict: >
      The clearest public description of the mechanism we found, and useful
      precisely because it is the vendor's own. A classifier deciding on intent
      and scope is a different kind of object from a rule an operator wrote, and
      the difference is what v2.1.211 turned out to be about.
    tags: [auto-mode, classifier]

