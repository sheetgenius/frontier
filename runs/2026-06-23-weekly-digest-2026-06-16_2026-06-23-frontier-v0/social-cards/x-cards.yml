    date: 2026-06-23
    date_precision: day
    captured_on: 2026-07-29
    source_ids: [heypi]
    authors: ["hunvreus"]
    display_name: Ronan Berder
    source_note: 7
    handling_note: g
    source_urls:
      - https://x.com/hunvreus/status/2069420983715541115
    verbatim: |
      Getting close to burnout with my open source projects.

      I got Pages CMS 2.0.0 out a few weeks ago, and I'm about to release Basecoat 1.0.0. Oh, and also got heypi 0.2.0 beta released tonight, and I have the new  ReallySimpleDocs on its way (moved to @astrodotbuild).

      I think I'll be taking a sabatical from most of this over the summer (except heypi).

      If you want to see what Basecoat 1.0.0 looks like: https://basecoat.hunvreus.workers.dev/
    inline: >-
      Getting close to burnout with my open source projects
    summary: >
      The heypi maintainer on his open-source workload, the night 0.2.0 beta shipped.
    verdict: >
      A voice post, quoted as something he said publicly and for one operator-facing reason: heypi is on this watchlist and its bus factor is one. Nothing here is an inference about him. If he would rather it were not reproduced, the correction path in CONTRIBUTING.md applies and we will remove it.
    tags: [sustainability, bus-factor, maintainer-voice]
