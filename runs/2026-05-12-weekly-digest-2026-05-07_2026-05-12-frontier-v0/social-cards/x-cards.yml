  - id: badlogic-tests-would-pass
    title: "Tests would pass, the life-cycle would not"
    kind: voice
    date: 2026-05-09
    date_precision: day
    captured_on: 2026-09-23
    source_ids: [pi-coding-agent]
    authors: ["badlogicgames"]
    display_name: "Mario Zechner"
    source_urls:
      - https://x.com/badlogicgames/status/2053225953090744447
    verbatim: |
      i'm using pi-diff-review to go into modified/new files the agent spit out, and give line-based reviews.

      it did not address all of them. without double checking, tests would pass, but the life-cycle would be busted, because it also did not adapt the tests accordingly.

      it's great. at this point, writing things by hand is faster.
    inline: "without double checking, tests would pass, but the life-cycle would be busted, because it also did not adapt the tests accordingly."
    summary: >
      Pi's author, reviewing an agent's changes line by line with pi-diff-review, reporting that
      it left some of his review comments unaddressed and did not update the tests, and that
      writing the change by hand had become faster.
    verdict: >
      A voice post about one change on his own machine; we assert only that he reported it. It
      is here because it is the week's plainest case of the gap this issue is about: the suite
      would have gone green on a broken change, so the only check that caught it was a person
      reading the diff.

