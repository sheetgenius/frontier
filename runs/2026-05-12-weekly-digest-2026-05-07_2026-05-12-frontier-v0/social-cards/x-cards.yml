  - id: lyq-sandbox-bypasses
    title: "Bypassed the sandbox, three to five ways"
    kind: advisory_discussion
    date: 2026-05-12
    date_precision: day
    captured_on: 2026-07-29
    source_ids: [claude-code]
    authors: ["lyq_sqsp"]
    display_name: itewqq
    source_note: 3
    handling_note: c
    source_urls:
      - https://x.com/lyq_sqsp/status/2054342737902948692
    verbatim: |
      Fun fact: we were also able to bypass the sandbox of Claude Code (it is not enabled by default settings though), like 3-5 different ways? But all of them are patched while we were making the videos within only several days lol.@AnthropicAI sometimes releases like five updates a single day.😅
      Good luck to all the Pwn2Own contestants 🙏🙏🙏 would be very interesting this year.
    inline: >-
      we were also able to bypass the sandbox of Claude Code (it is not enabled by default settings though), like 3-5 different ways?
    summary: >
      A researcher describing sandbox bypasses found during video production.
    verdict: >
      NOT ESTABLISHED as a finding: an unverified researcher claim, no writeup we can read, and we did not reproduce anything. Two details in his own words matter and are why it is carried: the sandbox is not enabled by default, so most operators were never behind it, and he says every bypass was patched while the videos were being made. That last part is a data point about response time, not about the bypasses.
    tags: [sandbox, unverified-claim, response-time]

