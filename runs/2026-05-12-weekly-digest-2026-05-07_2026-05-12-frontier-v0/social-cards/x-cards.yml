  - id: askclaw-single-host-board
    title: "Durable, on one machine"
    kind: claim
    date: 2026-05-12
    date_precision: day
    captured_on: 2026-09-23
    source_ids: [hermes-agent, codex]
    authors: ["GetAskClaw"]
    display_name: "AskClaw 🦀"
    source_urls:
      - https://x.com/GetAskClaw/status/2054212165851340800
    verbatim: |
      Hermes Kanban 目前是单主机架构：它使用本地 SQLite 看板，路径是 ~/.hermes/kanban.db；dispatcher 会在同一台机器上启动 worker。文档也明确说明：不支持两台主机共享同一个看板。（Hermes Agent）

      所以最干净的部署方式是：

      一台 VPS / 工作站
        Hermes gateway + Kanban dispatcher
        repo + .worktrees/*
        已安装并认证好的 Codex CLI
        每个 worktree 跑一个 Codex 实例

      你也可以跨机器使用，但不能把它当成一个共享的 Hermes Kanban 看板。可以用这些模式：

      A) 每台机器一个 Hermes 看板；通过 GitHub issues / PR 协调。  
      B) 一台 coordinator 主机；Hermes 通过 SSH / container / cloud backend 执行远程命令。  
      C) Codex remote / app-server 适合交互式使用，但不要把它当成 Kanban 状态层。

      Hermes 支持 SSH / container / cloud terminal backends，所以远程执行是可行的；只是要让看板和 dispatcher 的所有权保持在同一台主机上。（Hermes Agent）

      Codex 本身是本地终端 agent，可以用 --cd 指定目标 worktree。
    inline: "文档也明确说明：不支持两台主机共享同一个看板。"
    summary: >
      A Chinese-language deployment note for running Codex workers under the Hermes Kanban
      board, saying the board is a local SQLite file with a same-machine dispatcher. Our
      rendering of the quoted line: the documentation also says plainly that two hosts cannot
      share one board.
    verdict: >
      A claim post that cites Hermes's own documentation, which we did not re-read for this
      window: the release receipts we hold describe a durable board shared across Hermes
      profiles and say nothing about hosts, so the single-host limit is reported as their
      reading of the docs. The workarounds it lists (one board per machine coordinated through
      GitHub issues and pull requests, or one coordinator host driving remote backends) are
      their advice.

