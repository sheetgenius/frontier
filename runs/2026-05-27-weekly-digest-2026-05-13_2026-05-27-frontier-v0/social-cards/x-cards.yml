  - id: pvncher-not-opensource
    title: "agy is not opensource"
    kind: criticism
    date: 2026-05-19
    date_precision: day
    captured_on: 2026-07-29
    source_ids: [gemini-cli, antigravity]
    authors: ["pvncher"]
    display_name: eric provencher
    source_note: 3
    handling_note: c
    source_urls:
      - https://x.com/pvncher/status/2056802695382515739
    verbatim: |
      So google is replacing gemini-cli with agy (antigravity cli), but:
      1. agy is not opensource
      2. It no longer supports ACP

      Really unfortunate development
    inline: >-
      agy is not opensource
    summary: >
      The same-day objection to the announcement.
    verdict: >
      A voice post. Both of his points are checkable and correct: the replacement is closed-source and dropped Agent Client Protocol support. Quoted because the specific loss was named on day one, not discovered later.
    tags: [succession, open-source, acp]

  - id: robdubparker-skills-bloat
    title: "90+ skills enabled by default"
    kind: criticism
    date: 2026-05-26
    date_precision: day
    captured_on: 2026-07-29
    source_ids: [hermes-agent]
    authors: ["robdubparker"]
    display_name: Rob Parker
    source_note: 4
    handling_note: d
    source_urls:
      - https://x.com/robdubparker/status/2059304782561436031
    verbatim: |
      @NousResearch @Teknium Hermes Agent has a bloat/noise issue.  90+ skills enabled by default.  Agents still load all of them even if they are disabled.  There is no "enabled" option in config, so even if "disabled" option worked correctly, you'd need to keep updating/maintaining the list as more skills are added to Hermes core.  Anything that is added to context that is not needed by an agent is noise.  bloat is the ever-increasing skill list and features additions to core.  This is important for builders that understand nuance.  Any efforts at addressing these?
    inline: >-
      90+ skills enabled by default.  Agents still load all of them even if they are disabled
    summary: >
      A user reporting that Hermes loads its full skill set regardless of config.
    verdict: >
      A voice post and a user report we did not reproduce. Its value is what happened next: the maintainer answered in public with a number.
    tags: [skills, configuration, context-cost]

  - id: teknium-skills-token-cost
    title: "About 1.5-2k tokens"
    kind: maintainer_intent
    date: 2026-05-26
    date_precision: day
    captured_on: 2026-07-29
    source_ids: [hermes-agent]
    authors: ["Teknium"]
    display_name: Teknium 🪽
    source_note: 5
    handling_note: e
    source_urls:
      - https://x.com/Teknium/status/2059314725725647216
    verbatim: |
      @robdubparker @NousResearch Yes there is. Use ‘hermes skills config’ and disable whatever you want.

      This is not bloat though. All 90 skills use about 1.5-2k tokens. Thats less tokens for all skills then just the browser use toolset
    inline: >-
      All 90 skills use about 1.5-2k tokens
    summary: >
      The Hermes maintainer answering the bloat complaint with a cost figure.
    verdict: >
      A maintainer's own measurement, published in reply, not independently checked by us. Carried because answering a context-cost complaint with a token count is the correct shape of argument, whatever the number turns out to be.
    tags: [skills, token-cost, maintainer-response]

  - id: ofirpress-150-lines
    title: "As well as Claude Code, Codex and Gemini CLI"
    kind: community_discussion
    date: 2026-05-27
    date_precision: day
    captured_on: 2026-07-29
    source_ids: [claude-code, codex, gemini-cli]
    authors: ["OfirPress"]
    display_name: Ofir Press
    source_note: 6
    handling_note: f
    source_urls:
      - https://x.com/OfirPress/status/2059655908406210978
    verbatim: |
      mini-swe-agent is our ~150 line of code agent, and it performs as well as Claude Code, Codex and Gemini CLI on this new coding benchmark.
    inline: >-
      it performs as well as Claude Code, Codex and Gemini CLI on this new coding benchmark
    summary: >
      A researcher reporting a roughly 150-line agent matching the major harnesses on a benchmark.
    verdict: >
      His claim about his own benchmark; we did not run it and one benchmark is one instrument. Carried because it is the sharpest available counter to this publication's harness-as-variable argument, and a thesis that only meets agreeable evidence is not being tested.
    tags: [benchmarks, harness, counter-argument]

