  - id: bengold-computer-use-not-chronicle
    title: "He granted one thing and got another"
    kind: claim
    date: 2026-05-27
    date_precision: day
    captured_on: 2026-09-23
    source_ids: [codex]
    authors: ["bengold"]
    display_name: "Ben Gold"
    source_urls:
      - https://x.com/bengold/status/2059773234698936713
    verbatim: |
      Yes, I gave it access for Computer Use, not Chronicle, the feature that caused it to record my screen on a regular basis and generate markdown files for additional connect even when I wasn’t using codex
    inline: "I gave it access for Computer Use, not Chronicle, the feature that caused it to record my screen on a regular basis"
    summary: >
      A Codex user saying he granted access for Computer Use, not for Chronicle, and that
      Chronicle recorded his screen on a regular basis and wrote markdown files even when he was
      not using Codex.
    verdict: >
      A claim about Codex behaviour, reported as his statement only: this issue's receipts cover
      the 26.519 remote computer use surface and say nothing about Chronicle, so we have not
      verified what it records or when. It is here because it is the consent question of this
      issue in one user's words: a permission granted for one feature, read as covering another.

  - id: owenology-course-staff-hooks
    title: "The repo's hooks, not the operator's"
    kind: voice
    date: 2026-05-21
    date_precision: day
    captured_on: 2026-09-23
    source_ids: [claude-code, cursor]
    authors: ["owenology"]
    display_name: "Owen"
    source_urls:
      - https://x.com/owenology/status/2057603396723781791
    verbatim: |
      Just found out that Berkeley course staff are writing hooks inside course repos so if a student opens an assignment in Claude Code or Cursor the agent will automatically ping the staff 😵‍💫 well played
    inline: "if a student opens an assignment in Claude Code or Cursor the agent will automatically ping the staff"
    summary: >
      A post relaying that Berkeley course staff put hooks in course repositories so an agent
      opening an assignment in Claude Code or Cursor pings the staff.
    verdict: >
      A voice post and second-hand by its own framing ('Just found out'): we have not seen the
      repositories and assert only that he reported it. It is here because it shows a checked-in
      file governing an agent on behalf of someone other than the person running it.
