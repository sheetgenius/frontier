run_id: 2026-05-27-weekly-digest-2026-05-13_2026-05-27-frontier-v0
note: >
  Backfilled 2026-07-29 from a dated archive search; every post independently
  re-fetched by URL before quoting, 32 of 32 found. Fragments sliced from
  verified text, single-line only -- pvncher's two numbered objections sit on
  separate lines, so only the first is inlined and the full text is in the card.
cards:
  - id: geminicli-unify-announcement
    title: "Unifying our efforts"
    kind: maintainer_intent
    date: 2026-05-19
    date_precision: day
    captured_on: 2026-07-29
    source_ids: [gemini-cli, antigravity]
    authors: ["geminicli"]
    display_name: Gemini CLI
    source_note: 1
    handling_note: a
    source_urls:
      - https://x.com/geminicli/status/2056796084790304833
    verbatim: |
      Transitioning Gemini CLI users to Antigravity CLI

      We are unifying our efforts around a single harness and platform, Google Antigravity with four distinct surfaces:

      • Antigravity 2.0
      • Antigravity CLI
      • Antigravity SDK
      • Antigravity IDE

      This will allow us to move faster and give you a streamlined experience wherever you do your best work.

      Rebuilt in Go for speed, Antigravity CLI is available today and brings robust multi-agent orchestration and asynchronous workflows to your terminal.

      Important things to know:
      1. If you are using Gemini CLI through your Google one account (Google AI Pro or AI Ultra) or through Gemini Code Assist for individuals (free offering) we will be helping you migrate your workflows over the next 30 days.

      2. No action required for Enterprise users. Enterprise plans and API keys will continue to be supported in Gemini CLI.

      Read the full details in our blog post → https://goo.gle/4eWkUgK
    inline: >-
      We are unifying our efforts around a single harness and platform
    summary: >
      The Gemini CLI account announcing the move to Antigravity.
    verdict: >
      The vendor's own words and the receipt for the date this began. The consumer shutdown it set up executed on 2026-06-18, a month later.
    tags: [succession, announcement]

  - id: logank-unify-clarity
    title: "Adds more clarity"
    kind: maintainer_intent
    date: 2026-05-19
    date_precision: day
    captured_on: 2026-07-29
    source_ids: [gemini-cli, antigravity]
    authors: ["OfficialLoganK"]
    display_name: Logan Kilpatrick
    source_note: 2
    handling_note: b
    source_urls:
      - https://x.com/OfficialLoganK/status/2056803907154924031
    verbatim: |
      @geminicli Very excited to unify the experience for developers building with Gemini under Antigravity! Hoping this adds more clarity for those asking what product is right for them.
    inline: >-
      Very excited to unify the experience for developers building with Gemini under Antigravity
    summary: >
