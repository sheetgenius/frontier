  - id: robdubparker-skills-bloat
    title: "90+ skills enabled by default"
    kind: criticism
    date: 2026-05-26
    date_precision: day
    captured_on: 2026-07-29
    source_ids: [hermes-agent]
    authors: ["robdubparker"]
    display_name: Rob Parker
    source_note: 4
    handling_note: d
    source_urls:
      - https://x.com/robdubparker/status/2059304782561436031
    verbatim: |
      @NousResearch @Teknium Hermes Agent has a bloat/noise issue.  90+ skills enabled by default.  Agents still load all of them even if they are disabled.  There is no "enabled" option in config, so even if "disabled" option worked correctly, you'd need to keep updating/maintaining the list as more skills are added to Hermes core.  Anything that is added to context that is not needed by an agent is noise.  bloat is the ever-increasing skill list and features additions to core.  This is important for builders that understand nuance.  Any efforts at addressing these?
    inline: >-
      90+ skills enabled by default.  Agents still load all of them even if they are disabled
    summary: >
      A user reporting that Hermes loads its full skill set regardless of config.
    verdict: >
      A voice post and a user report we did not reproduce. Its value is what happened next: the maintainer answered in public with a number.
    tags: [skills, configuration, context-cost]

  - id: teknium-skills-token-cost
    title: "About 1.5-2k tokens"
    kind: maintainer_intent
    date: 2026-05-26
    date_precision: day
    captured_on: 2026-07-29
    source_ids: [hermes-agent]
    authors: ["Teknium"]
    display_name: Teknium 🪽
    source_note: 5
    handling_note: e
    source_urls:
      - https://x.com/Teknium/status/2059314725725647216
    verbatim: |
      @robdubparker @NousResearch Yes there is. Use ‘hermes skills config’ and disable whatever you want.

      This is not bloat though. All 90 skills use about 1.5-2k tokens. Thats less tokens for all skills then just the browser use toolset
    inline: >-
      All 90 skills use about 1.5-2k tokens
    summary: >
      The Hermes maintainer answering the bloat complaint with a cost figure.
    verdict: >
      A maintainer's own measurement, published in reply, not independently checked by us. Carried because answering a context-cost complaint with a token count is the correct shape of argument, whatever the number turns out to be.
    tags: [skills, token-cost, maintainer-response]

  - id: ofirpress-150-lines
    title: "As well as Claude Code, Codex and Gemini CLI"
    kind: community_discussion
    date: 2026-05-27
    date_precision: day
    captured_on: 2026-07-29
    source_ids: [claude-code, codex, gemini-cli]
    authors: ["OfirPress"]
    display_name: Ofir Press
    source_note: 6
    handling_note: f
    source_urls:
      - https://x.com/OfirPress/status/2059655908406210978
    verbatim: |
      mini-swe-agent is our ~150 line of code agent, and it performs as well as Claude Code, Codex and Gemini CLI on this new coding benchmark.
    inline: >-
      it performs as well as Claude Code, Codex and Gemini CLI on this new coding benchmark
    summary: >
      A researcher reporting a roughly 150-line agent matching the major harnesses on a benchmark.
    verdict: >
      His claim about his own benchmark; we did not run it and one benchmark is one instrument. Carried because it is the sharpest available counter to this publication's harness-as-variable argument, and a thesis that only meets agreeable evidence is not being tested.
    tags: [benchmarks, harness, counter-argument]

  - id: cherny-written-by-itself
    title: "100% written by Claude Code"
    kind: adoption_signal
    date: 2026-05-25
    date_precision: day
    captured_on: 2026-07-29
    source_ids: [claude-code]
    authors: ["AnatoliKopadze"]
    display_name: Anatoli Kopadze
    source_note: 7
    handling_note: g
    source_urls:
      - https://x.com/AnatoliKopadze/status/2058917854062195072
    verbatim: |
      Boris Cherny: "Claude Code is 100% written by Claude Code, Cowork is 100% written by Claude Code"

      across all of Anthropic, 90% of code is written by Claude

      lawyers, designers, finance people are building real things with Claude Code right now

      with no CS degree, no background, nothing

      the people who built the tool use the tool to build the tool

      think about what that means for everyone else

      the guide on everything Claude can actually do is in the article below
    summary: >
      A relayed quotation of Boris Cherny on how much Anthropic code is agent-written.
    verdict: >
      Second-hand: we hold no primary source and attribute nothing to a named person on this basis. The figures are not findings. Quoted as a claim that circulated widely during the window Auto mode became the default.
    tags: [adoption, unverified-claim]

  - id: bcherny-containers-punch-holes
    title: "Containers, with the holes punched"
    kind: claim
    date: 2026-05-25
    date_precision: day
    captured_on: 2026-09-23
    source_ids: [claude-code]
    authors: ["bcherny"]
    display_name: "Boris Cherny"
    source_urls:
      - https://x.com/bcherny/status/2058893312128323816
    verbatim: |
      We use both together. In practice, for containers to be useful, you often have to punch some holes: GitHub, Anthropic API, kube, other MCPs.

      Auto mode makes interacting with these safer. It significantly reduces the risks of accidental data deletion, exfiltration, and prompt injection.
    inline: "for containers to be useful, you often have to punch some holes: GitHub, Anthropic API, kube, other MCPs."
    summary: >
      Boris Cherny, in his own words and in the window, saying his team runs Auto mode and
      containers together because a useful container needs openings to GitHub, the Anthropic
      API, kube and other MCPs, and that Auto mode makes using those openings safer.
    verdict: >
      A claim post, reported as his statement: the 2.1.152 changelog says Auto mode no longer
      asks for consent and publishes no list of what it treats as safe, so his claim that it
      'significantly reduces the risks' of deletion, exfiltration and prompt injection is not
      something this issue's receipts can check. The container half is his account of how his
      own team works, and it is the sentence this issue quotes.

  - id: takara-switched-back-from-auto
    title: "Back to bypassPermissions"
    kind: voice
    date: 2026-05-15
    date_precision: day
    captured_on: 2026-09-23
    source_ids: [claude-code]
    authors: ["takara_infra"]
    display_name: "たから@インフラエンジニア×ClaudeCode"
    source_urls:
      - https://x.com/takara_infra/status/2055161569592647865
    verbatim: |
      Claude Codeの/configからdefault permissionでauto modeが実装されてめっちゃ便利！
      みたいなポスト流れてくるから試しました。
      元々、bypassPermissionsでしたがそれよりも確認や判断、決断や操作がめちゃくちゃ増えたので戻しました。
    inline: "元々、bypassPermissionsでしたがそれよりも確認や判断、決断や操作がめちゃくちゃ増えたので戻しました。"
    summary: >
      A Japanese-language post from an infrastructure engineer who tried Auto mode as the
      default permission after seeing it praised, and went back. Our rendering: I had been on
      bypassPermissions, but Auto added far more confirmations, judgment calls, decisions and
      operations, so I switched back.
    verdict: >
      A voice post about one operator's own setup; we assert only that the author reported switching
      back. It cuts against the fortnight's default-autonomy story from the side nobody expects:
      for someone already on bypassPermissions, Auto mode was the more cautious setting, not the
      less.

  - id: klieret-simpler-generalizes
    title: "The same result, with a reason attached"
    kind: voice
    date: 2026-05-27
    date_precision: day
    captured_on: 2026-09-23
    source_ids: [claude-code, codex]
    authors: ["KLieret"]
    display_name: "Kilian Lieret"
    source_urls:
      - https://x.com/KLieret/status/2059643437964497161
    verbatim: |
      DeepSWE finds that mini-swe-agent significantly outperforms ClaudeCode and Codex on the benchmark. The simpler the system, the better it generalizes (and mini's core agent class is just ~150 lines of code)
    inline: "The simpler the system, the better it generalizes"
    summary: >
      A mini-swe-agent author, the same day as Ofir Press's post, reporting that DeepSWE found
      mini-swe-agent outperforming Claude Code and Codex, and giving the reason he draws from
      it.
    verdict: >
      A voice post in the same thread as the Ofir Press card, not a second result: the benchmark
      is the same one, and we did not run it. What it adds is the interpretation, that
      simplicity is why the small agent generalizes, which is his reading of his own team's
      benchmark.

  - id: mlcatttt-benchmark-does-the-work
    title: "The counter-read: the benchmark is doing the lifting"
    kind: voice
    date: 2026-05-27
    date_precision: day
    captured_on: 2026-09-23
    source_ids: [claude-code, codex]
    authors: ["MLCatttt"]
    display_name: "engineer cat 🐈"
    source_urls:
      - https://x.com/MLCatttt/status/2059699888741605668
    verbatim: |
      if mini-swe-agent at 150 lines matches the frontier on this benchmark, the benchmark is doing a lot of the work. most production complexity lives in the long tail, not the canonical task shape
    inline: "the benchmark is doing a lot of the work. most production complexity lives in the long tail, not the canonical task shape"
    summary: >
      A reply to the mini-swe-agent result arguing that if 150 lines match the frontier, the
      benchmark rather than the harness is doing the work, because production complexity sits in
      the long tail.
    verdict: >
      A voice post and a counter-read, not a measurement: it questions what the benchmark can
      see rather than disputing the score. It is here so the result that cuts against this
      publication meets the objection that cuts back.

