  - id: pvncher-not-opensource
    title: "agy is not opensource"
    kind: criticism
    date: 2026-05-19
    date_precision: day
    captured_on: 2026-07-29
    source_ids: [gemini-cli, antigravity]
    authors: ["pvncher"]
    display_name: eric provencher
    source_note: 3
    handling_note: c
    source_urls:
      - https://x.com/pvncher/status/2056802695382515739
    verbatim: |
      So google is replacing gemini-cli with agy (antigravity cli), but:
      1. agy is not opensource
      2. It no longer supports ACP

      Really unfortunate development
    inline: >-
      agy is not opensource
    summary: >
