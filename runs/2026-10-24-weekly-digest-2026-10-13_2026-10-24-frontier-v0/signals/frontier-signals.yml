schema_version: bitter.frontier_signals.v0
run_id: 2026-10-24-weekly-digest-2026-10-13_2026-10-24-frontier-v0
window:
  start: 2026-10-13
  end: 2026-10-24
note: >
  This issue covers the 11-day reporting interval after 2026-10-13T23:59:59Z through the
  source-specific successful reads on 2026-10-24 UTC, not the end of that day. Pi's optional MCP
  adapter actually removes its interpreter; supported delegation, context selection and continuing
  jobs give builders other specific pieces of plumbing to stop duplicating. Acceptance does not
  disappear with them: Origin can delegate ownership review, OpenClaw applies learned edits before
  review, and Claude adds an explicit person decider that can route through a dialog or host
  callback. These are different choices about authority, not equivalent safety guarantees. Try the
  native paths against accepted outcomes, then spend the retained attention on initial grants, wake
  ownership, unknown effects and compatible upgrades. No supplied measurement establishes a net
  reduction in human hours. Origin's ownership option is current early-beta posture verified by the
  2026-10-24 read; its overlapping weekly note does not prove a launch after the previous cutoff.

signals:

  - id: 2026-10-24-pi-coding-agent-adapter-reuses-native-codemode
    status: accepted
    section: runtime
    source: pi-coding-agent
    channel: tagged-release
    title: "A third-party Pi MCP adapter drops its interpreter for Pi's native codemode"
    finding_ids:
      - 2026-10-24-pi-coding-agent-the-mcp-adapter-removes-its-separate-script-engine-and-routes-approvals-through-real-tool
    summary: >
      Optional pi-mcp-adapter 6.0.0, released 2026-10-22, removes QuickJS, mcpScript, jev.evaluate
      and its scripting skill in favor of Pi codemode. Deferred MCP calls expose their real tool
      names to permission hooks. Recognized Executor approval pauses request confirmation through
      Pi's UI; model self-approval is refused, and such a pause fails when no confirmation UI is
      available. Native MCP predates this window; Pi core did not delete an interpreter here.
    why_action_bearing:
      - >
        Adapter users on current Pi 1.4.0: port script settings and hook matchers before installing
        adapter 6.0.0, then compare the native composition path with the interpreter or bridge you
        maintain. A second interpreter is now a concrete maintenance cost that can be removed.
      - >
        Test allowed and forbidden calls through proxy, deferred and scripted paths, plus an
        Executor pause with and without a person present. Recorded tool identities and refusal
        results would settle the deployed permission boundary; a visible --tools list does not
        settle it.
      - >
        Review project script contents as well as their configuration entries, and reverse the
        adapter's native-MCP takeover when removing it. Count migration and review time against
        accepted work before claiming a net attention saving; the author's context benchmark is
        configuration-specific.
    accessibility_consequence:
      what_got_easier: "Adapter users can compose MCP work through Pi's supported scripting primitive."
      who_can_use_now: "Users of optional pi-mcp-adapter 6.0.0; current Pi CLI stable is 1.4.0."
      authority_visibility: "Permission hooks see real deferred tool identities; a recognized approval
        pause requests UI confirmation and fails if that UI is unavailable."
    security_consequence:
      threat_blocked_or_opened: "The adapter refuses model self-approval, while configuration approval
        still does not bind immutable script bytes."
      attacker_model: "Untrusted tool results or project scripts encountered by an admitted adapter and
        its MCP servers."
      enforcement: "Pi tool-call hooks and adapter approval handling; tool presentation is not an
        execution deny rule."
      cost_to_operator: "Port settings and matchers, inspect scripts and qualify every calling path."
      residual: "No runtime denial matrix or matched throughput trial was performed in this cycle."
    receipts:
