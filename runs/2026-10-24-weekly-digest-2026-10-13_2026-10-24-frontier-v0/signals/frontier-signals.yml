  - id: 2026-10-24-codex-updater-enforces-saved-network-policy
    status: accepted
    section: runtime
    source: codex
    channel: tagged-release
    title: "Codex's released updater loads network policy before making requests"
    finding_ids:
      - 2026-10-24-codex-stable-updater-requests-now-require-successfully-loaded-network-policy
    summary: >
      The daemon-updater repair d570b363 first reaches stable Codex 0.163.0 on 2026-10-15 and
      remains in current 0.164.0. Its client factory propagates configuration failure and activates
      network policy instead of falling back to a default HTTP client. Saved network settings govern
      this process; invoking CLI -c overrides do not reach it. The independently selected daemon
      still has an experimental lifecycle contract.
    why_action_bearing:
      - >
        Restricted interactive fleets: move to stable 0.164.0 and record the CLI and serving-daemon
        versions separately. The prior release wait is complete; automatic updates can now be
        evaluated against the fleet's saved restrictions.
      - >
        Before enabling the updater, test a denied destination and invalid configuration using the
        actual saved policy. Keep updates held until those tests pass. Recorded network refusals and
        a pinned-install update trace would settle enforcement and update timing in that
        installation.
      - >
        Budget restart and environment administration as well as patching. This replaces waiting for
        upstream delivery with a bounded deployment check; no daemon was launched, updated or
        interrupted in this research.
    accessibility_consequence:
      what_got_easier: "Managed fleets can qualify automatic service updates without the old
        default-client fallback."
      who_can_use_now: "Interactive daemon deployments on stable 0.163.0 or later; current CLI stable is 0.164.0."
      authority_visibility: "The serving daemon and its saved configuration must be inventoried
        independently of the launching CLI."
    security_consequence:
      threat_blocked_or_opened: "Updater traffic no longer proceeds through a default client after policy-loading failure."
      attacker_model: "A restricted installation with denied destinations or invalid saved configuration;
        no remote updater compromise is alleged."
      enforcement: "Network-policy-enabled updater client factory and propagated configuration errors."
      cost_to_operator: "Test saved policy, inventory two runtime identities and retain an explicit patch
        schedule while updates are held."
      residual: "Fleet enforcement, update timing and interruption costs remain unobserved."
    receipts:
      - url: https://github.com/openai/codex/commit/d570b3632b100e36f931797cdbdb8906d0fcafa8
        precision: commit_diff_reviewed
      - url: https://github.com/openai/codex/blob/rust-v0.164.0/codex-rs/cli/src/main.rs#L2459-L2464
        precision: tagged_commit_file
