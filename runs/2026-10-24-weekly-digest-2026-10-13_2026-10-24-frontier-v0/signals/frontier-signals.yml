  - id: 2026-10-24-github-copilot-cli-sandbox-local-network-default
    status: accepted
    section: runtime
    source: github-copilot-cli
    channel: tagged-release
    title: "Copilot's enabled sandbox now permits local-network access by default"
    finding_ids:
      - 2026-10-24-github-copilot-cli-local-network-access-defaults-on-and-macos-gains-a-narrower-localhost-exception
      - 2026-10-24-github-copilot-cli-acp-honors-saved-sandbox-settings-and-launch-flags-on-new-and-resumed-sessions
    summary: >
      Copilot CLI 1.0.100 defaults local/private-network access on inside an enabled sandbox.
      Version 1.0.101 permits direct macOS localhost TCP when local access is enabled and no host
      filters apply. Stable 1.0.103 also repairs saved sandbox settings and launch flags in new and
      resumed ACP sessions. Sandboxing itself remains default-off. Pinned docs still show the older
      network default, so omission is an unsafe policy choice.
    why_action_bearing:
      - >
        Terminal and ACP fleet owners: install stable 1.0.103 and set sandbox.allowLocalNetwork
        deliberately. Test a needed development listener and an unintended private service on each
        host; a functioning local development loop can now replace a workaround while exposing
        services an operator previously assumed were unreachable.
      - >
        Compare new and resumed ACP sessions with saved settings and launch flags, recording the
        actual server binary. For required containment, verify enabled=true, failIfUnavailable=true
        and allowBypass=false in managed policy. The 1.0.103 release and package establish delivery
        even though its final public notes commit is ahead of the source tag.
      - >
        Keep host-filter and Windows cases in the test matrix. Platform-specific connection and
        refusal traces would settle the deployed boundary; the narrow macOS exception does not prove
        every localhost path works. Use those results to decide whether saved configuration removes
        per-session repair work.
    accessibility_consequence:
      what_got_easier: "Enabled sandboxes can run local-service development loops, and ACP can reuse the
        saved sandbox configuration."
      who_can_use_now: "Supported hosts on stable Copilot CLI 1.0.103, with sandboxing explicitly enabled."
      authority_visibility: "Sandbox enablement, private-network reach and the ACP server identity are
        separate policy checks."
    security_consequence:
      threat_blocked_or_opened: "The local-network default widens reachable services; the ACP repair makes
        saved containment choices apply."
      attacker_model: "Injected task instructions attempting to reach local listeners or private services
        through an authorized command."
      enforcement: "Supported command sandbox, local-network setting, host filters and managed policy;
        Windows direct-connection caveats remain."
      cost_to_operator: "Set an explicit network choice and qualify terminal/new-ACP/resumed-ACP behavior
        per platform."
      residual: "Docs conflict with released defaults, and no host connection or refusal test was run here."
    receipts:
