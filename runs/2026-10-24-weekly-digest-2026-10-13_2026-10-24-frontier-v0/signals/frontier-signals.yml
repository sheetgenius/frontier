  - id: 2026-10-24-claude-code-policy-asks-hold-over-user-mods
    status: accepted
    section: control-plane
    source: claude-code
    channel: tagged-release
    title: "Claude's managed guard preserves policy asks over user mods"
    finding_ids:
      - 2026-10-24-claude-code-the-published-guard-now-holds-policy-asks-and-environment-pins-over-user-mods
      - 2026-10-24-claude-code-unconfigured-headless-jobs-revert-from-auto-to-default-in-several-cases
    summary: >
      The guard at bf2323b3 ships in 2.1.299 and holds policy-backed asks, denies and pinned
      environment entries over user mods when loaded. Ordinary mode-owned asks are different, and
      administrators can relax holds. Version 2.1.304 adds decider: "person", which routes to a
      permission dialog or host callback rather than auto approval. Version 2.1.302 also returns
      some unconfigured headless jobs from auto to default. Both stable-selector 2.1.308 and latest
      2.1.310 contain these changes.
    why_action_bearing:
      - >
        Managed mod and CI owners: use latest 2.1.310 for the complete current repair set, verify
        the built-in guard is seated, and keep allowManagedModsOnly=true where user code must not
        join policy. Released delivery ends the old wait; it does not sandbox admitted mods.
      - >
        Set the permission mode in each unattended job. Without one, fresh installs, third-party
        providers and telemetry-disabled headless sessions now use default. A job unable to ask can
        stop where it formerly used auto, creating a deliberate policy decision before dispatch.
      - >
        Test a rule-backed ask against a user-mod allow, an environment-pin change and decider:
        "person" with neither a dialog nor host callback available. If a human must decide, verify
        that any host callback actually routes to one. Refusal traces in each deployed mode would
        settle enforcement; regenerate mod types before using this decider because the public type
        mirror lags it.
    accessibility_consequence:
      what_got_easier: "Organizations can preserve policy-backed approval decisions while allowing
        admitted mods to customize routine work."
      who_can_use_now: "Guarded Claude Code sessions from 2.1.299; use latest 2.1.310, with explicit
        unattended configuration."
      authority_visibility: "Policy-backed asks, ordinary mode asks and the person decider have different
        contracts; a host callback is not proof of human involvement."
    security_consequence:
      threat_blocked_or_opened: "User mods cannot weaken held policy verdicts or pinned environment
        entries through the guarded chain."
      attacker_model: "An admitted user mod attempting to alter tool policy; its own unsandboxed process
        operations remain trusted code."
      enforcement: "Loaded sec-default guard, managed admission settings and configured verdict holds."
      cost_to_operator: "Choose admitted code and explicit job modes, refresh mod types and test each
        deployed approval path."
      residual: "No runtime enforcement probe was run; a shipped guard is not universal confinement of
        plugin code."
    receipts:
