  - id: 2026-10-24-cursor-origin-code-owner-review-can-be-delegated
    status: accepted
    section: control-plane
    source: cursor
    channel: preview-or-beta
    title: "Origin lets an agent or installed app satisfy code-owner review"
    finding_ids:
      - 2026-10-24-cursor-origin-lets-an-agent-s-ownership-decision-or-an-installed-app-s-approval-satisfy-code-owne
    summary: >
      Origin's current early-beta web ruleset offers Off, Classic and Agentic code-owner review. In
      Agentic, Origin's ownership decision can replace the approval count; an installed app named in
      ORIGIN_CODEOWNERS can satisfy review for its paths. The captured week-of-2026-10-12 note spans
      the old cutoff and has no established first-publication time. This is newly established
      current capability, not a proved post-cutoff launch or a guarantee supplied by installing the
      separate stable Origin CLI.
    why_action_bearing:
      - >
        Origin repository owners: choose Classic and human-owned path entries where a person must
        approve, and remove app_ alternatives for those paths. Classic requires owner approval but
        does not itself require a human owner. App installation and path ownership determine who can
        satisfy that gate.
      - >
        Trial Agentic on a scratch repository, recording head, paths, agent decision, human
        reversals and owner approvals avoided. Published substitution thresholds and a discoverable
        decision log, corroborated by those tests, would settle which human decisions it can
        replace.
      - >
        Test an app's own and another author's pull requests before treating app review as
        independent approval. The captured contract does not establish self-review counting. Less
        owner waiting is possible; teams inherit acceptance-policy and reversal work, with no
        measured saving.
    accessibility_consequence:
      what_got_easier: "An Origin-hosted repository can delegate ownership review to Origin's agent or an
        installed app."
      who_can_use_now: "Early-beta Origin teams using the documented web ruleset and installed app
        ownership contract."
      authority_visibility: "Classic requires owner approval, which an installed app owner can satisfy;
        Agentic thresholds and decision-log location remain unpublished in this record."
    security_consequence:
      threat_blocked_or_opened: "A machine decision or app approval can satisfy a gate previously assigned to a code owner."
      attacker_model: "An admitted agent or installed review app handling an untrusted pull request; no
        bypass exploit was reproduced."
      enforcement: "Hosted ruleset and namespace installation checks, supported by captured official
        contracts and compared client fields."
      cost_to_operator: "Choose paths and review principals deliberately, then sample decisions and human reversals."
      residual: "Launch timing, substitution thresholds, auditability and app self-review counting remain
        unestablished."
    receipts:
      - url: https://web.archive.org/web/20261024094000id_/https://cursor.com/docs/release-notes/origin.md
        precision: official_docs
      - url: https://web.archive.org/web/20261024094330id_/https://cursor.com/docs/api/origin/reference/create-ruleset.md
        precision: official_docs
      - url: https://web.archive.org/web/20261024092716/https://cursor.com/docs/origin
        precision: official_docs

  - id: 2026-10-24-claude-code-journaled-headless-delegation
    status: accepted
    section: runtime
    source: claude-code
    channel: tagged-release
    title: "Claude enables headless forks and reuses completed workflow steps"
    finding_ids:
      - 2026-10-24-claude-code-forked-delegation-reaches-headless-sessions-while-lifecycle-and-budget-holes-close
    summary: >
      Claude Code 2.1.302 makes fork subagents default on specified headless, SDK, Desktop and VS
      Code paths. Version 2.1.305 serves completed pipeline() and parallel() agents from the
      workflow journal on resume. Turn and stop repairs reach 2.1.299/2.1.304, and 2.1.309 repairs
      split-pane tool restriction inheritance. Latest 2.1.310 contains the full set; stable selector
      2.1.308 lacks the later inheritance repair.
    why_action_bearing:
      - >
        CI and SDK integrators: trial latest 2.1.310 with one workflow resumed after a completed
        child before keeping custom prompt-copy and restart scaffolding. Compare accepted results
        and recovery interventions; successful journal reuse would justify removing that duplicate
        work.
      - >
        Test max turns, Stop, ended input and denied child tools, including mods and split panes.
        Record which steps actually rerun and reconcile any interrupted external write before
        retrying it; a journal entry does not establish exactly-once effects.
      - >
        Set the unattended permission mode explicitly and measure cost and review time.
        CLAUDE_CODE_FORK_SUBAGENT=0 disables forks; claude mcp serve does not offer them. Native
        delegation can save context assembly while creating more child output to accept.
    accessibility_consequence:
      what_got_easier: "Headless and embedded workflows can share context and reuse completed delegated steps."
      who_can_use_now: "Named CLI/SDK/Desktop/VS Code paths; use latest 2.1.310 for the complete recorded
        repair set."
      authority_visibility: "Journal reuse, child restrictions and the job's explicit permission mode are
        separate acceptance checks."
    security_consequence:
      threat_blocked_or_opened: "Released limit and inheritance repairs narrow ways delegated work can
        outlive a stop or lose tool restrictions."
      attacker_model: "Admitted mods and children operating on untrusted task input within a configured job."
      enforcement: "Published lifecycle, journal and restriction repairs; the closed runtime was not
        independently exercised."
      cost_to_operator: "Qualify cancellation, limits, child authority and unknown external outcomes
        before deleting restart glue."
      residual: "No matched human-time saving or exactly-once external-effect guarantee is established."
    receipts:
