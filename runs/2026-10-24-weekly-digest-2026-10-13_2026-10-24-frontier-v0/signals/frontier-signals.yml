    source: openclaw
    channel: tagged-release
    title: "OpenClaw Workshop replaces proposals with immediate versioned edits"
    finding_ids:
      - 2026-10-24-openclaw-workshop-replaces-proposal-review-with-direct-edits-and-bounded-undo-history
      - 2026-10-24-openclaw-workshop-retirement-requires-manual-migration-of-proposal-integrations-and-old-backups
    summary: >
      From stable 2026.10.5, Workshop applies learned-procedure edits immediately and retains ten
      versions per skill plus 500 change entries per agent. Auto remains the default; legacy propose
      becomes off, but legacy auto plus pending does not. Old proposal methods error, removed hooks
      no longer fire and old collection backups are not restored automatically. Current 10.7
      contains this migration; Undo is bounded recovery after use.
    why_action_bearing:
      - >
        Skill-library owners moving to 10.7: use the required patched Node runtime and replace the
        old proposal recipe. Set skills.workshop.autonomous.mode=off when a person must initiate
        learning; manual learning remains available. Off is not a new pre-application approval
        queue.
      - >
        If retaining auto, inspect changes already effective, exercise Undo and keep independent
        backups beyond ten versions. Learned Workshop skills bypass the ordinary per-agent skill
        allowlist, and background review uses an additional foreground-route model run.
      - >
        Port proposal integrations to current Workshop methods and recover needed drafts and old
        backups manually. A bad-edit/restore test plus correction minutes and review spend would
        establish whether the removed proposal queue saves attention rather than postpones it.
    accessibility_consequence:
      what_got_easier: "Agents can revise reusable procedures directly, with versioned restoration
        available to operators."
      who_can_use_now: "Stable OpenClaw 2026.10.5 onward, currently 10.7, after runtime and integration migration."
      authority_visibility: "The procedure can affect work before review; manual initiation, automatic
        learning and bounded Undo are different choices."
    security_consequence:
      threat_blocked_or_opened: "A bad learned procedure can take effect immediately and survive ordinary
        skill allowlist expectations."
      attacker_model: "Untrusted task material influencing an authorized learning run; no
        persistent-poisoning exploit was reproduced."
      enforcement: "Current learning/restore authority checks and bounded version history; the old
        proposal gate no longer exists."
      cost_to_operator: "Choose initiation policy, port hooks, inspect effective edits and maintain
        longer-lived backups."
      residual: "Learning quality, correction burden and review-model spend have not been measured."
