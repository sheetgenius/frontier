  - id: 2026-10-24-openclaw-bash-predicate-repair-remains-on-main
    status: accepted
    section: control-plane
    source: openclaw
    channel: main-unreleased
    title: "OpenClaw's Bash predicate repair has not reached a published channel"
    finding_ids:
      - 2026-10-24-openclaw-bash-predicates-still-bypass-exec-allowlist-review-on-all-three-published-channels
      - 2026-10-24-openclaw-final-argument-approval-binding-reached-both-stable-lines
    summary: >
      Stable OpenClaw 2026.10.7, beta 2026.10.10-beta.3 and extended-stable 2026.9.34 still classify
      Bash predicates without inspecting their operands. Bash 4.2 and later can evaluate an array
      subscript in a quoted test -v operand and execute command substitution without an allowlist
      match or on-miss approval. The 2026-10-23 repair 69cd9c5e excludes -v predicates from
      safe-builtin treatment and matches builtin names case-sensitively; it is on main and in none
      of those published channels.
    why_action_bearing:
      - >
        POSIX Gateway owners relying on exec allowlists: restrict adversarial shell work and host
        exposure until a published version contains this repair. Enforce any interim predicate
        restriction outside the affected classifier, with whole-process containment and narrowly
        scoped credentials where untrusted work must continue.
      - >
        Watch for a containing stable tag, then run harmless substitution and case-variant refusal
        tests through the real approval chain. Tag ancestry plus recorded refusals would settle
        delivery and deployed enforcement; the maintainer's production-chain probe was not
        reproduced here.
      - >
        The separately released final-hook-argument binding does not repair this shell classifier.
        Review effort cannot protect a request that the classifier never sends for approval;
        containment and release tracking now consume the attention that a narrow allowlist was meant
        to save.
    accessibility_consequence:
      what_got_easier: "Main contains a specific classifier repair; no published channel yet supplies it."
      who_can_use_now: "Source-build evaluators can inspect 69cd9c5e; ordinary stable, beta and
        extended-stable operators remain affected."
      authority_visibility: "A safe-builtin classification can skip the allowlist and the person's on-miss approval."
    security_consequence:
      threat_blocked_or_opened: "A quoted Bash predicate operand can execute a substituted command without
        its expected allowlist review."
      attacker_model: "Untrusted task or tool content inducing a shell request under a POSIX exec allowlist."
      enforcement: "Main removes unsafe predicate exemptions; published classifiers still have the
        argument-blind treatment."
      cost_to_operator: "Restrict untrusted shell work, contain the service and track a tag plus
        approval-chain regression results."
      residual: "No exploit was executed in this cycle; a tested patched binary is not established."
    receipts:
