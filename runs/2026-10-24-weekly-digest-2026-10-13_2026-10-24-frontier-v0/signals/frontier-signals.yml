  - id: 2026-10-24-openhands-mentions-can-start-code-changing-work
    status: accepted
    section: platform
    source: openhands
    channel: tagged-release
    title: "OpenHands packages mention-to-code work and a factory setup recipe"
    finding_ids:
      - 2026-10-24-openhands-github-mentions-can-request-code-changes-under-a-repository-write-gate
      - 2026-10-24-openhands-software-factory-guidance-ships-and-becomes-default-enabled
    summary: >
      Extensions 0.35.0, bundled from Canvas 1.32.0 and retained in 1.33.0, lets permitted GitHub
      mentions request branches, commits, pushes and PR updates. Its monitor defaults to
      repository-write authorization and implement mode. Separately, shipped software-factory
      guidance assembles issue-to-PR, review and triage stations; guidance is enabled by default for
      new workspaces but does not start jobs on installation. Specialist operating procedure still
      has a job.
    why_action_bearing:
      - >
        Repository automation owners: try one bounded repository on Canvas 1.33.0 with its
        extensions 0.35.0 and matched services. Review the factory's proposed profiles, credentials
        and jobs before replacing manual request-to-branch coordination or custom onboarding.
      - >
        Inspect the deployed monitor, token owner, allowlists and work mode. The poller checks other
        authors' repository permissions, with explicit bypasses; the fallback template puts
        authorization and work restrictions in the prompt. Use reply mode for discussion, and avoid
        anyone plus implement when arbitrary commenters must not start code changes.
      - >
        Exercise an authorized request, an unauthorized mention and a request outside the work
        policy; inspect the branch and token used. Those results and review minutes per accepted PR
        would establish the deployed benefit. Updating Canvas does not prove saved monitors
        migrated.
    accessibility_consequence:
      what_got_easier: "Repository writers can request code-changing work through a mention, with packaged
        setup for recurring stations."
      who_can_use_now: "Configured Canvas 1.33.0 deployments using extensions 0.35.0 and compatible
        backend services."
      authority_visibility: "The actual monitor definition and token decide who can start work; prompt
        restrictions are not mechanical confinement."
    security_consequence:
      threat_blocked_or_opened: "An overbroad mention policy can let arbitrary commenters request changes
        using the automation's token."
      attacker_model: "An untrusted commenter or repository input reaching an enabled monitor."
      enforcement: "The poller has repository-permission checks with bypasses; fallback-template
        authorization is prompt-based."
      cost_to_operator: "Qualify trigger admission, token scopes, saved bundles and accepted changes
        before unattended expansion."
      residual: "No live monitor or factory acceptance run was performed; existing saved monitors need
        their own migration check."
    receipts:
