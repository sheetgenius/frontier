  - id: 2026-10-24-opencode-readable-state-changing-public-contracts
    status: accepted
    section: platform
    source: opencode
    channel: tagged-release
    title: "OpenCode 2.1 keeps old sessions readable while changing public APIs"
    finding_ids:
      - 2026-10-24-opencode-v2-1-changes-public-replay-and-compaction-fields-while-preserving-legacy-stored-data
    summary: >
      OpenCode 2.1.0's 2026-10-20 release consolidates replay fields under native, moves credential
      setup answers to metadata and removes session.compacted. Storage decoders retain old shapes
      without a database migration. Current V2 stable is @opencode/cli 2.1.4; the separate
      opencode-ai package remains V1 1.19.4. Both provide an opencode executable. Readable stored
      state does not make an old client or plugin compatible.
    why_action_bearing:
      - >
        SDK, event-stream and plugin owners: inventory executable ownership and the running
        client/server pair, then adapt the 2.1 fields before upgrading the server to 2.1.4. Hold V1
        deliberately with its own package rather than trusting GitHub's Latest label to select V2.
      - >
        Exercise a saved session, tool call/result, compaction and provider/model switch against the
        exact pair. Native compaction replay depends on provider and model; fallback to original
        history can change context cost. Successful import alone cannot settle integration
        compatibility.
      - >
        Use recorded API/event results and total migration and review time to decide whether the
        reusable host replaces custom glue. Independent harnesses supply real operating primitives
        too; their compatibility bill belongs in the attention calculation, and no matched saving
        was measured.
    accessibility_consequence:
      what_got_easier: "V2 integrators can retain historical session data while adopting the revised
        reusable host contracts."
      who_can_use_now: "V2 @opencode/cli 2.1.4 users with adapted integrations; V1 opencode-ai 1.19.4
        remains a distinct hold."
      authority_visibility: "The executable, serving process, plugin API and provider replay contract must
        be identified separately."
    security_consequence:
      threat_blocked_or_opened: "A readable session can conceal a broken integration or a changed replay
        assumption; no new exploit is asserted."
      attacker_model: "Stale clients/plugins and incompatible provider replay state during an authorized upgrade."
      enforcement: "Backward-readable storage decoders coexist with intentionally changed public SDK,
        HTTP/event and plugin fields."
      cost_to_operator: "Port clients and plugins, run a migration matrix and account for replayed context."
      residual: "No installed-client migration, runtime policy audit or matched inference-cost test was
        performed."
    receipts:
