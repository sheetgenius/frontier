  - id: 2026-10-24-hermes-agent-gateway-work-outlives-terminal
    status: accepted
    section: runtime
    source: hermes-agent
    channel: tagged-release
    title: "Hermes keeps classic CLI work running after terminal detach"
    finding_ids:
      - 2026-10-24-hermes-agent-the-gateway-owns-classic-cli-turns-and-live-revocations-reach-more-request-paths
    summary: >
      Stable Hermes 0.22.5's classic chat, chat -q and top-level -z paths attach to gateway-owned
      execution. EOF or detach leaves the job running; an explicit remote failure does not silently
      start a local agent. Released revocation repairs synchronize saved allowlist removals with
      cached permanent allows and check disabled plugins on HTTP requests, new websocket handshakes
      and other served paths.
    why_action_bearing:
      - >
        CLI wrapper and bot operators: use stable 0.22.5, follow the persisted session identity and
        completion status, and stop treating terminal exit as cancellation. A continuing gateway can
        replace a wrapper kept alive only to supervise the chat process.
      - >
        Configure agent.run_budget_seconds rather than --run-budget on this path; -z does not itself
        bypass approvals. Use the documented alternative surfaces for unsupported worktree and image
        invocations. Record the serving gateway, home and profile alongside the client version.
      - >
        Detach from a harmless job, reconnect, cancel it deliberately and remove a saved permanent
        allow. Separately disable a plugin, then test HTTP requests and new websocket handshakes
        under each served profile. These checks do not establish termination of an already-open
        socket. Completion and refusal traces would settle the deployed lifetime and consent
        behavior. Saved terminal supervision may become gateway administration; no net orchestration
        saving was measured.
    accessibility_consequence:
      what_got_easier: "Classic CLI users can leave and rejoin work owned by a continuing gateway."
      who_can_use_now: "Supported classic CLI invocations on stable Hermes 0.22.5; standalone Desktop is
        separately versioned."
      authority_visibility: "Terminal lifetime no longer defines job lifetime; inspect the gateway's
        actual home, profile and session."
    security_consequence:
      threat_blocked_or_opened: "Revoked allows and disabled plugins reach more live paths, while closing
        a terminal leaves authority active."
      attacker_model: "Previously admitted sessions or plugins after consent changes; no new
        affected-version advisory range was recovered."
      enforcement: "Gateway revocation and request-path checks in tagged source."
      cost_to_operator: "Own explicit cancellation, run budgets, service identity and cross-profile
        revocation tests."
      residual: "Source behavior is verified; fleet restart, detach and revocation acceptance remain
        untested."
    receipts:
      - url: https://github.com/NousResearch/hermes-agent/blob/v0.22.5/website/docs/developer-guide/gateway-classic-cli.md
        precision: tagged_commit_file
