  - id: 2026-10-24-pi-coding-agent-durable-sleeps-need-a-wake-owner
    status: accepted
    section: runtime
    source: pi-coding-agent
    channel: tagged-release
    title: "Pi Durable checkpoints a wait and releases the invocation"
    finding_ids:
      - 2026-10-24-pi-coding-agent-durable-1-4-can-hibernate-between-phases-with-a-one-way-sqlite-upgrade
    summary: >
      Experimental Pi Durable 1.4.0, released 2026-10-21 in a stable tag, replaces runtime.sleep()
      with sleepUntil(): a phase commits a sleeping task and releases its invocation. The host must
      persist a wake and reopen the harness. SQLite automatically moves to schema 2, which 1.3 and
      older cannot open; older JSONL readers cannot resume the new sleeping state. Updating the
      ordinary Pi CLI does not create this host machinery.
    why_action_bearing:
      - >
        Durable host builders: back up storage before 1.4 opens it, plan the one-way cutover, split
        post-wait work into a new phase and supply each document's checkpointWhen predicate. This
        can replace an invocation kept alive solely to wait.
      - >
        Persist the wake outside the dying process. Kill a harmless job around checkpoint commit and
        alarm registration, then verify it resumes once intended and reconciles any uncertain
        external effect. Those receipts, not a resumed transcript alone, would establish the host's
        recovery.
      - >
        Measure idle resource use, wake latency and recovery interventions against the old host.
        Attention moves from supervising live waits to scheduling and storage custody; no current
        host inherits durable wakes merely by sharing Pi's package family.
    accessibility_consequence:
      what_got_easier: "Host builders can release resources during scheduled waits and reopen checkpointed
        agent work."
      who_can_use_now: "Embedders of experimental @earendil-works/pi-durable 1.4.0 with a durable wake scheduler."
      authority_visibility: "The host owns wake delivery, storage compatibility and external-effect reconciliation."
    security_consequence:
      threat_blocked_or_opened: "A stored wait can survive invocation loss, while a missing wake owner can
        strand accepted work."
      attacker_model: "Process interruption or a faulty host scheduler; this is not a new sandbox or
        hostile-tool isolation claim."
      enforcement: "Checkpointed sleeping state and host wake contract, with one-way SQLite compatibility."
      cost_to_operator: "Back up state, migrate APIs and state handlers, and test the checkpoint-to-alarm handoff."
      residual: "No host crash test or exactly-once external-effect result was produced by this cycle."
    receipts:
      - url: https://github.com/earendil-works/pi/blob/v1.4.0/packages/durable/CHANGELOG.md
        precision: tagged_commit_file
      - url: https://github.com/earendil-works/pi/blob/v1.4.0/packages/durable/README.md#L139-L220
        precision: tagged_commit_file
      - url: https://github.com/earendil-works/pi/blob/v1.4.0/packages/durable/src/storage/sqlite/migrations.ts
        precision: tagged_commit_file
      - url: https://github.com/earendil-works/pi/releases/tag/v1.4.0
