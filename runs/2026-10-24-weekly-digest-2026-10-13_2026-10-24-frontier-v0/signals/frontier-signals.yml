  - id: 2026-10-24-gemini-cli-directory-context-becomes-agent-selected
    status: accepted
    section: runtime
    source: gemini-cli
    channel: tagged-release
    title: "Gemini leaves directory references for the agent to explore"
    finding_ids:
      - 2026-10-24-gemini-cli-stable-directory-references-stop-eagerly-reading-the-entire-directory
    summary: >
      Stable Gemini CLI 0.65.0, released 2026-10-20, removes referenced directories from eager
      read_many_files input and leaves a resolved directory reference for the agent to explore.
      Indispensable files are no longer guaranteed to be injected just because their directory was
      named. Instruction discovery and later explicit reads remain separate.
    why_action_bearing:
      - >
        Users with a working authentication route on 0.65.0: try pointing a fixed task at a
        repository directory before maintaining an eager directory-packing wrapper. The supported
        path lets the agent choose what to read instead of assembling every file in advance.
      - >
        Name required constraints and files explicitly. Compare files actually read, accepted
        output, latency, inference spend and human corrections with the old path; those results
        would settle whether selection saves attention on this repository. No token or task-quality
        gain was measured.
    accessibility_consequence:
      what_got_easier: "A stable CLI user can nominate an area of a large repository without eager
        whole-directory injection."
      who_can_use_now: "Authenticated Gemini CLI users on stable 0.65.0; no preview is needed for this path."
      authority_visibility: "A directory mention is a discovery target, not proof that its constraints
        entered context or a restriction on later reads."
    security_consequence:
      threat_blocked_or_opened: "Less eager input does not remove untrusted files or constrain the agent's
        later file access."
      attacker_model: "Repository content selected during an otherwise authorized task."
      enforcement: "At-command context selection and ignore pruning; existing tool and filesystem policy
        still governs access."
      cost_to_operator: "Identify indispensable inputs and sample discovery failures before removing packing code."
      residual: "No matched quality, cost or exposure reduction has been demonstrated."
    receipts:
