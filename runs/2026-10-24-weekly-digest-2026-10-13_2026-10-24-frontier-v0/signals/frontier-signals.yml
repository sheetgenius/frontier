  - id: 2026-10-24-paperclip-stable-grants-and-accounting-migration
    status: accepted
    section: platform
    source: paperclip
    channel: tagged-release
    title: "Paperclip brings Operator grants and durable accounting to stable"
    finding_ids:
      - 2026-10-24-paperclip-stable-grants-existing-human-operators-company-editing-and-tool-administration
      - 2026-10-24-paperclip-stable-makes-cost-receipts-durable-and-can-hold-admission-on-unknown-prices
    summary: >
      Stable v2026.1023.0, published on GitHub on 2026-10-24, delivers former-beta changes. Existing
      active human Operators can receive fourteen default grants through compatibility seeding.
      Usage receipts now survive until committed settlement, with idempotent accounting and
      serialized admission. Unpriced usage blocks only under the applicable active, positive-amount
      hard-stop policy, not as an unconditional ceiling on the provider bill.
    why_action_bearing:
      - >
        Instance administrators: drain old writers and preserve SQLite lock files before upgrading
        to v2026.1023.0. Inspect human roles and persisted scopes before restart and sign-in; use a
        narrower role or a verified restrictive stored scope where configuration rights are
        unwanted, since missing grant rows can be reinserted. Existing scoped rows survive conflict
        handling.
      - >
        Finance and platform owners: retain unsettled receipts, choose the unpriced-usage policy
        explicitly and reconcile an interrupted/retried run against provider evidence.
        Persisted-grant comparisons and billed settlement traces would close acceptance; released
        code alone closes only delivery. Durable records can replace manual cost reconstruction.
      - >
        Inventory workers separately: stable's remote Codex range is >=0.149.0 and <0.161.0, so
        standalone Codex 0.164.0 is outside it. Keep the native call_api parity repair and later
        review/Stop fixes in their preview lane. A stable platform upgrade does not qualify those
        workers or fixes.
    accessibility_consequence:
      what_got_easier: "Human Operators can configure more company work, and administrators can recover
        cost evidence after interruptions."
      who_can_use_now: "Paperclip stable v2026.1023.0, with role migration and compatible selected workers."
      authority_visibility: "Inspect actual human grants after seeding and distinguish estimated admission
        from committed spend."
    security_consequence:
      threat_blocked_or_opened: "Upgrade can expand existing humans' configuration authority; durable
        accounting narrows lost or duplicate settlement."
      attacker_model: "An existing active human Operator receiving unintended grants, or
        interrupted/retried accounting; no exploit was run."
      enforcement: "Persisted role grants with insert-missing seeding, idempotent settlement and
        conditional hard-stop admission."
      cost_to_operator: "Drain writers, review memberships and scopes, reconcile receipts and qualify the
        selected worker."
      residual: "No live grant migration or provider-billed reconciliation was tested; preview parity and
        review fixes are not stable."
