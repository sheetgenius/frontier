  - id: "tibo-cache-forever-claim"
    title: "Twelve hours and forever are different promises"
    kind: "claim"
    date: "2026-10-21"
    date_precision: "day"
    captured_on: "2026-10-24"
    source_ids: ["codex"]
    authors: ["thsottiaux"]
    display_name: "Tibo"
    source_urls: ["https://x.com/thsottiaux/status/2112712984644784534","https://web.archive.org/web/20261021044950id_/https://developers.openai.com/api/docs/guides/prompt-caching","https://github.com/openai/codex/blob/rust-v0.164.0/codex-rs/features/src/feature_configs.rs#L316-L319"]
    verbatim: "Day 16/\n\nYou can now cache for 12h in the API and for logged in users across Codex & Work we keep cache forever and you don\u2019t have any penalty for coming back to an old conversation or resuming after a few hours and are now guaranteed to hit the cache."
    inline: "You can now cache for 12h in the API and for logged in users across Codex & Work we keep cache forever and you don\u2019t have any penalty for coming back to an old conversation or resuming after a few hours and are now guaranteed to hit the cache."
    summary: "Tibo pairs twelve-hour API caching with a promise of indefinite cache reuse for logged-in Codex and Work users."
    verdict: "Claim, only the API portion is confirmed by the pinned October 21 guide: eligible Responses models support a twelve-hour minimum lifetime. That API contract does not establish perpetual Codex or Work subscription credit. Codex 0.164.0 preserves fork prefixes with a legacy-compaction exception, not a server retention guarantee. The forever and guaranteed-hit language remains an unverified vendor claim with no published method; no account billing or long-gap reuse was tested."

  - id: "kirill-long-gap-cache-counterexample"
    title: "A cold resume challenges the cache promise"
    kind: "claim"
    date: "2026-10-24"
    date_precision: "day"
    captured_on: "2026-10-24"
    source_ids: ["codex"]
    authors: ["bra1n_dump"]
    display_name: "Kirill Dubovitskiy"
    source_urls: ["https://x.com/bra1n_dump/status/2113854374804086988","https://web.archive.org/web/20261021044950id_/https://developers.openai.com/api/docs/guides/prompt-caching","https://github.com/openai/codex/blob/rust-v0.164.0/codex-rs/features/src/feature_configs.rs#L316-L319"]
    verbatim: "Codex \"cache forever\" isn't working for me. Same thread resumed after 13h: 0% cached.\n\n~94K-token thread, codex exec, ChatGPT login, 6.1 Sol:\n\n2h:   99.8%\n13h: 0%\n25h: 8%  (system prompt probably got cached)\n\nDesktop too: https://github.com/openai/codex/issues/56050"
    inline: "Same thread resumed after 13h: 0% cached."
    summary: "Kirill Dubovitskiy reports losing cached-token credit after resuming a logged-in Codex CLI thread."
    verdict: "Claim about a private measurement, not independently reproduced: the 99.8%, 0% and 8% figures remain the author's observations without request payloads proving an unchanged prefix and cache identity. The pinned API guide describes finite lifetimes, while the tagged Codex client cannot prove subscription-side retention. The linked Desktop report is a separate observation. This challenges a guaranteed hit without establishing a universal Codex cache failure."

