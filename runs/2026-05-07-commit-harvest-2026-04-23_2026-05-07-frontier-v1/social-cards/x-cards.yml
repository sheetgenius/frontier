run_id: 2026-05-07-commit-harvest-2026-04-23_2026-05-07-frontier-v1
note: >
  This window predates the standing social lane. These two posts fall on its
  final days and come from a 2026-05-06 to 05-12 archive search run on
  2026-07-29; both were independently re-fetched by URL before quoting. The
  earlier fortnight has no social record here, and saying so is better than
  padding it.
cards:
  - id: codex-chrome-parallel-tabs
    title: "In parallel across tabs, in the background"
    kind: capability_announcement
    date: 2026-05-07
    date_precision: day
    captured_on: 2026-07-29
    source_ids: [codex]
    authors: ["OpenAI"]
    display_name: OpenAI
    source_note: 1
    handling_note: a
    source_urls:
      - https://x.com/OpenAI/status/2052480800004956323
    verbatim: |
      Codex now works directly in Chrome on macOS and Windows.

      It’s even better at working with apps and sites in Chrome, and now works in parallel across tabs in the background without taking over your browser.

      To get started, install the Chrome plugin in the Codex app.
    inline: >-
      now works in parallel across tabs in the background without taking over your browser
    summary: >
      Codex reaching Chrome on the final day of this window.
    verdict: >
      A vendor announcement, quoted as that. The phrase that matters is the last one: the agent works the browser without taking it over, which is the visible computer this issue describes arriving as a shipped default.
    tags: [computer-use, browser]

  - id: claude-dreaming-preview-0507
    title: "Curates memories so your agents learn"
    kind: capability_announcement
    date: 2026-05-06
    date_precision: day
    captured_on: 2026-07-29
    source_ids: [claude-code]
    authors: ["claudeai"]
    display_name: Claude
    source_note: 2
    handling_note: b
    source_urls:
      - https://x.com/claudeai/status/2052067400690851842
    verbatim: |
      Dreaming reviews your agent's past sessions, extracts patterns, and curates memories so your agents learn over time.

      Request access: https://claude.com/form/claude-managed-agents
    inline: >-
      extracts patterns, and curates memories so your agents learn over time
    summary: >
      Anthropic's research preview that edits an agent's memory between sessions.
    verdict: >
      A vendor research preview, quoted as its own description. It lands inside this window and on its argument: agent-side state that no transcript records and no operator approved.
    tags: [memory, background-process]

  - id: teknium-v013-enforced-goal
    title: "Hermes v0.13.0, in its lead's words"
    kind: claim
    date: 2026-05-07
    date_precision: day
    captured_on: 2026-09-23
    source_ids: [hermes-agent]
    authors: ["Teknium"]
    display_name: "Teknium 🪽"
    source_urls:
      - https://x.com/Teknium/status/2052495174404874714
    verbatim: |
      Introducing Hermes Agent v 0.13.0 

      - Multi-Agent orchestration through the Kanban system
      - Enforced goal completion with /goal
      - Big optimizations for disk usage
      - Much more extensibility, custom LLM Providers, custom gateway channels, and much more
    inline: "Enforced goal completion with /goal"
    summary: >
      Hermes Agent's lead announcing v0.13.0 on May 7: multi-agent orchestration through the
      Kanban board, goal completion enforced with /goal, disk-usage optimizations, and custom
      LLM providers and gateway channels.
    verdict: >
      A claim post, checked against the v0.13.0 release (tag v2026.5.7, May 7): the release adds
      a persistent /goal that holds across turns and through context compression, and a Kanban
      board that verifies a worker's claims before a card can close. 'Enforced' is his word; the
      release notes we read do not say what judges a goal met, which the next weekly issue takes
      up.

  - id: swyx-nondestructive-prompts
    title: "Prompts on the harmless actions"
    kind: voice
    date: 2026-05-06
    date_precision: day
    captured_on: 2026-09-23
    source_ids: [codex]
    authors: ["swyx"]
    display_name: "swyx"
    source_urls:
      - https://x.com/swyx/status/2051820268960792778
    verbatim: |
      too many... 

      basicaly switching to the codex plugin, following pash's advice, noticeably killed the productivity. i'd want to swtich back, or read up on approvalpolicy, but whatever this default is is not working for me, particularly on clearly nondestructive actions.
    inline: "whatever this default is is not working for me, particularly on clearly nondestructive actions."
    summary: >
      swyx reporting that switching to the Codex plugin noticeably cut his productivity, and
      that the default approval policy kept interrupting clearly nondestructive actions.
    verdict: >
      A voice post about his own setup, and he says himself he has not yet read up on the
      approval policy; we make no claim about Codex's defaults from it. It is here because it is
      what a prompt on every action costs, in the words of someone paying it: attention spent
      where the risk was lowest.
