    verdict: >
      A vendor performance claim with no published method, quoted as the claim it is. We did not measure it. It is here because the same project spent this window shipping its security work to main and tagging none of it: the capability had a number and an announcement, the containment had neither.
    tags: [performance, vendor-claim]
