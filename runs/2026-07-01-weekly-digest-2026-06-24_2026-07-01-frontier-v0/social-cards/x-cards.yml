cards:
  - id: greenland-105k-stars
    title: "The same thing keeps happening"
    kind: criticism
    date: 2026-06-30
    date_precision: day
    captured_on: 2026-07-29
    source_ids: [gemini-cli, antigravity]
    authors: ["GreenlandMa1"]
    display_name: Maurice G.
    source_note: 1
    handling_note: a
    source_urls:
      - https://x.com/GreenlandMa1/status/2071987121624080465
    verbatim: |
      google just killed gemini CLI overnight. 105k github stars, open source, free tier, all replaced with a closed binary and a gutted free plan.

      the same thing keeps happening.

      a company open sources a tool, developers adopt it, build workflows around it, write tutorials, recommend it to friends. the tool becomes the default in its category. then the company closes it down.

      google did it with gemini CLI. redis did it with their license change. hashicorp did it with terraform. elastic did it with elasticsearch. the playbook is always the same: open source gets you adoption, closed source gets you revenue.

      and i get it. companies need to make money. but the pattern creates a specific problem for people like us who build on top of these tools.

      when i started using gemini CLI, i built it into my daily workflow. terminal commands, automations, scripts that depended on it. that's hours of setup that's now worthless.

      multiply that across every developer and creator who did the same thing. 105k github stars means thousands of people restructuring their workflows today.

      the real lesson isn't "don't use open source tools." open source is still where the best tools live.

      the lesson is: build your workflow so the tool is replaceable.

      i use three AI tools daily. perplexity, chatgpt, claude. if one disappears tomorrow, the other two cover most of what i need. my prompts are saved in markdown files, not locked inside one platform's custom instructions.

      i use everything. i depend on nothing i can't swap out in a day.

      the companies will keep doing this. your job is to build like they will.
    inline: >-
      105k github stars, open source, free tier, all replaced with a closed binary and a gutted free plan
    summary: >
      An operator's read on the Gemini CLI consumer shutdown.
    verdict: >
      A voice post. The star count and the shutdown are checkable and correct; the pattern claim is his argument, not our finding. Quoted because the trade this issue describes -- auditable retired, closed promoted -- is what it looked like from outside the vendor.
    tags: [succession, open-source, closed-source]

  - id: tinygrad-ban
    title: "Banning it from our systems"
    kind: criticism
    date: 2026-06-30
    date_precision: day
    captured_on: 2026-07-29
    source_ids: [claude-code]
    authors: ["__tinygrad__"]
    display_name: the tiny corp
    source_note: 2
    handling_note: b
    source_urls:
      - https://x.com/__tinygrad__/status/2072091861473431605
    verbatim: |
      Claude Code is vibecoded and full of spyware, it's possible Anthropic doesn't even know what's in there. After reading this report, we are banning it from our systems and strongly encourage other enterprises to do the same. It is an unacceptable security risk. https://t.co/thYAXyuxzR
    inline: >-
      we are banning it from our systems and strongly encourage other enterprises to do the same
    summary: >
      A company stating publicly that it removed Claude Code over a security report.
    verdict: >
      Quoted strictly as a statement of what tinygrad said it did, which is the only part we assert. The underlying accusation is NOT established: we read the Claude Code changelog across v2.1.190 to v2.1.200 and found telemetry work but nothing matching the described behaviour, and the report itself does not resolve from any source we hold. We take no position on the claim and publish none of its substance as fact.
    tags: [enterprise-decision, unverified-claim, epistemics]

