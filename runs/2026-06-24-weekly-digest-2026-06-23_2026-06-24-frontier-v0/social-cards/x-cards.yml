    source_urls:
      - https://x.com/bartender_loopy/status/2069490659288117551
    verbatim: |
      Introducing Workcell 🧩

      Open-source platform for running real dev projects with a full AI team — you operate it like a company. You stay the board; the agents ship the work, with proof.

