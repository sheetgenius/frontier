cards:
  - id: hunvreus-burnout-0624
    title: "The night the beta shipped"
    kind: maintainer_intent
    date: 2026-06-23
    date_precision: day
    captured_on: 2026-07-29
    source_ids: [heypi]
    authors: ["hunvreus"]
    display_name: Ronan Berder
    source_note: 1
    handling_note: a
    source_urls:
      - https://x.com/hunvreus/status/2069420983715541115
    verbatim: |
      Getting close to burnout with my open source projects.

      I got Pages CMS 2.0.0 out a few weeks ago, and I'm about to release Basecoat 1.0.0. Oh, and also got heypi 0.2.0 beta released tonight, and I have the new  ReallySimpleDocs on its way (moved to @astrodotbuild).

      I think I'll be taking a sabatical from most of this over the summer (except heypi).

      If you want to see what Basecoat 1.0.0 looks like: https://basecoat.hunvreus.workers.dev/
    summary: >
      heypi's maintainer on his workload, the night 0.2.0 beta shipped.
    verdict: >
      A voice post, quoted as something he said publicly, for one operator-facing reason: this issue adds heypi to the watchlist and its bus factor is one. Nothing here is an inference about him. Removal on request, per CONTRIBUTING.md.
    tags: [sustainability, bus-factor]

