  - id: 8bit64k-plugin-contracts
    title: "Break existing plugin contracts"
    kind: claim
    date: 2026-06-24
    date_precision: day
    captured_on: 2026-09-23
    source_ids: [hermes-agent]
    authors: ["8bit64k_X"]
    display_name: "8bit64k"
    source_urls:
      - https://x.com/8bit64k_X/status/2069786178346229948
    verbatim: |
      Latest commits on Hermes break existing plugin contracts. 
      I'm looking into solutions on how to deal with this for Cronalytics and Omatchy but at this time don't have a solid direction, sorry. This is disappointing. @Teknium 

      The extending-the-dashboard.md page was updated in the same commit (8845f3316, Jun 22) to bake in the new contract. Three spots now say the same thing:

      - Directory layout (line 434): plugin_api.py # bundled plugins only — backend API routes (FastAPI)
      - Layer summary (line 441): dashboard/plugin_api.py — bundled plugins only; backend API routes.
      - Security notes under "Backend API routes" (line 749): "User-installed and project dashboard plugins may still extend the UI with static JS/CSS, but their Python api files are not auto-imported by the dashboard server. Backend routes are reserved for bundled plugins."
    inline: "Latest commits on Hermes break existing plugin contracts."
    summary: >
      A Hermes plugin author, tagging the project lead, reporting that recent commits broke
      existing plugin contracts for his dashboard plugins, and citing commit 8845f3316 and the
      docs it changed: user-installed and project plugins may still extend the UI, but their
      Python API files are no longer auto-imported; backend routes are reserved for bundled
      plugins.
    verdict: >
      A claim post, and the part that can be checked holds: commit 8845f3316, 'restrict
      dashboard plugin backend import to bundled plugins (#43719)', landed on Hermes main on 22
      June and is in no tag, per the previous issue's receipts. That it broke his two plugins is
      his report, which we did not reproduce.

