  - id: hermes-learn-anything
    title: "Distils a verifiable reusable skill"
    kind: capability_announcement
    date: 2026-06-23
    date_precision: day
    captured_on: 2026-07-29
    source_ids: [hermes-agent]
    authors: ["NousResearch"]
