  - id: jimmy-longbow-fine-print
    title: "The fine print"
    kind: voice
    date: 2026-09-15
    date_precision: day
    captured_on: 2026-09-23
    source_ids: [hermes-agent]
    authors: ["jimmy_longbow_"]
    display_name: "JimiLonbo"
    source_urls:
      - https://x.com/jimmy_longbow_/status/2099994186158358606
    verbatim: |
      Nous had a million lines of Python to clean up. They pointed their own agent at it.

      Hermes Agent, orchestrated by Teknium on Sept 2: 1,393 subagents (218 running at peak), 19 active hours, and the codebase came out 34.4% smaller — 1,063,826 lines down to 698,363. The worst "god file" went from 34,847 lines to 5,512.

      The whole thing ran on an i7 desktop with 64GB of RAM, with Claude Fable 5.1 as the remote model.

      Now the honest fine print, which the blog deserves credit for: the tweet's "$2M saved" framing is the upper bound of a $150k–$1.8M manual estimate, against ~$19K of tokens for the main run — human review time excluded. Community reviewers caught real regressions the tests missed, including deleted public names that external plugins might import.

      Still the most detailed public teardown of a fleet refactor we've seen.
    inline: "the tweet's \"$2M saved\" framing is the upper bound of a $150k–$1.8M manual estimate"
    summary: >
      A reader putting the Hermes refactor's savings figure next to its own estimate range.
    verdict: >
      Voice, a reader's reading of the vendor blog. We keep it beside the vendor's number because it
      is the part of the same blog the headline dropped.

  - id: v0xium-press-enter
    title: "Nobody is reading anything"
    kind: voice
    date: 2026-09-20
    date_precision: day
    captured_on: 2026-09-23
    source_ids: [claude-code]
    authors: ["v0xium"]
    display_name: "voxium"
    source_urls:
      - https://x.com/v0xium/status/2101526107128529120
    verbatim: |
      I am done with this shit. It is over. The state of engineering right now is horrible. It has been half a month since I started a new role at a big company. Nobody knows anything here. The specs, code, tests, PRDs, tickets, resolution of those tickets, reports, etc., everything is made by Claude Code. Nobody on my team likes this. They are being forced to ship as much as they can. I have heard multiple times from higher management that pushing code is not a bottleneck, so why are we slow? People are working 12 to 13 hours a day just to press enter. Nobody is reading anything. Humans in corporate are doing nothing on their own. Everyone, literally everyone, from an L1 to an L7 engineer here is doing the same thing. Talk to Claude. There is no sense of victory. Nobody is resolving bugs. In reality, nobody is thinking anymore. Everything is done by LLMs. It is so soul-sucking. I would not mind it, to be honest, if we were at least given the time to check out the code and see what is going where. But no, the goal is to just ship. No matter what happens.
    inline: "People are working 12 to 13 hours a day just to press enter. Nobody is reading anything."
    summary: >
      An engineer at a large company describing a team shipping Claude Code output nobody reads.
    verdict: >
      Voice, one person's account of one workplace, unverifiable and reported as such. We quote it
      because it describes the end state of moving approval off the human: the human is still there,
      pressing enter.

