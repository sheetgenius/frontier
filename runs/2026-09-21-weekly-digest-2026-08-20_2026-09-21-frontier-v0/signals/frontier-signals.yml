schema_version: bitter.frontier_signals.v0
run_id: 2026-09-21-weekly-digest-2026-08-20_2026-09-21-frontier-v0
window:
  start: 2026-08-20
  end: 2026-09-21
note: >
  A 32-day catch-up window. The judge that decides what an agent may do got
  better and moved further from the operator: Claude Code's auto-mode classifier
  went server-side by default, Codex narrowed where Guardian runs, and a workflow
  vendor made the approval itself a durable object. The breaks that mattered did
  not go through the judge. They ran in host plumbing the judge never sees: the
  plugin installer's git checkout, the startup git status, a Docker setting that
  was silently ignored, an approvals server on every interface. The capability
  half is the harness getting thinner where the model got better.

signals:

  - id: 2026-09-21-claude-code-auto-mode-judge-moved-server-side
    status: accepted
    section: control-plane
    source: claude-code
    channel: tagged-release
    title: "Auto mode's judge moved to the server; the docs still list its isolation as none"
    finding_ids:
      - 2026-09-21-claude-code-2-1-278-auto-mode-classifier-moves-server-side-by-default
      - 2026-09-21-claude-code-auto-mode-is-the-starting-mode-and-docs-list-isolation-needed-none
      - 2026-09-21-claude-code-2-1-271-model-names-its-own-egress-hosts-subagent-output-framed-as-subagent
    summary: >
      2.1.278 (2026-09-19, latest; stable is 2.1.267) makes the server-side
      classifier the auto-mode default for API, Enterprise, Bedrock, Vertex,
      Foundry and gateway sessions, four days after 2.1.273 set the local
      classifier as the cloud default. 2.1.271 lets the model name the egress
      hosts a sandboxed command needs, approved by the classifier with no
      human prompt. The permission-modes page lists auto mode as the starting
      mode on Pro, Max and Team with isolation needed "None". On 2026-08-26 a
      researcher published an auto-mode injection with 60 to 80 percent
      success and reported the vendor closed it as not a security boundary.
    why_action_bearing:
      - "Gateway operators: pass the safeguards request field and safeguard_results response field through, or set CLAUDE_CODE_AUTO_MODE_SERVER=0; otherwise the first checked action in each session holds. Record which classifier decided from /status."
      - "Run auto mode that reads untrusted content inside the Bash sandbox or a container with egress control. The docs call that defense in depth; the published attack says it is the boundary."
      - "Evidence that would settle residual: vendor documentation stating what the server-side classifier reviews and how its decisions are logged, and a vendor statement on whether auto mode is a security boundary."
    receipts:
      - url: https://github.com/anthropics/claude-code/releases/tag/v2.1.278
        precision: github_release
      - url: https://code.claude.com/docs/en/permission-modes
        precision: official_docs
      - url: https://embracethered.com/blog/posts/2026/breaking-claude-code-opus-5-and-automode/
        precision: third_party_research

  - id: 2026-09-21-claude-code-stable-is-a-pointer-someone-moves
