      - 2026-09-21-claude-code-2-1-257-authority-batch-project-bypass-ignored-ask-rules-skipped-in-auto
      - 2026-09-21-claude-code-managed-mcp-and-policy-lists-go-fail-closed-allowedmcpservers-semantics-flip
    summary: >
      The Homebrew claude-code cask, which follows the same stable pointer as the
      native installer, moved to 2.1.236 on 2026-08-28 and to 2.1.267 on
      2026-09-15, with nothing between. Latest went from 2.1.251 to 2.1.273 in
      that time. The setup page kept saying stable is about one week old. The
      hop delivered the 2.1.257 authority batch (project bypassPermissions
      ignored, ask rules no longer skipped in auto mode), the 2.1.259 MCP
      allowlist semantics change and the Fable 5.1 default at once.
    why_action_bearing:
      - "Pin minimumVersion to the fixes you need rather than trusting a lag. Stable 2.1.267 has the 2.1.257 authority batch; it lacks 2.1.273's fix for MDM MCP deny lists being ignored beside server-managed settings."
      - "If allowedMcpServers filtered managed-mcp.json, move exclusions to deniedMcpServers before the next stable hop."
      - "Evidence that would settle residual: a published stable-promotion log with dates."
    receipts:
