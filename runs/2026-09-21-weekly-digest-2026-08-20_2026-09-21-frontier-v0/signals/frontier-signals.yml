  - id: 2026-09-21-plugin4shell-a-pin-is-a-request
    status: accepted
    section: platform
    source: gemini-cli
    channel: tagged-release
    title: "A pinned plugin commit was a request, not a check, in four agents"
    finding_ids:
      - 2026-09-21-gemini-cli-extension-install-still-checks-out-fetch-head-after-plugin4shell-disclosure
      - 2026-09-21-github-copilot-cli-plugin4shell-no-changelog-line-names-a-fix-through-1-0-87
      - 2026-09-21-claude-code-plugin4shell-disclosed-in-window-fix-shipped-in-2-1-179-with-a-silent-changelog
    summary: >
      AIR Security (2026-09-17): Claude Code, Codex, Copilot and Gemini CLI
      installed plugins pinned to a commit SHA without verifying the checkout
      landed on it; git prefers a branch named like the SHA, and Gemini CLI
      checks out FETCH_HEAD. Claude Code's fix (2.1.179) has no changelog line;
      Codex's is PR 34644 in 0.146.0. Gemini CLI 0.60.0 still calls
      git.checkout('FETCH_HEAD'), and Google told AIR the tool is deprecated and
      will not be patched. No Copilot changelog line through 1.0.87 names a fix.
    why_action_bearing:
      - "On Copilot CLI and Gemini CLI, treat a pinned plugin or extension as unverified: source it from a host that rejects 40-hex branch names or a repo you control, and check the installed tree's HEAD after install."
      - "The attacker must control the plugin repository. Background auto-update is what makes it zero-click; turn it off where you cannot verify sources."
      - "Evidence that would settle residual: a Copilot CLI release note or advisory naming the fix."
    receipts:
      - url: https://www.air.security/blog-posts/plugin4shell
        precision: third_party_research
      - url: https://github.com/google-gemini/gemini-cli/blob/v0.60.0/packages/cli/src/config/extensions/github.ts
        precision: tagged_commit_file
      - url: https://github.com/anthropics/claude-code/blob/8187baaaafb3/CHANGELOG.md
        precision: tagged_commit_file

  - id: 2026-09-21-gitspawn-the-harness-ran-git-before-trust
    status: accepted
    section: runtime
    source: hermes-agent
    channel: tagged-release
    title: "The harness's own git ran repository code before the trust prompt"
    finding_ids:
      - 2026-09-21-hermes-agent-ghsa-7x36-8jrh-v4pw-a-copied-repo-s-git-config-could-run-code-on-the-host-before-any-promp
      - 2026-09-21-claude-code-gitspawn-ultrareview-path-ran-repo-git-config-before-trust-no-fix-named-through-2-1-278
      - 2026-09-21-codex-untrusted-projects-stop-feeding-agents-md-and-startup-stops-running-workspace-helpers-befo
    summary: >
      Manifold Security (2026-09-01): seven agents run git to orient themselves
      at startup, and a repository's .git/config can set core.fsmonitor to a
      command git then runs as the user, outside any sandbox, before or without
      a prompt. Hermes fixed it in v2026.9.7 (commit f6234d00, GHSA-7x36, not yet
      published); every tag through v2026.8.31 is exposed. Manifold reports a
      second Claude Code path still reproducing on 2.1.252, and no changelog line
      through 2.1.278 names a fix. Codex 0.154.0 stopped running workspace
      helpers before a project is trusted.
    why_action_bearing:
      - "Upgrade Hermes to v2026.9.7 or later. Open untrusted repositories only inside a container or VM; the trust prompt appears after the harness's own git has run."
      - "Before opening a repo you did not create, check .git/config for command-valued keys such as core.fsmonitor and core.hooksPath."
      - "Evidence that would settle residual: a Claude Code changelog line or advisory for the second path, and Grok Build's status (unpatched at 1.0.13 per Manifold)."
    receipts:
      - url: https://www.manifold.security/blog/ai-coding-agents-git-hijack
        precision: third_party_research
      - url: https://github.com/NousResearch/hermes-agent/commit/f6234d00c5d5
        precision: commit

  - id: 2026-09-21-temporal-approvals-server-has-no-login
    status: accepted
    section: control-plane
    source: temporal-agent-harness
    channel: preview-or-beta
    title: "The approvals server binds every interface and asks for no login"
    finding_ids:
      - 2026-09-21-temporal-agent-harness-the-packaged-server-binds-0-0-0-0-with-no-authentication-main-adds-wildcard-cors
      - 2026-09-21-temporal-agent-harness-in-the-coding-example-opencode-always-maps-to-remember-true-which-allow-lists-the-tool-by
      - 2026-09-21-temporal-agent-harness-the-caller-s-agentconfig-approval-policy-wins-over-the-agent-s-default-dangerously-skip
    summary: >
      At 0.4.0 (commit e4bde4be, the PyPI wheel) the packaged serve command
      defaults to host 0.0.0.0, and its FastAPI app registers GET /api/sessions,
      POST /api/approve, POST /api/callback-result and POST /api/operator-commands
      with no authentication. The approvals operator command accepts skip, which
      sets the dangerously_skip_all policy. In the coding example, OpenCode's
      "always" posts remember=true, which allow-lists the tool by name, so one
      "always" on bash covers every later bash command. Main adds wildcard CORS.
    why_action_bearing:
      - "Run serve with --host 127.0.0.1 or behind an authenticating proxy. Anyone who can reach the port can list sessions, approve calls and switch a session to skip all approvals."
      - "Do not answer always to a bash prompt in the coding example; it approves the tool, not the command shown."
      - "Evidence that would settle residual: a release that binds loopback by default or adds authentication; #137 on main removes the operator-command channel but is in no tag."
    receipts:
      - url: https://github.com/temporal-community/temporal-agent-harness/blob/e4bde4beb078d7ec3432c84b71e64e1efd554752/temporal_agent_harness/web/cli.py#L121
        precision: tagged_commit_file
      - url: https://github.com/temporal-community/temporal-agent-harness/blob/e4bde4beb078d7ec3432c84b71e64e1efd554752/temporal_agent_harness/web/app.py#L281-L310
        precision: tagged_commit_file

  - id: 2026-09-21-openhands-docker-runtime-was-ignored
    status: accepted
    section: runtime
    source: openhands
    channel: tagged-release
    title: "Asking for Docker got you the host until v1.20.0"
    finding_ids:
      - 2026-09-21-openhands-docker-conversation-runtime-settings-reach-the-bundled-agent-server-v1-20-0-docker-executi
      - 2026-09-21-openhands-profiles-become-enforceable-scopes-mcp-servers-v1-19-0-and-secrets-v1-20-0-with-a-skill
    summary: >
      Before v1.20.0 (2026-09-17), OH_CONVERSATION_RUNTIME=docker was not
      forwarded to the bundled agent server, so conversations ran locally on the
      host. PR 17462 (merge 3b29fd61) is an ancestor of v1.20.0 and not of
      v1.19.0. The same two releases made profiles enforceable scopes for MCP
      servers (v1.19.0) and secrets (v1.20.0); before v1.19.0 every profile could
      reach every MCP server.
    why_action_bearing:
      - "If you set the Docker runtime on OpenHands before v1.20.0, assume those conversations ran on the host and audit what they touched. Upgrade to v1.20.0."
      - "Evidence that would settle residual: a runtime probe on v1.20.0 showing the conversation process inside the container."
    receipts:
      - url: https://github.com/OpenHands/OpenHands/pull/17462
        precision: merged_pr
      - url: https://github.com/OpenHands/OpenHands/releases/tag/v1.20.0
        precision: github_release

