  - id: 2026-09-21-gemini-cli-autoedit-was-not-path-checked
    status: accepted
    section: control-plane
    source: gemini-cli
    channel: tagged-release
    title: "Gemini CLI's autoEdit path rule never loaded, and its macOS sandbox reached Docker"
    finding_ids:
      - 2026-09-21-gemini-cli-autoedit-path-check-never-loaded-and-seatbelt-reached-docker-socket
      - 2026-09-21-gemini-cli-v0-59-0-and-v0-60-0-harden-mcp-oauth-web-fetch-credentials-and-extensions
      - 2026-09-21-gemini-cli-v0-57-0-promotes-every-preview-only-item-from-the-previous-brief
    summary: >
      v0.58.0 (2026-09-01) fixes an allowed-path rule for write_file and replace in
      autoEdit mode that the loader silently discarded (PR 28961), and a Seatbelt
      profile that let a sandboxed process reach a Docker, OrbStack, Colima or
      Rancher socket and mount the host (PR 28935). Neither got an advisory.
      v0.59.0 and v0.60.0 add an MCP OAuth SSRF guard, issuer checks, web_fetch
      address pinning, and stop mounting host tokens into container sandboxes.
      v0.57.0 carried every preview-only item from the previous issue.
    why_action_bearing:
      - "Upgrade to 0.60.0. Treat autoEdit sessions on 0.57.0 or earlier as having written wherever the model chose, and macOS-sandboxed sessions with a container runtime running as host-capable."
      - "0.60.0 breaks MCP OAuth servers that omit iss and web_fetch to local dev servers, by design."
    receipts:
      - url: https://github.com/google-gemini/gemini-cli/pull/28961
        precision: merged_pr
      - url: https://github.com/google-gemini/gemini-cli/pull/28935
        precision: merged_pr
      - url: https://github.com/google-gemini/gemini-cli/releases/tag/v0.60.0
        precision: github_release

  - id: 2026-09-21-the-harness-changes-the-bill-not-the-grade
    status: accepted
    section: runtime
    source: pi-coding-agent
    channel: tagged-release
    title: "The harness changed the bill, not the grade"
    finding_ids:
      - 2026-09-21-pi-coding-agent-harnesstax-study-same-model-same-success-up-to-five-times-the-cost
      - 2026-09-21-claude-code-agents-md-support-and-task-scaffolding-removed-for-current-models
      - 2026-09-21-pi-coding-agent-the-dev-harness-reached-main-and-a-tag-in-v0-85-0-its-plugin-surface-was-published-to-npm
    summary: >
      HarnessTax (UC Berkeley and Arena, 2026-09-16) ran seven models through
      Claude Code, Codex CLI and Pi on SWE-bench Lite and Terminal-Bench 2.0
      samples and found harness choice had little effect on success holding the
      model fixed, while cost moved up to fivefold. The same window Claude Code
      stopped offering its task-tracking tools on current models (2.1.268),
      removed TaskOutput and read AGENTS.md (2.1.277), and Pi's rewritten
      harness reached a tag in v0.85.0.
    why_action_bearing:
      - "For API-metered work, measure your own tasks in a minimal harness before assuming the vendor harness earns its overhead. The study is 30 tasks per benchmark; long-horizon and subscription use are outside it."
      - "Hooks or transcript parsers keyed on TodoWrite or TaskOutput lose their signal on current Claude models; delete CLAUDE.md shims that only point at AGENTS.md once past 2.1.277."
    receipts:
      - url: https://arena.ai/blog/coding-agents-harness-tax
        precision: third_party_research
      - url: https://github.com/anthropics/claude-code/releases/tag/v2.1.268
        precision: github_release
      - url: https://github.com/earendil-works/pi/releases/tag/v0.85.1
        precision: github_release

  - id: 2026-09-21-omnigent-policy-outage-falls-through-to-the-harness
    status: accepted
    section: control-plane
    source: omnigent
    channel: tagged-release
    title: "When Omnigent's policy server is down, the wrapped harness decides"
    finding_ids:
      - 2026-09-21-omnigent-governance-layering-on-policy-server-outage-native-claude-codex-tool-calls-now-defer-to
      - 2026-09-21-omnigent-omnigent-now-answers-wrapped-harnesses-safety-prompts-and-flips-their-approval-routing
      - 2026-09-21-omnigent-three-bundle-upload-advisories-published-2026-09-16-all-fixed-in-v0-14-0-by-one
    summary: >
      PR 6429 (merge 3f0d9771, in v0.13.0 and not v0.12.0) makes native Claude
      Code and Codex tool calls fail to ask rather than deny when Omnigent's
      policy server is unreachable, so the wrapped harness's own dialog decides;
      prompt submission still fails closed. Since v0.12.0 Omnigent answers Claude
      Code's bypass-permissions consent prompt for it, and the default Codex Auto
      mode routes escalations to Codex's own auto-reviewer. Three advisories
      published 2026-09-16 (GHSA-598r critical, GHSA-q5jc and GHSA-p5x3 high) let
      an uploaded bundle escape the workspace or run Python on the server; all are
      fixed in v0.14.0 (2026-09-15).
    why_action_bearing:
      - "Upgrade shared Omnigent servers to v0.14.0. Anyone who can upload an agent bundle could get a host shell before it."
      - "Know which layer refuses: during a policy-server outage your Omnigent deny rules do not apply to native tool calls; the harness's permission mode does. Set that mode as if Omnigent were absent."
      - "Evidence that would settle residual: a tag containing the editor shell-proxy fix (#7619), which reached v0.15.0 on 2026-09-22, after this window."
    receipts:
      - url: https://github.com/omnigent-ai/omnigent/pull/6429
        precision: merged_pr
      - url: https://github.com/omnigent-ai/omnigent/security/advisories/GHSA-598r-29w2-g93q
        precision: official_docs
      - url: https://github.com/omnigent-ai/omnigent/releases/tag/v0.14.0
        precision: github_release

  - id: 2026-09-21-eve-queued-messages-ran-under-the-last-sender
    status: accepted
    section: control-plane
    source: eve
    channel: tagged-release
    title: "Queued messages from different users ran under the last sender's authorization"
    finding_ids:
      - 2026-09-21-eve-cross-principal-authority-queued-messages-from-different-users-ran-under-the-last-sender
      - 2026-09-21-eve-credential-exposure-byok-provider-key-served-from-eve-v1-info-chatgpt-login-stored-in-plai
      - 2026-09-21-eve-auto-a-model-can-now-approve-tool-calls
    summary: >
      PR 3172 (merge 3bbf8e5c, in eve@0.52.5 and not 0.52.4) groups queued
      deliveries by auth context; before it, messages from different users
      queued behind a running turn ran as one turn under the last sender's
      authorization. The previous issue told operators to set turnPolicy queue.
      PR 3203 (same release) stopped /eve/v1/info serializing the owner's BYOK
      provider API key to any caller the channel admits. eve@0.59.1 adds auto(),
      a model that approves tool calls and falls back to a human if review fails.
    why_action_bearing:
      - "If you set turnPolicy queue on a multi-user channel, run eve@0.52.5 or later; before it, one user's message could run with another's authority."
      - "Rotate any BYOK provider key served by an eve deployment older than 0.52.5."
      - "Evidence that would settle residual: the first version that exposed the BYOK key, which the release notes do not state."
    receipts:
      - url: https://github.com/vercel/eve/pull/3172
        precision: merged_pr
      - url: https://github.com/vercel/eve/pull/3203
        precision: merged_pr
      - url: https://github.com/vercel/eve/releases/tag/eve%400.52.5
        precision: github_release

  - id: 2026-09-21-omp-the-repository-writes-the-policy
    status: accepted
    section: control-plane
    source: omp
    channel: tagged-release
    title: "In OMP, the repository you open can write the policy that governs it"
    finding_ids:
      - 2026-09-21-omp-a-repository-under-review-can-write-omp-s-policy-project-local-config-and-extensions-load
      - 2026-09-21-omp-v18-2-1-closes-a-cluster-of-approval-bypasses-including-one-where-a-missing-context-resolv
      - 2026-09-21-omp-collab-relay-sessions-a-view-only-link-could-steer-the-session-after-a-host-reconnect-fixe
    summary: >
      At v18.2.8 OMP's extension types say project-local .omp/config.yml and
      .omp/extensions "are already discovered and loaded unconditionally" and that
      isProjectTrusted "always returns true"; the approval docs list yolo as the
      default mode and project config above global config in precedence. A Pi
      extension that consults Pi's per-directory trust gate is told the project is
      trusted. v18.2.1 (2026-09-15) closed a cluster of approval bypasses,
      including a tool run with no approval context being treated as approved,
      and a view-only collab link that could steer a session after the host
      reconnected. None got an advisory.
    why_action_bearing:
      - "Do not open an untrusted repository in OMP. Inspect .omp/config.yml, .omp/extensions and package.json omp.extensions or pi.extensions in any clone first."
